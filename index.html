/* ================= exercise engine ================= */
function exHTML(key,q,meta,num){
 QS[key]=Object.assign({q},meta);
 let body="";
 if(q.img)body+=`<div class="pic" aria-hidden="true">${q.img}</div>`;
 if(q.t==="mc"){body+=`<div class="opts ${q.big?"pics":""}">${q.o.map((s,i)=>`<button class="opt ${q.big?"big":""}" data-k="${i}">${fmt(s)}</button>`).join("")}</div>`;EXS[key]={tries:0,done:false}}
 else{let sh=shuffle(q.w),g=0;while(sh.join("|")===q.w.join("|")&&g++<10)sh=shuffle(q.w);
  EXS[key]={tries:0,done:false,picked:[],bank:sh};
  body+=`<div class="build"></div><div class="bank">${sh.map((w,i)=>`<button class="tok" data-b="${i}">${w}</button>`).join("")}</div><div class="ex-actions"><button class="btn" data-check>Check</button><button class="btn ghost" data-clear>Clear</button></div>`}
 const cat=meta.mode==="X"?`<p class="catlab">${meta.cat} · ${meta.label}</p>`:"";
 return `<div class="ex" data-key="${key}">${cat}<div class="ex-q"><span class="ex-n">${num!=null?num:meta.k+1}</span><div>${fmt(q.q)}</div></div>${body}<div class="fb" hidden></div></div>`}
function answerText(q){return q.t==="mc"?strip(q.o[q.a]):q.w.join(" ")}
function fbHTML(kind,q,head){if(kind==="hint")return `<p class="head">${head}</p><p><span class="lang">HINT</span>${fmt(q.h)}</p>`;
 return `<p class="head">${head}</p><p><span class="lang">EN</span>${fmt(q.x)}</p><p><span class="lang">DE</span>${fmt(q.xd)}</p>`}
function record(meta,score,yours){const q=meta.q;
 if(meta.mode==="L"){S.scores[meta.bucket]=S.scores[meta.bucket]||{};S.scores[meta.bucket][meta.k]=score}
 if(score<1){S.log.unshift({label:meta.label,level:st.level,q:strip(q.q)+(q.img?" "+q.img:""),yours,correct:answerText(q),x:q.x,xd:q.xd,mode:meta.mode==="X"?"Test":"Practice",time:Date.now()});S.log=S.log.slice(0,200)}
 save();
 if(meta.mode==="L"&&topic(meta.bucket)){const el=document.getElementById("tscore");const m=mastery(meta.bucket);if(el&&m)el.textContent=`Topic score: ${m.pct}% (${m.done}/${m.total} answered)`;
  const sb=document.querySelector(`.side button[data-topic="${meta.bucket}"] .pct`);if(sb&&m)sb.textContent=m.pct+"%"}
 const ps=document.getElementById("pscore");if(ps)ps.textContent=roundScore()}
function handleResult(exEl,key,correct,yours){
 const s=EXS[key],meta=QS[key],q=meta.q,fb=exEl.querySelector(".fb"),test=meta.mode==="X";s.tries++;
 if(correct){s.done=true;const score=s.tries===1?1:.5;fb.className="fb ok";fb.innerHTML=fbHTML("ok",q,s.tries===1?"Richtig. Correct.":"Richtig, with a hint.");fb.hidden=false;
  record(meta,score,s.firstWrong||yours);lock(exEl,q,true);if(test)testAnswered(meta,score);if(meta.round)meta.round.push(score)}
 else if(s.tries===1&&!test){s.firstWrong=yours;fb.className="fb hint";fb.innerHTML=fbHTML("hint",q,"Not quite. Try again.");fb.hidden=false}
 else{s.done=true;fb.className="fb bad";fb.innerHTML=fbHTML("bad",q,`Falsch. Correct answer: ${fmt(answerText(q))}`);fb.hidden=false;
  record(meta,0,yours);lock(exEl,q,false);if(test)testAnswered(meta,0);if(meta.round)meta.round.push(0)}
 if(q.say&&(correct||s.done))say(q.say)}
function lock(exEl,q,ok){if(q.t==="mc"){exEl.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("yes")})}
 else{exEl.querySelectorAll(".tok,[data-check],[data-clear]").forEach(b=>b.disabled=true);if(!ok)exEl.querySelector(".build").innerHTML=q.w.map(w=>`<span class="tok" style="border-color:var(--ok);color:var(--ok)">${w}</span>`).join("")}}

function vocabQ(L,v,mode){

 if(mode==="pick"){const opts=shuffle([v].concat(pick(others,3)));return {t:"mc",q:`Welches Bild ist <b>${word}</b>?`,o:opts.map(x=>x[0]),big:true,a:opts.indexOf(v),h:`'${v[2]}' means something in English that starts with '${v[4][0]}'.`,x:`${word} = ${v[4]} ${v[0]}.${pl}`,xd:`${word} ${v[0]}.`,say:word}}
 const opts=shuffle([v].concat(pick(others,3)));return {t:"mc",q:"Was ist das?",img:v[0],o:opts.map(x=>x[1]+" "+x[2]),a:opts.indexOf(v),h:`In English it starts with '${v[4][0]}'.`,x:`${v[0]} = <b>${word}</b> (${v[4]}).${pl}`,xd:`Das ist ${word}.`,say:word}}
function sceneQ(sc){const opts=shuffle([sc[1],sc[2],sc[3]]);return {t:"mc",q:"Which sentence describes the picture?",img:sc[0],o:opts,a:opts.indexOf(sc[1]),h:sc[5].split(".")[0]+".",x:`<i>${sc[4]}</i> ${sc[5]}`,xd:sc[6],say:sc[1]}}

 else if(st.pmode==="flash"){PR.fc={deck:shuffle(L.vocab),i:0,flip:false,known:0,again:0}}
 else if(st.pmode==="build"){const pool=[];L.topics.forEach(tid=>topic(tid).ex.forEach(e=>{let de=strip(fmt(e[1])).trim();const en=strip(fmt(e[0]));if(/[\/…]/.test(de))return;de=de.replace(/[.!]$/,"");const w=de.split(/\s+/);if(w.length<3||w.length>9)return;pool.push({en,de,w,tid})}));
  PR.items=pick(pool,6).map(p=>({t:"ord",q:`<i>${esc(p.en)}</i><br><small style="color:var(--muted)">Start with: <b>${esc(p.w[0])}</b></small>`,w:p.w,h:"Find the conjugated verb first: it goes in position 2. Infinitives, participles and separable prefixes go last.",x:`${esc(p.de)}. (Topic: ${topic(p.tid).title})`,xd:`Richtig: ${esc(p.de)}.`,say:p.de}))}
 else if(st.pmode==="dict"){const pool=L.reading.flatMap(r=>r.s.map(x=>[x[0],x[1]])).concat(L.listening.flatMap(d=>d.l.map(x=>[x[1],x[2]]))).filter(p=>{const n=p[0].split(/\s+/).length;return n>=3&&n<=10});PR.items=pick(pool,6);PR.dt={}}

function practiceHTML(){const L=lvl();if(!PR.lv||PR.lv!==L.id+st.pmode){PR.lv=L.id+st.pmode;newRound()}

const ACLS={der:"g-m",die:"g-f",das:"g-n"};
function flashHTML(L){const f=PR.fc;
 if(f.i>=f.deck.length)return `<div class="results"><h2>Deck finished</h2><p>You knew ${f.known} of ${L.vocab.length} words on the first go${f.again?`, and repeated ${f.again} card${f.again===1?"":"s"}`:""}.</p><p><button class="btn" data-newround>Shuffle and start again</button></p></div>`;

function normDE(x){return String(x).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[.,!?;:„“"'‚‘’…()\-–]/g," ").replace(/\s+/g," ").trim()}

 m.forEach((w,i)=>{const j=pool.indexOf(w);if(j>=0){hit++;pool.splice(j,1)}else miss.push(orig[i]||w)});return{ratio:m.length?hit/m.length:0,miss,extra:pool.length,exact:normDE(user)===normDE(model)}}

const SYN=window.speechSynthesis;let VOICES=[];
function loadVoices(){try{VOICES=SYN.getVoices().filter(v=>/^de/i.test(v.lang))}catch(e){VOICES=[]}}
if(SYN){loadVoices();try{SYN.onvoiceschanged=()=>{loadVoices();const n=document.getElementById("voicenote");if(n)n.innerHTML=voiceNote()}}catch(e){}}
let RATE=0.95,playing=false;
function voiceNote(){if(!SYN)return "Audio isn't available in this browser. Show the German text to read along instead.";return VOICES.length?`German voice: ${esc(VOICES[0].name)}${VOICES.length>1?` (+${VOICES.length-1} more)`:""}.`:"No German voice found on this device. Audio may sound English; install a German voice in your system settings, or show the text."}
function say(text,spk,onend){if(!SYN){onend&&onend();return}try{const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=RATE;
 if(VOICES.length){const idx=spk==="B"?1:spk==="C"?2:0;u.voice=VOICES[idx%VOICES.length]}
 if(spk==="B"&&VOICES.length<2)u.pitch=0.75;if(spk==="C"&&VOICES.length<3)u.pitch=1.25;
 u.onend=()=>onend&&onend();u.onerror=()=>onend&&onend();SYN.speak(u)}catch(e){onend&&onend()}}
function stopAudio(){playing=false;try{SYN&&SYN.cancel()}catch(e){}document.querySelectorAll(".line.now").forEach(x=>x.classList.remove("now"))}
function playFrom(lines,i){if(!playing||i>=lines.length){stopAudio();return}const el=document.querySelector(`.line[data-line="${i}"]`);document.querySelectorAll(".line.now").forEach(x=>x.classList.remove("now"));if(el)el.classList.add("now");say(lines[i][1],lines[i][0],()=>setTimeout(()=>playFrom(lines,i+1),350))}

let CONV={};
function convKey(){return st.level+":"+st.idx}
function getConv(){const k=convKey();if(!CONV[k]){const sc=lvl().speaking[st.idx];CONV[k]={turns:[{role:"ai",de:sc.opener[0],en:sc.opener[1]}],busy:false,feedback:null,showEn:false}}return CONV[k]}
function smode(){return st.smode||(ME.ready&&!ME.sample?"script":"ai")}
function speakTabs(){const m=smode();return `<div class="subtabs" role="group" aria-label="Speaking mode"><button class="tg" data-smode="ai" aria-pressed="${m==="ai"}">AI partner</button><button class="tg" data-smode="script" aria-pressed="${m==="script"}">Script practice (no AI)</button></div>`}
let SPS={};
function spKey(){return st.level+":"+(st.sidx||0)}
function spState(){const k=spKey();if(!SPS[k])SPS[k]={role:null,i:0,res:{},showEn:false};return SPS[k]}
function spAdvance(){const d=lvl().listening[st.sidx||0],s=spState();const q=[];while(s.i<d.l.length&&d.l[s.i][0]!==s.role){q.push(d.l[s.i]);s.i++}
 (function next(k){if(k>=q.length)return;say(q[k][1],q[k][0],()=>setTimeout(()=>next(k+1),250))})(0)}
function scriptHTML(){const L=lvl();if((st.sidx||0)>=L.listening.length)st.sidx=0;const d=L.listening[st.sidx||0],s=spState();
 const list=`<div class="itemlist">${L.listening.map((x,i)=>`<button class="itembtn" data-sitem="${i}" aria-current="${i===(st.sidx||0)}"><small>Dialogue ${i+1}</small>${x.title}</button>`).join("")}</div>`;
 const roles=[...new Set(d.l.map(x=>x[0]))];
 const head=`<div class="sechead"><div><p class="eyebrow">${L.name} · Sprechen</p><h1>Speaking</h1><p>Script practice works without AI. Choose a dialogue and a role. The other person speaks; when it's your turn you see the English, say the German out loud, type it, and compare with the model.</p></div></div>${speakTabs()}${list}`;
 if(!s.role)return head+`<div class="brief" style="max-width:560px"><h3>${esc(d.title)}</h3><p style="margin:0 0 10px;color:var(--muted)">${esc(d.de)} · ${d.l.length} lines</p><p><b>Which role do you want to play?</b></p><div class="ex-actions">${roles.map(r=>`<button class="btn" data-srole="${r}">Play ${esc(d.who[r]||r)}</button>`).join("")}</div></div>`;
 const mine=d.l.filter(x=>x[0]===s.role).length,doneMine=Object.keys(s.res).length;
 let lines=d.l.slice(0,s.i).map((x,j)=>{if(x[0]!==s.role)return `<div class="bub ai"><span class="nm">${esc(d.who[x[0]]||x[0])}</span>${esc(x[1])}${s.showEn?`<span class="en">${esc(x[2])}</span>`:""}<div class="tools"><button data-say="${esc(x[1])}">🔊 Listen</button></div></div>`;
  const r=s.res[j]||{};const cls=r.ratio>=.8?"okc":"";return `<div class="bub me"><span class="nm">You</span>${esc(r.you||"(skipped)")}</div><div class="corr ${cls}"><b>${r.ratio>=.8?"✓ Sehr gut":r.ratio>=.5?"Close":"Model"}:</b> ${esc(x[1])} <button class="tg" style="padding:0 8px;font-size:12px" data-say="${esc(x[1])}">🔊</button>${r.miss&&r.miss.length&&r.ratio<1?`<br><small>Check: ${r.miss.map(esc).join(", ")}</small>`:""}</div>`}).join("");
 let cur="";
 if(s.i<d.l.length){const x=d.l[s.i];cur=`<div class="corr" style="align-self:stretch;max-width:none"><b>Your turn.</b> Say this in German: <i>${esc(x[2])}</i></div>`}
 else{const good=Object.values(s.res).filter(r=>r.ratio>=.8).length;cur=`<div class="corr okc" style="align-self:stretch;max-width:none"><b>Dialogue finished.</b> ${good} of ${mine} lines matched the model closely.</div>`}
 const turn=s.i<d.l.length;
 return head+`<div class="speak"><div><div class="chat" id="chat">${lines}${cur}</div>
 ${turn?`<div class="compose"><label for="sline" style="position:absolute;left:-9999px">Your line in German</label><textarea id="sline" placeholder="Sag es auf Deutsch …"></textarea><button class="btn" data-scheck>Check</button></div>`:""}
 <div class="ex-actions">${turn?`<button class="btn ghost sm" data-sskip>Show me the line</button>`:""}<button class="tg" data-senall aria-pressed="${s.showEn}">${s.showEn?"Hide":"Show"} English for partner</button><button class="btn ghost sm" data-srestart>Start over</button><button class="btn ghost sm" data-sswitch>Switch role</button></div></div>
 <aside class="brief"><h3>${esc(d.title)}</h3><p style="margin:0;color:var(--muted)">You are <b>${esc(d.who[s.role]||s.role)}</b> · ${doneMine} / ${mine} of your lines done</p><p class="note">Tip: say each line out loud before you type it. On a phone you can dictate with the keyboard's microphone.</p></aside></div>`}
function scriptCheck(skip){const d=lvl().listening[st.sidx||0],s=spState();if(s.i>=d.l.length)return;const x=d.l[s.i];const ta=document.getElementById("sline");const val=skip?"":(ta?ta.value.trim():"");
 if(!skip&&!val){ta&&ta.focus();return}
 const r=skip?{ratio:0,miss:[]}:wordMatch(val,x[1]);s.res[s.i]={you:val,ratio:r.exact?1:r.ratio,miss:r.miss};
 if(!skip&&r.ratio<.8)S.log.unshift({label:lvl().name+" script: "+d.title,level:st.level,q:"Say: "+x[2],yours:val,correct:x[1],x:x[2],xd:x[1],mode:"Speaking",time:Date.now()});
 S.speak["script:"+spKey()]=Date.now();save();say(x[1],s.role);s.i++;spAdvance();render()}

function speakingHTML(){if(smode()==="script")return scriptHTML();const L=lvl();if(st.idx>=L.speaking.length)st.idx=0;const sc=L.speaking[st.idx],c=getConv();
 const aiOn=!!ME.sample;
 const chat=c.turns.map((t,i)=>t.role==="ai"?`<div class="bub ai"><span class="nm">Partner</span>${esc(t.de)}${(c.showEn||t.showEn)&&t.en?`<span class="en">${esc(t.en)}</span>`:""}<div class="tools"><button data-sayturn="${i}">🔊 Listen</button>${t.en?`<button data-turnen="${i}">${t.showEn?"Hide":"Show"} English</button>`:""}</div></div>`
  :`<div class="bub me"><span class="nm">You</span>${esc(t.de)}</div>${t.corr?`<div class="corr"><b>Better:</b> ${esc(t.corr.better)}<br><span class="lang">EN</span>${esc(t.corr.why_en||"")}<br><span class="lang">DE</span>${esc(t.corr.why_de||"")}</div>`:t.checked?`<div class="corr okc">✓ Correct German</div>`:""}`).join("")+(c.busy?`<div class="bub ai thinking">Partner is typing…</div>`:"");
 const fb=c.feedback?feedbackHTML(c.feedback):"";
 return `<div class="sechead"><div><p class="eyebrow">${L.name} · Sprechen</p><h1>Speaking</h1><p>You play yourself. The AI plays the other person, answers in ${L.name} German, and quietly corrects each of your messages. On a phone, tap the microphone on your keyboard to speak instead of typing.</p></div></div>${speakTabs()}${itemList(L.speaking,"Role-play")}
 <div class="speak"><div>
  ${aiOn||!ME.ready?"":`<div class="banner">The AI partner needs this page opened in claude.ai while signed in. Switch to <b>Script practice (no AI)</b> above to practise speaking without it.</div>`}
  <div class="chat" id="chat">${chat}</div>
  <div class="compose"><label for="say" style="position:absolute;left:-9999px">Your answer in German</label><textarea id="say" placeholder="Antworte auf Deutsch …" ${aiOn&&!c.busy?"":"disabled"}></textarea><button class="btn" data-send ${aiOn&&!c.busy?"":"disabled"}>Send</button></div>
  <div class="ex-actions"><button class="tg" data-allen aria-pressed="${c.showEn}">${c.showEn?"Hide":"Show"} all English</button><button class="tg" data-autosay aria-pressed="${!!S.autosay}">Read replies aloud: ${S.autosay?"on":"off"}</button><button class="btn ghost sm" data-feedback ${aiOn&&c.turns.length>2&&!c.busy?"":"disabled"}>Finish and get feedback</button><button class="btn ghost sm" data-restart>Start over</button></div>
  <div id="fbbox">${fb}</div>
 </div>
 <aside class="brief"><h3>${esc(sc.title)}</h3><p style="margin:0;color:var(--muted)">Partner: ${esc(sc.ai)} · uses <b>${sc.reg}</b></p><p style="margin:10px 0 0"><b>Your goals</b></p><ul>${sc.goal.map(g=>`<li>${esc(g)}</li>`).join("")}</ul><p style="margin:10px 0 0"><b>Useful phrases</b> <small style="color:var(--muted)">tap to insert</small></p><div class="ph">${sc.phrases.map(p=>`<button data-phrase="${esc(p[0])}">${esc(p[0])}<small>${esc(p[1])}</small></button>`).join("")}</div></aside></div>`}
function afterSpeakRender(){const ch=document.getElementById("chat");if(ch)ch.scrollTop=ch.scrollHeight;const ta=document.getElementById("say");if(ta&&!ta.disabled&&getConv().turns.length>1)ta.focus({preventScroll:true})}
function feedbackHTML(f){if(f.error)return `<div class="feedback"><p>${esc(f.error)}</p></div>`;
 const li=a=>(a||[]).map(x=>`<li>${typeof x==="string"?esc(x):esc(x.de||"")+(x.en?` <i style="color:var(--muted)">(${esc(x.en)})</i>`:"")}</li>`).join("");
 return `<div class="feedback"><h3>What you did well</h3><ul>${li(f.well)}</ul>
 <h3>Mistakes to fix</h3>${(f.mistakes||[]).length?`<div class="mist">${f.mistakes.map(m=>`<div class="mi"><span class="wrong">${esc(m.you)}</span><span class="right">${esc(m.better)}</span><span class="why">${esc(m.why_en)} · <i>${esc(m.why_de||"")}</i></span></div>`).join("")}</div>`:"<p>No grammar mistakes. Gut gemacht!</p>"}
 <h3>Words you could have used</h3><ul>${li(f.vocab)}</ul>
 <h3>Review next</h3><p>${esc(f.review||"")}</p></div>`}
function transcript(c){return c.turns.map(t=>(t.role==="ai"?"PARTNER: ":"LEARNER: ")+t.de).join("\n")}
async function sendTurn(text){const L=lvl(),sc=L.speaking[st.idx],c=getConv();if(!text.trim()||c.busy)return;
 c.turns.push({role:"me",de:text.trim()});c.busy=true;render();
 const prompt=`You are a German conversation partner in a role-play for a learner at CEFR level ${L.name}.
Your role: ${sc.ai}. Address the learner with "${sc.reg}". Scenario: ${sc.title}. The learner's goals: ${sc.goal.join("; ")}.
Rules for your reply: stay in role; write ONLY natural, everyday German as spoken in Germany, using grammar and vocabulary suitable for ${L.name}; 1 to 3 short sentences; keep the conversation going, usually with one question. Never correct the learner inside "reply".
Separately, check ONLY the learner's last message for grammar, word order, case, article or word-choice errors. If it is correct and natural, set "correction" to null. If not, give the corrected sentence and a one-sentence explanation in English and the same in very simple German. Ignore missing punctuation and capitalisation of the first word.
Conversation so far:
${transcript(c)}
Reply with only JSON: {"reply":"German reply","reply_en":"English translation of your reply","correction":null or {"better":"corrected learner sentence","why_en":"...","why_de":"..."}}`;
 try{const r=await ME.sample.json(prompt,{modelTier:"quick",cache:false});
  const me=c.turns[c.turns.length-1];if(r&&r.correction&&r.correction.better)me.corr=r.correction;else me.checked=true;
  c.turns.push({role:"ai",de:String(r&&r.reply||"…"),en:String(r&&r.reply_en||"")});
  S.speak[convKey()]=Date.now();save();
  if(me.corr)S.log.unshift({label:L.name+" speaking: "+sc.title,level:L.id,q:"Speaking",yours:me.de,correct:me.corr.better,x:me.corr.why_en,xd:me.corr.why_de,mode:"Speaking",time:Date.now()});
  if(S.autosay)say(c.turns[c.turns.length-1].de,"B")}
 catch(e){c.turns.push({role:"ai",de:e&&e.code==="not_granted"?"(The AI partner wasn't allowed. Reload and allow Claude to answer.)":e&&e.code==="rate_limited"?"(Too many messages at once. Wait a moment and send again.)":"(The partner couldn't answer. Please send your message again.)",en:""});c.turns.splice(c.turns.length-2,1)}
 c.busy=false;if(st.sec==="speaking")render()}
async function getFeedback(){const L=lvl(),sc=L.speaking[st.idx],c=getConv();c.busy=true;render();
 const prompt=`A German learner at CEFR ${L.name} just did this role-play: "${sc.title}" (partner: ${sc.ai}). Goals: ${sc.goal.join("; ")}.
Transcript:
${transcript(c)}
Give feedback on the LEARNER's German only. Reply with only JSON:
{"well":["2-3 short points in English about what they did well"],"mistakes":[{"you":"learner's original sentence","better":"corrected natural German","why_en":"one-sentence reason","why_de":"same in simple German"}],"vocab":[{"de":"useful German word or phrase they could have used","en":"English"}],"review":"one grammar topic to review next, in English, one sentence"}
List at most 5 mistakes and 4 vocab items.`;
 try{c.feedback=await ME.sample.json(prompt,{modelTier:"default",cache:false})}catch(e){c.feedback={error:"Feedback couldn't be generated right now. Try again in a moment."}}
 c.busy=false;if(st.sec==="speaking")render()}

function newTest(scope){const tops=scope==="all"?LEVELS.flatMap(l=>l.topics):lvl().topics;const per=scope==="all"?1:2;const set=[];
 tops.forEach(t=>{shuffle(topic(t).q.map((_,i)=>i)).slice(0,per).forEach(i=>set.push([t,i]))});testSet={items:shuffle(set),answers:[],scope}}
function testHTML(){const L=lvl();
 let h=`<div class="sechead"><div><p class="eyebrow">Abschlusstest</p><h1>Test</h1><p>One attempt per question, no hints. You see the explanation right after each answer, then a score per category and your weakest topics. This is a self-check, not an official CEFR certificate.</p></div></div>
 <div class="test-start"><button class="btn" data-newtest="level">${L.name} test (${L.topics.length*2} questions)</button><button class="btn ghost" data-newtest="all">Everything so far (${LEVELS.reduce((a,l)=>a+l.topics.length,0)} questions)</button></div>`;
 if(!testSet)return h;const n=testSet.items.length,a=testSet.answers.length;
 h+=`<div class="progress"><div class="bar2"><span id="tbar" style="width:${a/n*100}%"></span></div><span class="t" id="tcount">${a} / ${n}</span></div><div id="tresults">${a===n?resultsHTML():""}</div>`;
 h+=testSet.items.map(([t,k],i)=>exHTML("X:"+i,topic(t).q[k],{bucket:t,k,mode:"X",label:topic(t).title,cat:CAT[t],tid:t},i+1)).join("");return h}
function testAnswered(meta,score){testSet.answers.push({tid:meta.tid,score});const n=testSet.items.length,a=testSet.answers.length;
 const bar=document.getElementById("tbar");if(bar)bar.style.width=(a/n*100)+"%";const c=document.getElementById("tcount");if(c)c.textContent=a+" / "+n;
 if(a===n){const r=document.getElementById("tresults");r.innerHTML=resultsHTML();r.scrollIntoView({behavior:"smooth",block:"start"})}}
function resultsHTML(){const by={},tb={};let tot=0;
 testSet.answers.forEach(({tid,score})=>{const c=CAT[tid];by[c]=by[c]||[0,0];by[c][0]+=score;by[c][1]++;tb[tid]=tb[tid]||[0,0];tb[tid][0]+=score;tb[tid][1]++;tot+=score});
 const pct=Math.round(tot/testSet.items.length*100);
 const level=pct>=85?"Strong result. Your answers show this material is secure. Move on to the next level.":pct>=65?"Good base with gaps. Review the weakest categories below, then retake the test.":pct>=45?"The basics are partly there. Redo the grammar practice for the weak topics before moving on.":"Go back through this level's grammar topics one by one, then retest.";
 const cats=Object.entries(by).map(([c,[s,t]])=>[c,Math.round(s/t*100)]).sort((a,b)=>a[1]-b[1]);
 const weak=Object.entries(tb).map(([id,[s,t]])=>[id,s/t]).filter(x=>x[1]<1).sort((a,b)=>a[1]-b[1]).slice(0,5);
 return `<div class="results"><h2>Result: ${pct}%</h2>${cats.map(([c,p])=>`<div class="catrow"><span>${c}</span><span class="bar3"><span style="width:${p}%;background:${p>=80?"var(--ok)":p>=55?"var(--verb)":"var(--bad)"}"></span></span><span class="v">${p}%</span></div>`).join("")}
 <div class="level"><b>Where you are:</b> ${level}</div>
 ${weak.length?`<p style="margin-top:14px"><b>Top weaknesses to review:</b></p>${weak.map(([id])=>`<button class="chiplink" data-gotopic="${id}">${topicLevel(id).name} · ${topic(id).title}</button>`).join("")}`:`<p style="margin-top:14px"><b>No weak topics in this test.</b></p>`}</div>`}

 try{const [rq,mm,pg]=await Promise.all([ME.db.collection("requests").get(),ME.db.collection("members").get(),ME.db.collection("progress").get()]);

  const person=(id,extra,actions)=>{const p=ps[id]||{};return `<div class="person"><img src="${esc(p.avatarUrl||"")}" alt=""><div><div class="nm">${esc(p.name||"Unknown person")}</div><div class="sub">${esc(p.email||"")}${extra}</div></div><div class="act">${actions}</div></div>`};
  const rqEl=document.getElementById("admreq"),mmEl=document.getElementById("admmem");if(!rqEl)return;
  rqEl.innerHTML=ADM.req.length?ADM.req.map(r=>person(r.id,` · asked ${new Date(r.at||Date.now()).toLocaleDateString()}`,`<button class="btn sm" data-approve="${r.id}">Approve</button><button class="btn ghost sm" data-decline="${r.id}">Decline</button>`)).join(""):`<p class="note">No open requests.</p>`;
  mmEl.innerHTML=ADM.mem.length?ADM.mem.map(m=>{const pr=ADM.prog[m.id];const bars=pr?LEVELS.map(l=>`<span>${l.name} ${levelStats(l,pr.scores||{}).overall}%</span>`).join(""):"";
   return person(m.id,pr?` · active ${new Date(pr.updated).toLocaleDateString()}<div class="lvbars">${bars}</div>`:" · no activity yet",`<button class="btn ghost sm" data-remove="${m.id}">Remove</button>`)}).join(""):`<p class="note">No approved learners yet.</p>`}
 catch(e){const el=document.getElementById("admreq");if(el)el.innerHTML=`<p class="note">Couldn't load the lists (${esc(e&&e.code||"error")}). Press Refresh.</p>`}}

/* ================= events ================= */
document.addEventListener("click",async e=>{const t=e.target;
 const lv=t.closest("[data-level]");if(lv){setLevel(lv.dataset.level);return}
 const sc=t.closest("[data-sec]");if(sc){go(sc.dataset.sec,{idx:0});return}
 const tp=t.closest("[data-topic]");if(tp){go("grammar",{topic:tp.dataset.topic});return}
 const gt=t.closest("[data-gotopic]");if(gt){st.level=topicLevel(gt.dataset.gotopic).id;go("grammar",{topic:gt.dataset.gotopic});return}
 const it=t.closest("[data-item]");if(it){go(st.sec,{idx:+it.dataset.item});return}
 const sy=t.closest("[data-say]");if(sy){stopAudio();say(sy.dataset.say);return}
 const tg=t.closest("[data-show]");if(tg){const tb=document.getElementById("extable");tb.classList.remove("hide-en","hide-de");tb.querySelectorAll(".rev").forEach(c=>c.classList.remove("rev"));if(tg.dataset.show!=="both")tb.classList.add(tg.dataset.show);document.querySelectorAll("[data-show]").forEach(b=>b.setAttribute("aria-pressed",b===tg?"true":"false"));return}
 const td=t.closest(".extable td");if(td){td.classList.add("rev");return}
 const rs=t.closest("[data-reset]");if(rs){delete S.scores[rs.dataset.reset];save();render();return}
 const nt=t.closest("[data-newtest]");if(nt){newTest(nt.dataset.newtest);render();return}
 const cl=t.closest("#clearlog");if(cl){if(cl.dataset.armed==="1"){S.log=[];save();render()}else{cl.dataset.armed="1";cl.textContent="Click again to clear everything"}return}
 /* practice */
 const pm=t.closest("[data-pmode]");if(pm){st.pmode=pm.dataset.pmode;PR.lv=null;render();return}
 if(t.closest("[data-newround]")){PR.lv=null;render();return}
 if(t.closest("[data-flip]")){PR.fc.flip=!PR.fc.flip;if(PR.fc.flip){const v=PR.fc.deck[PR.fc.i];say(v[1]+" "+v[2])}render();return}
 if(t.closest("[data-fknow]")){const f=PR.fc,v=f.deck[f.i];f.known++;S.scores["practice:"+st.level]=S.scores["practice:"+st.level]||{};S.scores["practice:"+st.level]["f:"+v[2]]=1;save();f.i++;f.flip=false;render();return}
 if(t.closest("[data-fagain]")){const f=PR.fc;f.deck.push(f.deck[f.i]);f.again++;f.i++;f.flip=false;render();return}
 const dp=t.closest("[data-dplay]");if(dp){stopAudio();RATE=0.95;say(PR.items[+dp.dataset.dplay][0]);return}
 const ds=t.closest("[data-dslow]");if(ds){stopAudio();const o=RATE;RATE=0.65;say(PR.items[+ds.dataset.dslow][0]);RATE=o;return}
 const dc2=t.closest("[data-dcheck]");if(dc2){dictCheck(+dc2.dataset.dcheck);return}
 const smb=t.closest("[data-smode]");if(smb){st.smode=smb.dataset.smode;stopAudio();render();return}
 const si=t.closest("[data-sitem]");if(si){st.sidx=+si.dataset.sitem;stopAudio();render();return}
 const sr=t.closest("[data-srole]");if(sr){const s=spState();s.role=sr.dataset.srole;s.i=0;s.res={};spAdvance();render();return}
 if(t.closest("[data-scheck]")){scriptCheck(false);return}
 if(t.closest("[data-sskip]")){scriptCheck(true);return}
 if(t.closest("[data-senall]")){const s=spState();s.showEn=!s.showEn;render();return}
 if(t.closest("[data-srestart]")){const s=spState();stopAudio();s.i=0;s.res={};spAdvance();render();return}
 if(t.closest("[data-sswitch]")){stopAudio();delete SPS[spKey()];render();return}
 const tile=t.closest("[data-tile]");if(tile&&!tile.disabled){const m=PR.match,x=m.tiles[+tile.dataset.tile];if(x.de)say(x.txt);
  if(m.sel==null||m.tiles[m.sel].de===x.de){document.querySelectorAll(".tile.sel").forEach(e=>e.classList.remove("sel"));m.sel=+tile.dataset.tile;tile.classList.add("sel");return}
  const y=m.tiles[m.sel];if(y.i===x.i){m.done.push(x.i);m.sel=null;S.scores["practice:"+st.level]=S.scores["practice:"+st.level]||{};S.scores["practice:"+st.level]["m:"+x.txt]=1;save();render()}
  else{m.miss++;tile.classList.add("err");const prev=document.querySelector(`[data-tile="${m.sel}"]`);prev&&prev.classList.add("err");setTimeout(()=>{document.querySelectorAll(".tile.err,.tile.sel").forEach(e=>e.classList.remove("err","sel"))},600);m.sel=null}return}
 /* reading */
 const sn=t.closest("[data-sent]");if(sn){sn.classList.toggle("on");return}
 const al=t.closest("[data-alltr]");if(al){const x=document.getElementById("rtext");x.classList.toggle("all");al.setAttribute("aria-pressed",x.classList.contains("all"));al.textContent=x.classList.contains("all")?"Hide all English":"Show all English";return}
 if(t.closest("[data-readaloud]")){stopAudio();const r=lvl().reading[st.idx];say(r.s.map(s=>s[0]).join(" "));return}
 if(t.closest("[data-stop]")){stopAudio();return}
 /* listening */
 if(t.closest("[data-playall]")){stopAudio();playing=true;playFrom(lvl().listening[st.idx].l,0);return}
 const pl=t.closest("[data-playline]");if(pl){stopAudio();const i=+pl.dataset.playline,ln=lvl().listening[st.idx].l[i];const el=document.querySelector(`.line[data-line="${i}"]`);el&&el.classList.add("now");say(ln[1],ln[0],()=>el&&el.classList.remove("now"));return}
 const rt=t.closest("[data-rate]");if(rt){RATE=+rt.dataset.rate;render();return}
 const ltb=t.closest("[data-lt]");if(ltb){LT[ltb.dataset.lt]=!LT[ltb.dataset.lt];render();return}
 /* speaking */
 if(t.closest("[data-send]")){const ta=document.getElementById("say");sendTurn(ta.value);return}
 const ph=t.closest("[data-phrase]");if(ph){const ta=document.getElementById("say");if(ta&&!ta.disabled){ta.value=(ta.value?ta.value+" ":"")+ph.dataset.phrase;ta.focus()}else say(ph.dataset.phrase);return}
 const stn=t.closest("[data-sayturn]");if(stn){stopAudio();say(getConv().turns[+stn.dataset.sayturn].de,"B");return}
 const te=t.closest("[data-turnen]");if(te){const x=getConv().turns[+te.dataset.turnen];x.showEn=!x.showEn;render();return}
 if(t.closest("[data-allen]")){const c=getConv();c.showEn=!c.showEn;render();return}
 if(t.closest("[data-autosay]")){S.autosay=!S.autosay;save();render();return}
 if(t.closest("[data-feedback]")){getFeedback();return}
 if(t.closest("[data-restart]")){delete CONV[convKey()];render();return}
 /* access */
 if(t.closest("[data-signin]")){const msg=document.getElementById("gatemsg");try{await window.KD_AUTH.signIn();location.reload()}catch(err){if(msg)msg.textContent=err&&err.code==="auth/unauthorized-domain"?"This website's address isn't on the Firebase authorized-domains list yet.":"Sign-in was cancelled or blocked. Allow pop-ups for this site and try again."}return}
 if(t.closest("[data-signout]")){try{await window.KD_AUTH.signOut()}catch(err){}location.reload();return}
 if(t.closest("[data-request]")){const msg=document.getElementById("gatemsg");if(!ME.db||!ME.id){msg.textContent=window.KD_AUTH?"Sign in first, then try again.":"Sign in to claude.ai first, then reload.";return}
  try{await ME.db.doc("requests/"+ME.id).set({at:Date.now()});ME.pending=true;render()}catch(err){msg.textContent=err&&err.code==="invalid_argument"?"Your link is view-only. Ask the admin to add you as Contributor in the Share menu, then try again.":err&&err.code==="permission-denied"?"The course isn't accepting requests right now. Ask the admin.":"That didn't work. Please try again in a moment."}return}
 const md=t.closest("[data-mode]");if(md&&ME.owner){ME.mode=md.dataset.mode;try{await ME.db.doc("settings/access").set({mode:ME.mode})}catch(err){}render();return}
 const ap=t.closest("[data-approve]");if(ap){ap.disabled=true;try{await ME.db.doc("members/"+ap.dataset.approve).set({added:Date.now()});await ME.db.doc("requests/"+ap.dataset.approve).delete()}catch(err){}loadAdmin();return}
 const dc=t.closest("[data-decline]");if(dc){dc.disabled=true;try{await ME.db.doc("requests/"+dc.dataset.decline).delete()}catch(err){}loadAdmin();return}
 const rm=t.closest("[data-remove]");if(rm){if(rm.dataset.armed!=="1"){rm.dataset.armed="1";rm.textContent="Confirm remove";return}try{await ME.db.doc("members/"+rm.dataset.remove).delete()}catch(err){}loadAdmin();return}
 if(t.closest("[data-admreload]")){loadAdmin();return}
 /* exercises */
 const exEl=t.closest(".ex");if(!exEl)return;const key=exEl.dataset.key,s=EXS[key];if(!s||s.done)return;const q=QS[key].q;
 const opt=t.closest(".opt");if(opt&&!opt.disabled){const k=+opt.dataset.k;if(k===q.a){opt.classList.add("yes");handleResult(exEl,key,true,strip(q.o[k]))}else{opt.classList.add("no");opt.disabled=true;handleResult(exEl,key,false,strip(q.o[k]))}return}
 const bt=t.closest(".bank .tok");if(bt&&!bt.disabled){s.picked.push(+bt.dataset.b);drawBuild(exEl,key);return}
 const pt=t.closest(".build .tok[data-p]");if(pt){s.picked.splice(+pt.dataset.p,1);drawBuild(exEl,key);return}
 if(t.closest("[data-clear]")){s.picked=[];drawBuild(exEl,key);return}
 if(t.closest("[data-check]")){if(s.picked.length<q.w.length){const fb=exEl.querySelector(".fb");fb.className="fb hint";fb.innerHTML=`<p class="head">Use all ${q.w.length} pieces before checking.</p>`;fb.hidden=false;return}
  const ans=s.picked.map(i=>s.bank[i]);const ok=ans.join("|")===q.w.join("|");handleResult(exEl,key,ok,ans.join(" "));if(!ok&&!s.done){s.picked=[];drawBuild(exEl,key)}return}
});
document.addEventListener("change",e=>{if(e.target.id==="topicpick")go("grammar",{topic:e.target.value})});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.shiftKey)return;
 if(e.target.id==="say"){e.preventDefault();sendTurn(e.target.value)}
 else if(e.target.id==="sline"){e.preventDefault();scriptCheck(false)}
 else if(e.target.classList&&e.target.classList.contains("dictin")){e.preventDefault();dictCheck(+e.target.id.slice(4))}});

/* ================= boot ================= */
(function(){const h=(location.hash||"").slice(1).split(".");if(LEVELS.some(l=>l.id===h[0]))st.level=h[0];if(h[1]&&(SECTIONS.some(s=>s[0]===h[1])||h[1]==="admin"))st.sec=h[1];render()})();
(async function initCaps(){const C=window.claude;if(!C||!C.use){ME.ready=true;render();return}
 try{const [user,db,sample]=await Promise.all([C.use("user"),C.use("db"),C.use("sample")]);ME.user=user;ME.db=db;ME.sample=sample;
  if(window.KD_AUTH&&!window.KD_AUTH.signedIn){ME.gated=true;ME.needLogin=true;ME.ready=true;render();return}
  if(user){ME.me=await user.me();ME.id=ME.me.id;ME.owner=!!ME.me.isOwner}
  if(db&&ME.id){
   try{const s=await db.doc("settings/access").get();if(s.exists)ME.mode=(s.data().mode==="open")?"open":"members"}catch(e){}
   if(!ME.owner&&ME.mode!=="open"){let mem=false;try{mem=(await db.doc("members/"+ME.id).get()).exists}catch(e){}
    if(!mem){ME.gated=true;try{ME.pending=(await db.doc("requests/"+ME.id).get()).exists}catch(e){}}}
   if(!ME.gated){try{const p=await db.doc("progress/"+ME.id).get();if(p.exists){const d=p.data();S.scores=Object.assign({},S.scores,d.scores||{});if((d.log||[]).length>S.log.length)S.log=d.log;S.speak=Object.assign({},S.speak,d.speak||{})}}catch(e){}}
  }}catch(e){}
 ME.ready=true;if(st.sec==="admin"&&!ME.owner)st.sec="overview";render()})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A1 to A2 German grammar course explained from English: grammar, picture practice, reading, listening and speaking.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Klartext Deutsch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky signage bar, sidebar of days + lesson column; the conjugated verb is always signal yellow */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#15202B; --muted:#5A6774; --line:#D5DCE3; --soft:#F5F7F9;
  --verb:#F2B705; --verb-ink:#1A1400; --btn:#15202B; --btn-ink:#FFFFFF;
  --m:#1F5FAE; --f:#BE2F6E; --n:#1C8048; --p:#9A6200;
  --ok:#11795A; --ok-bg:#E3F4EC; --bad:#B42318; --bad-bg:#FBE9E7; --hint:#8A5A00; --hint-bg:#FFF4D6;
  --r-time:#E8E2F7; --r-man:#DDF1EF; --r-place:#FBE8D6; --r-obj:#E4ECF8; --r-dat:#E3F2E6; --r-conj:#EEE;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#171E26; --ink:#E6EBF0; --muted:#9AA7B4; --line:#2A3542; --soft:#1C252F;
  --verb:#F5C542; --verb-ink:#1A1400; --btn:#E6EBF0; --btn-ink:#0F141A;
  --m:#79AEF2; --f:#F27EB0; --n:#5DCB8C; --p:#E3AE52;
  --ok:#52CC93; --ok-bg:#12291F; --bad:#F2776C; --bad-bg:#2E1715; --hint:#F2C45A; --hint-bg:#2A2412;
  --r-time:#2A2540; --r-man:#16302D; --r-place:#35271A; --r-obj:#1B2840; --r-dat:#18301E; --r-conj:#262C33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E26; --ink:#E6EBF0; --muted:#9AA7B4; --line:#2A3542; --soft:#1C252F;
  --verb:#F5C542; --verb-ink:#1A1400; --btn:#E6EBF0; --btn-ink:#0F141A;
  --m:#79AEF2; --f:#F27EB0; --n:#5DCB8C; --p:#E3AE52;
  --ok:#52CC93; --ok-bg:#12291F; --bad:#F2776C; --bad-bg:#2E1715; --hint:#F2C45A; --hint-bg:#2A2412;
  --r-time:#2A2540; --r-man:#16302D; --r-place:#35271A; --r-obj:#1B2840; --r-dat:#18301E; --r-conj:#262C33;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--verb);outline-offset:2px}
a{color:inherit}
.g-m{color:var(--m);font-weight:700}.g-f{color:var(--f);font-weight:700}.g-n{color:var(--n);font-weight:700}.g-p{color:var(--p);font-weight:700}
.g-v{background:var(--verb);color:var(--verb-ink);padding:0 .25em;border-radius:3px;font-weight:700}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--bg);padding:0}
.brand i{font-style:normal;background:var(--verb);color:var(--verb-ink);padding:0 6px;border-radius:3px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--bg);opacity:.72;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:4px;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-current="true"]{opacity:1;background:var(--verb);color:var(--verb-ink)}

.wrap{max-width:1200px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:32px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:700;letter-spacing:-.01em}
.hero h1 .g-v{padding:0 .12em}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:12px 0 0}
.board{background:var(--ink);color:var(--bg);border-radius:6px;padding:16px 18px;font-family:var(--mono);font-size:14px}
.board .row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--bg) 25%,transparent)}
.board .row:last-child{border:0}
.board b{color:var(--verb);font-weight:500}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 28px}
.stat .num{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .lab{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px}
.day .dn{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.day h3{font-size:24px}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.day li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px}
.day li button:hover{background:var(--soft)}
.meter{width:56px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}
.weak{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--verb);border-radius:6px;padding:18px 20px}
.weak h2{font-size:24px;margin-bottom:6px}
.weak p{margin:4px 0;color:var(--muted)}
.chiplink{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:6px 6px 0 0}

/* Lesson layout */
.lay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;font-size:15px}
.side h4{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.side h4:first-child{margin-top:0}
.side button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-radius:4px}
.side button:hover{background:var(--surface)}
.side button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--verb);font-weight:700}
.side .pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.picker{display:none;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:20px}
.lesson{max-width:780px;min-width:0}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.lesson h1{font-size:clamp(34px,5vw,50px);font-weight:700}
.lead{font-size:18px;margin:14px 0 0;max-width:65ch}
.lesson section{margin-top:36px}
.lesson h2{font-size:26px;font-weight:600;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.lesson h2 small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.duo>div{padding:16px 18px;min-width:0}
.duo>div+div{border-left:1px solid var(--line)}
.duo .tag{display:block;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.duo ul{margin:6px 0 0;padding-left:18px}
.duo p{margin:0 0 8px}
.changes{margin-top:14px;background:var(--hint-bg);border-radius:6px;padding:14px 18px}
.changes strong{display:block;font-family:var(--display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);margin-bottom:4px}
.changes p{margin:6px 0 0}
.formula{font-family:var(--mono);background:var(--ink);color:var(--bg);border-radius:6px;padding:14px 18px;margin:0;overflow-x:auto;font-size:14.5px;line-height:1.9;white-space:pre-wrap}
.formula .g-m,.formula .g-f,.formula .g-n,.formula .g-p{filter:brightness(1.5)}
.gridbox{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.gridbox table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.gridbox caption{caption-side:top;text-align:left;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px 4px;color:var(--muted)}
.gridbox th,.gridbox td{padding:8px 14px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.gridbox thead th{font-family:var(--display);font-size:15px;letter-spacing:.05em;border-top:0}
.gridbox tbody th{font-family:var(--display);font-size:15px;color:var(--muted);font-weight:600}

/* Anatomy */
.anat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.anat .en-line{color:var(--muted);margin:0 0 12px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;border-radius:5px;padding:6px 10px;background:var(--soft);min-width:0}
.chip .w{font-size:17px;font-weight:700}
.chip .r{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chip.v,.chip.v2{background:var(--verb);color:var(--verb-ink)}
.chip.v .r,.chip.v2 .r{color:var(--verb-ink);opacity:.75}
.chip.t{background:var(--r-time)}.chip.m{background:var(--r-man)}.chip.p{background:var(--r-place)}.chip.o{background:var(--r-obj)}.chip.d{background:var(--r-dat)}.chip.c{background:var(--r-conj)}
.chip.s{background:transparent;border:2px solid var(--ink)}
.anat .note{margin:12px 0 0;font-size:15px}

/* Examples */
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px}
.tg[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.extable{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.extable table{width:100%;border-collapse:collapse;font-size:15.5px}
.extable th{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;width:50%}
.extable td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;min-width:180px}
.extable td.de{font-weight:700}
.extable td .nt{display:block;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:2px}
.extable.hide-en td.en:not(.rev),.extable.hide-de td.de:not(.rev){cursor:pointer;position:relative}
.extable.hide-en td.en:not(.rev) .tx,.extable.hide-de td.de:not(.rev) .tx{visibility:hidden}
.extable.hide-en td.en:not(.rev)::after,.extable.hide-de td.de:not(.rev)::after{content:"Tap to show";position:absolute;left:14px;top:10px;color:var(--muted);font-weight:400;font-size:13.5px;border:1px dashed var(--line);border-radius:4px;padding:1px 8px}

/* Mistakes */
.mist{display:flex;flex-direction:column;gap:10px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px}
.mi .wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mi .right{color:var(--ok);font-weight:700}
.mi .wrong::before{content:"✗ ";text-decoration:none;display:inline-block}
.mi .right::before{content:"✓ "}
.mi .why{grid-column:1/-1;color:var(--muted);font-size:15px}

/* Exercises */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:12px}
.ex-q{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.ex-n{font-family:var(--display);font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);border-radius:4px;min-width:28px;text-align:center;padding:1px 6px;margin-top:2px}
.ex-q>div{min-width:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt.yes{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.build{min-height:48px;margin-top:12px;border:2px dashed var(--line);border-radius:6px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.build:empty::before{content:"Tap the words below in the right order";color:var(--muted);font-size:14px;padding-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tok{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:6px 12px;font-size:16px;font-weight:700}
.tok:disabled{opacity:.25;cursor:default}
.build .tok{background:var(--surface);border-color:var(--ink)}
.ex-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:5px;padding:8px 16px;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin-top:12px;border-radius:6px;padding:12px 16px;font-size:15.5px}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb.hint{background:var(--hint-bg)}
.fb .head{font-weight:700;margin:0 0 6px}
.fb.ok .head{color:var(--ok)}.fb.bad .head{color:var(--bad)}.fb.hint .head{color:var(--hint)}
.fb p{margin:6px 0 0}
.lang{display:inline-block;font-family:var(--display);font-size:12px;letter-spacing:.1em;background:var(--ink);color:var(--bg);border-radius:3px;padding:0 6px;margin-right:8px;vertical-align:1px}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.scoreline{font-family:var(--display);font-size:20px;font-weight:600}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap}
.pager button{background:none;border:1px solid var(--line);border-radius:6px;padding:10px 16px;text-align:left;max-width:48%}
.pager button small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.pager .nx{margin-left:auto;text-align:right}

/* Test & results */
.page-h h1{font-size:clamp(34px,5vw,52px)}
.page-h p{color:var(--muted);max-width:65ch}
.test-start{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:14px}
.progress .bar2{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress .bar2 span{display:block;height:100%;background:var(--verb)}
.progress .t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ex .catlab{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 6px}
.results{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;margin:20px 0}
.results h2{font-size:30px}
.catrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 48px;gap:12px;align-items:center;padding:6px 0}
.catrow .bar3{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.catrow .bar3 span{display:block;height:100%}
.catrow .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.level{margin-top:14px;padding:14px 16px;background:var(--hint-bg);border-radius:6px}

/* Cheat sheet */
.cheat{columns:2 340px;column-gap:20px}
.cs{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 20px}
.cs h3{font-size:22px;margin-bottom:8px}
.cs p,.cs li{font-size:15px;margin:4px 0}
.cs ul{padding-left:18px;margin:4px 0}
.cs .gridbox{margin-top:8px}
.cs .gridbox th,.cs .gridbox td{padding:5px 10px;font-size:14px}
.mono{font-family:var(--mono);font-size:14px}

/* Mistakes log */
.log{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.lg{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.lg .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lg .q{margin:6px 0;font-weight:700}
.lg .yours{color:var(--bad)}.lg .corr{color:var(--ok);font-weight:700}
.lg p{margin:4px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:24px;color:var(--muted);margin-top:16px}

@media (max-width:880px){
  .lay{grid-template-columns:1fr}
  .side{display:none}
  .picker{display:block}
  .hero{grid-template-columns:1fr}
}
@media (max-width:600px){
  .duo{grid-template-columns:1fr}
  .duo>div+div{border-left:0;border-top:1px solid var(--line)}
  .mi{grid-template-columns:1fr}
  .brand span.full{display:none}
  .pager button{max-width:100%;width:100%}
  .pager .nx{text-align:left}
  .catrow{grid-template-columns:110px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2 additions: two-row header, level pills, sections, practice games, listening player, chat */
.bar-in{flex-wrap:wrap;row-gap:8px}
.levels{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.levels::-webkit-scrollbar{display:none}
.lv{background:none;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;padding:3px 10px;border-radius:4px;white-space:nowrap}
.lv[aria-current="true"]{background:var(--verb);border-color:var(--verb);color:var(--verb-ink)}
.lv.soon{opacity:.4;cursor:default;border-style:dashed}
.who{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;margin-left:auto}
.who img{width:28px;height:28px;border-radius:50%}
.badge{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:3px;background:var(--verb);color:var(--verb-ink)}
.badge.learner{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.secbar{background:var(--surface);border-bottom:1px solid var(--line)}
.secbar .tabs{max-width:1200px;margin:0 auto;padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.secbar .tab{color:var(--ink);opacity:.7}
.secbar .tab[aria-current="true"]{opacity:1;background:var(--ink);color:var(--bg)}
.secbar .tab.admin{color:var(--hint)}
.progress{position:static}
.side{top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px)}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sechead h1{font-size:clamp(32px,5vw,48px)}
.sechead p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
button.card:hover{border-color:var(--ink)}
.card .k{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:24px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .meter{width:100%;height:6px;margin-top:6px}
.lvmap{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 26px}
.lvstep{flex:1;min-width:120px;border:2px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);text-align:left}
.lvstep b{font-family:var(--display);font-size:22px;display:block}
.lvstep span{font-size:13px;color:var(--muted)}
.lvstep[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--verb)}
.lvstep.soon{border-style:dashed;opacity:.55;cursor:default}
/* picture exercises */
.pic{font-size:64px;line-height:1.15;text-align:center;background:var(--soft);border-radius:8px;padding:18px 10px;margin-top:12px;letter-spacing:.08em}
.opt.big{font-size:46px;text-align:center;padding:12px;line-height:1.1}
.opts.pics{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:14px 10px;font-size:16px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:border-color .15s,opacity .2s}
.tile.en{font-weight:400;font-style:italic}
.tile.sel{border-color:var(--verb);background:var(--hint-bg)}
.tile.done{opacity:.3;border-color:var(--ok);cursor:default}
.tile.err{border-color:var(--bad);background:var(--bad-bg)}
.tile .e{font-size:24px}
.statusline{margin:14px 0 0;font-weight:700}
/* reading */
.text{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;font-size:18px;line-height:1.75;max-width:760px}
.sent{cursor:pointer;border-radius:3px;padding:1px 2px}
.sent:hover{background:var(--hint-bg)}
.sent .tr{display:none;font-size:14.5px;color:var(--muted);font-style:italic;line-height:1.4;margin:2px 0 8px}
.sent.on .tr,.text.all .sent .tr{display:block}
.text.all .sent{display:block}
.gloss{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gloss span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.gloss b{margin-right:6px}
.itemlist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.itembtn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;text-align:left}
.itembtn small{display:block;color:var(--muted);font-size:12px}
.itembtn[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--verb)}
/* listening */
.player{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lines{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:2px;max-width:820px}
.line{display:grid;grid-template-columns:auto 92px minmax(0,1fr);gap:10px;align-items:start;padding:8px;border-radius:5px}
.line.now{background:var(--hint-bg)}
.line .pl{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;font-size:12px;line-height:1}
.line .spk{font-family:var(--display);font-weight:600;font-size:15px;padding-top:3px;color:var(--muted)}
.line .de{font-weight:700}
.line .en{color:var(--muted);font-style:italic;font-size:15px}
.line .mask{display:inline-block;height:12px;border-radius:6px;background:var(--line);margin-top:6px}
.note{font-size:14px;color:var(--muted);margin:8px 0}
/* speaking */
.speak{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:880px){.speak{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:14px;min-height:220px}
.bub{max-width:85%;padding:10px 14px;border-radius:12px;font-size:16.5px;min-width:0}
.bub.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.bub.me{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:3px}
.bub .nm{display:block;font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.bub .tools{display:flex;gap:6px;margin-top:6px}
.bub .tools button{background:var(--soft);border:1px solid var(--line);border-radius:4px;font-size:12px;padding:2px 8px}
.bub .en{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.corr{align-self:flex-end;max-width:85%;background:var(--hint-bg);border-radius:8px;padding:8px 12px;font-size:14.5px}
.corr b{color:var(--hint)}
.corr.okc{background:var(--ok-bg)}
.compose{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;resize:vertical;min-height:52px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:15px}
.brief h3{font-size:20px;margin:0 0 6px}
.brief ul{padding-left:18px;margin:6px 0}
.brief .ph{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.brief .ph button{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:14px}
.brief .ph small{display:block;color:var(--muted)}
.feedback{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--verb);border-radius:6px;padding:16px 18px;margin-top:14px}
.feedback h3{font-size:22px;margin:10px 0 4px}
.feedback h3:first-child{margin-top:0}
.feedback ul{margin:4px 0;padding-left:18px}
.thinking{color:var(--muted);font-style:italic}
/* admin + gate */
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.panel h2{font-size:24px;margin-bottom:8px}
.person{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.person img{width:36px;height:36px;border-radius:50%}
.person .nm{font-weight:700;overflow-wrap:anywhere}
.person .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.person .act{display:flex;gap:6px}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.danger{background:var(--bad);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.lvbars{display:flex;gap:4px;margin-top:4px}
.lvbars span{font-size:11px;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:3px;padding:1px 5px;color:var(--muted)}
.gate{max-width:560px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px}
.gate h1{font-size:38px;margin-bottom:8px}
.gate p{color:var(--muted)}
.banner{background:var(--hint-bg);border-radius:6px;padding:10px 14px;font-size:14.5px;margin-bottom:16px}

.flash{width:100%;max-width:440px;min-height:250px;border:2px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;margin-top:4px}
.flash:hover{border-color:var(--ink)}
.flash .e{font-size:96px;line-height:1}
.flash .w{font-size:30px;font-weight:700}
.flash .p{color:var(--muted);font-size:15px}
.dictin{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin-top:10px}
#who{display:flex;align-items:center;gap:8px;margin-left:auto}
#who:empty{display:none}

grids:[{title:"Three verb types",head:["","wohnen (regular)","arbeiten (-t stem)","fahren (a → ä)"],rows:[["ich","wohne","arbeite","fahre"],["du","wohnst","arbeitest","fährst"],["er/sie/es","wohnt","arbeitet","fährt"],["wir","wohnen","arbeiten","fahren"],["ihr","wohnt","arbeitet","fahrt"],["sie/Sie","wohnen","arbeiten","fahren"]]}],
ex:[["I live in Berlin.","Ich {v|wohne} in Berlin."],["Where do you live? (friend)","Wo {v|wohnst} du?"],["Where do you live? (formal)","Wo {v|wohnen} Sie?"],["She works at a bank.","Sie {v|arbeitet} bei einer Bank."],["They come from India.","Sie {v|kommen} aus Indien."],["Are you coming too? (to two friends)","{v|Kommt} ihr auch?"],["He drives to work.","Er {v|fährt} zur Arbeit."],["Do you eat meat?","{v|Isst} du Fleisch?","isst = eat · ist = is"]],
mist:[["du arbeitst","du arbeitest","Stem ends in -t, so add -e before -st."],["er fahrt","er fährt","fahren changes a → ä in du and er/sie/es."],["ihr kommen","ihr kommt","ihr takes -t."],["Wo wohnst Sie?","Wo wohnen Sie?","Formal Sie always takes the -en form."]],
q:[
mc("du ___ (arbeiten)",["arbeitst","arbeitest","arbeitet","arbeiten"],1,"The stem 'arbeit-' ends in -t. What do you add between the stem and -st?","Stems ending in -t or -d get an extra -e so you can pronounce them: du arbeitest.","Wenn der Verbstamm auf -t oder -d endet, kommt ein -e dazu: du arbeitest, er arbeitet."),
mc("er ___ (fahren)",["fahrt","fährt","fährst","fahren"],1,"fahren is a strong verb. Something happens to the vowel in du and er forms.","fahren changes a → ä in du and er/sie/es: du fährst, er fährt. 'fährst' is the du form.","Bei 'fahren' wird a zu ä (nur bei du und er/sie/es): er fährt."),
mc("To two friends: ___ ihr zur Party?",["Kommst","Kommen","Kommt","Komme"],2,"Which ending goes with 'ihr'?","ihr always takes -t: ihr kommt. Don't confuse it with sie/Sie (-en).","Bei 'ihr' endet das Verb auf -t: Kommt ihr zur Party?"),
mc("Asking your landlord: <i>Where do you live?</i>",["Wo wohnst du?","Wo wohnen Sie?","Wo wohnt ihr?","Wo wohnen sie?"],1,"A landlord is someone you speak to formally. Which 'you' is formal?","Formal 'you' is 'Sie' with capital S and the -en form: Wo wohnen Sie? Lowercase 'sie' would mean 'they'.","Mit dem Vermieter spricht man formell: 'Sie' (groß) + Verb mit -en."),
mc("'Sie spricht Deutsch.' Who speaks?",["she","they","you (formal)","I"],0,"Look at the verb ending: -t.","'spricht' is the er/sie/es form, so 'sie' = she. 'They' or formal 'you' would be 'sprechen'.","'spricht' ist die Form für er/sie/es. Also: sie = she. Bei 'they' heißt es: sie sprechen."),
mc("Du ___ gern Pizza. (essen)",["esst","isst","essen","ist"],1,"essen changes its vowel e → i in the du form. Careful: one option means 'is'.","du isst = you eat. 'ist' (one s) is from sein = is. 'esst' is the ihr form.","essen: du isst (mit ss). 'ist' kommt von 'sein'.")
]},

{id:"seinhaben",day:1,title:"sein and haben",de:"sein und haben",
lead:"The two most important verbs. Both are irregular, and both build the past tense later (Perfekt). German also uses them in places where English does something different.",
en:"<p><b>to be</b>: am, are, is</p><p><b>to have</b>: have, has</p><p>English says <i>I am hungry, I am cold, I am right, I am afraid</i>.</p>",
rule:"<p>Memorise both rows. Then learn the expressions where German switches verb:</p><ul><li>I'm hungry → Ich <b>habe</b> Hunger</li><li>I'm thirsty → Ich <b>habe</b> Durst</li><li>I'm right → Ich <b>habe</b> recht</li><li>I'm afraid → Ich <b>habe</b> Angst</li><li>I'm cold → <b>Mir ist</b> kalt</li></ul>",
changes:"<p>'Ich bin kalt' means 'I am a cold person'. For feeling cold, German says 'Mir ist kalt' (literally: to me it is cold). Same with warm, schlecht (sick), langweilig (bored).</p><p>Watch the spelling: <b>ihr seid</b> (you are) vs <b>seit</b> (since).</p>",
formula:"sein:  ich bin · du bist · er ist · wir sind · ihr seid · sie/Sie sind\nhaben: ich habe · du hast · er hat · wir haben · ihr habt · sie/Sie haben",
grids:[{title:"sein and haben",head:["","sein","haben"],rows:[["ich","bin","habe"],["du","bist","hast"],["er/sie/es","ist","hat"],["wir","sind","haben"],["ihr","seid","habt"],["sie/Sie","sind","haben"]]}],
ex:[["I am tired.","Ich {v|bin} müde."],["I am hungry.","Ich {v|habe} Hunger."],["Are you married?","{v|Bist} du verheiratet?"],["We have no time today.","Wir {v|haben} heute keine Zeit."],["I am cold.","Mir {v|ist} kalt.","not 'Ich bin kalt'"],["You are right.","Du {v|hast} recht."],["You (all) are late.","Ihr {v|seid} zu spät."],["He has two children.","Er {v|hat} zwei Kinder."]],
mist:[["Ich bin Hunger.","Ich habe Hunger.","Hunger is a noun you 'have' in German."],["Ich bin kalt.","Mir ist kalt.","'Ich bin kalt' describes your personality."],["ihr sind","ihr seid","ihr takes 'seid'."],["er hast","er hat","hast is du; er/sie/es is hat."]],
q:[
mc("ihr ___ (sein)",["sind","seid","seit","ist"],1,"Two words sound the same. One means 'since'.","ihr seid = you (all) are. 'seit' with t means 'since'.","ihr seid (mit d). 'seit' (mit t) bedeutet 'since'."),
mc("<i>I'm hungry.</i> Most common:",["Ich bin Hunger.","Ich habe Hunger.","Ich habe hungrig.","Mir ist Hunger."],1,"Hunger is a noun. Which verb goes with a noun like that?","German 'has' hunger: Ich habe Hunger. 'Ich bin hungrig' exists, but sounds bookish.","Man sagt: Ich habe Hunger (oder: Ich habe Durst)."),
mc("<i>I'm cold.</i>",["Ich bin kalt.","Ich habe kalt.","Mir ist kalt.","Mich ist kalt."],2,"Literally: 'to me it is cold'. Which pronoun means 'to me'?","Feelings like cold, warm or bored use Dativ 'mir' + ist. 'Ich bin kalt' would mean you are a cold person.","Für Gefühle sagt man: Mir ist kalt / warm / langweilig. 'Ich bin kalt' = Ich bin ein kalter Mensch."),
mc("Er ___ zwei Kinder.",["hat","hast","ist","habt"],0,"er/sie/es form of haben.","er hat. 'hast' is du, 'habt' is ihr.","haben: er hat, du hast, ihr habt."),
mc("<i>You're right.</i> (to a friend)",["Du bist recht.","Du hast recht.","Du bist richtig.","Dir ist recht."],1,"Like hunger, 'recht' goes with a different verb in German.","German uses haben: Du hast recht. 'Du bist richtig' would mean 'you are the right person (here)'.","Man sagt: Du hast recht. ('Das ist mir recht' = That's fine with me.)"),
mc("Formal: ___ Sie aus Indien?",["Bist","Ist","Sind","Seid"],2,"Formal Sie takes the same form as wir and sie (they).","Sie (formal) uses 'sind': Sind Sie aus Indien?","Formell: Sie sind. Also: Sind Sie aus Indien?")
]},

{id:"fragen",day:1,title:"Asking questions",de:"Fragen",
lead:"Two types. Yes/no questions put the verb first. W-questions put the question word first and the verb second.",
en:"<p>English needs a helper verb: <i><b>Do</b> you live here? Where <b>do</b> you work?</i></p>",
rule:"<p>No helper. Just move the verb:</p><p><b>{v|Wohnst} du hier?</b></p><p><b>Wo {v|arbeitest} du?</b></p><ul><li>wer = who</li><li>was = what</li><li>wo = where (place)</li><li>woher = where from</li><li>wohin = where to</li><li>wann = when</li><li>warum = why</li><li>wie = how</li><li>welcher/welche/welches = which</li></ul>",
changes:"<p>German has <b>no 'do'</b>. 'Tust du wohnen?' does not exist.</p><p>English 'where' splits into three: wo (location), woher (origin), wohin (direction).</p><p><b>wer</b> means who, not where. <b>Wie heißt du?</b> = What's your name.</p><p>To say YES to a negative question, use <b>doch</b>: 'Hast du keine Zeit?' / 'Doch!' (Yes, I do.)</p>",
formula:"Yes/no:  VERB + subject + … ?\nW-word:  W-word + VERB + subject + … ?",
ex:[["Do you live in Berlin?","{v|Wohnst} du in Berlin?"],["Where do you work?","Wo {v|arbeitest} du?"],["Where are you going?","Wohin {v|gehst} du?","spoken also: Wo gehst du hin?"],["Where do you come from?","Woher {v|kommst} du?"],["Who is that?","Wer {v|ist} das?"],["Why are you learning German?","Warum {v|lernst} du Deutsch?"],["Which bus goes to the main station?","Welcher Bus {v|fährt} zum Hauptbahnhof?"],["Don't you have time? Yes, I do!","Hast du keine Zeit? Doch!"]],
mist:[["Tust du hier wohnen?","Wohnst du hier?","No helper verb in German."],["Wo kommst du?","Woher kommst du?","Origin needs woher."],["Wo gehst du? (direction)","Wohin gehst du?","Direction needs wohin."],["Hast du keine Zeit? Ja!","Doch!","'Doch' contradicts a negative question."]],
q:[
mc("<i>Do you speak English?</i>",["Sprichst du Englisch?","Tust du Englisch sprechen?","Sprechen du Englisch?","Machst du Englisch sprechen?"],0,"German has no 'do'. Put the verb first and conjugate it for 'du'.","Yes/no question: verb first. du + sprechen → sprichst. Sprichst du Englisch?","Ja/Nein-Frage: Das Verb steht vorne. Sprichst du Englisch?"),
mc("___ kommst du? Aus Indien.",["Wo","Woher","Wohin","Wer"],1,"The answer is 'aus Indien' (from India).","Origin = woher. wo = location, wohin = direction.","Herkunft: woher? Antwort: aus Indien."),
mc("___ fährst du am Wochenende? Nach Hamburg.",["Wo","Woher","Wohin","Wann"],2,"The answer is a destination.","Destination = wohin. 'Nach Hamburg' answers 'where to'.","Ziel: wohin? Antwort: nach Hamburg."),
mc("___ ist das? Das ist meine Chefin.",["Wo","Wer","Was","Wie"],1,"The answer is a person.","wer = who. Careful: English 'where' sounds like German 'wer', but means 'wo'.","Person: wer? (wer = who, wo = where)"),
mc("'Hast du heute keine Zeit?' You DO have time. You say:",["Ja.","Doch!","Nein.","Ja, nicht."],1,"There's a special German word for 'yes' to a negative question.","'Doch' says yes to a negative question. 'Nein' would confirm you have no time. 'Ja' is unclear.","Auf eine negative Frage antwortet man mit 'Doch', wenn man widerspricht."),
ord("<i>Which train goes to Hamburg?</i>",["Welcher Zug","fährt","nach Hamburg"],"Question word phrase first, then the verb.","'Welcher Zug' is the question phrase in position 1, the verb 'fährt' is position 2.","'Welcher Zug' steht auf Position 1, das Verb auf Position 2.")
]},

{id:"artikel",day:1,title:"Articles and gender",de:"Artikel und Genus",
lead:"Every German noun has a gender: {m|der} (masculine), {f|die} (feminine), {n|das} (neuter). The plural is always {p|die}. Gender is grammatical, not logical: {n|das Mädchen} (the girl) is neuter.",
en:"<p>English has one 'the' and one 'a/an' for every noun.</p>",
rule:"<p><b>Definite:</b> {m|der} · {f|die} · {n|das} · {p|die} (plural)</p><p><b>Indefinite:</b> {m|ein} · {f|eine} · {n|ein} · plural: no article</p><p>Learn every noun as a package: article + noun + plural.</p>",
changes:"<p>You cannot guess gender from meaning, but endings help a lot:</p><ul><li>{f|die}: -ung, -heit, -keit, -schaft, -ion, -tät, -ie, most -e (die Lampe)</li><li>{n|das}: -chen, -lein, -ment, -um, verbs used as nouns (das Essen)</li><li>{m|der}: days, months, seasons, most -er people/tools (der Lehrer, der Computer), -ling, -ismus</li><li>Compound nouns take the gender of the <b>last</b> part: {f|die} Haustür (das Haus + {f|die} Tür)</li></ul><p>Tip: say the colour in your head. 'der Tisch' is blue, 'die Lampe' red, 'das Fenster' green.</p>",
formula:"{m|der Tisch} → {m|ein Tisch}\n{f|die Lampe} → {f|eine Lampe}\n{n|das Fenster} → {n|ein Fenster}\n{p|die Bücher} → {p|Bücher} (no 'a' in plural)",
grids:[{title:"Common plural patterns",head:["Pattern","Example"],rows:[["-e","der Tisch → die Tische"],["-(e)n","die Frau → die Frauen · die Lampe → die Lampen"],["-er + umlaut","das Buch → die Bücher · das Kind → die Kinder"],["-s","das Auto → die Autos · das Handy → die Handys"],["no change","der Lehrer → die Lehrer · das Fenster → die Fenster"]]}],
ex:[["the table / a table","{m|der Tisch} / {m|ein Tisch}"],["the lamp","{f|die Lampe}"],["the window","{n|das Fenster}"],["the appointment","{m|der Termin}"],["the invoice","{f|die Rechnung}","-ung = always die"],["the girl","{n|das Mädchen}","-chen = always das"],["the fridge","{m|der Kühlschrank}","last part: der Schrank"],["the books","{p|die Bücher}"]],
mist:[["die Mädchen (one girl)","das Mädchen","-chen is always neuter."],["ein Lampe","eine Lampe","Feminine needs eine."],["der Zeitung","die Zeitung","-ung is always feminine."],["eine Bücher","Bücher","No indefinite article in plural."]],
q:[
mc("___ Wohnung",["der","die","das"],1,"Look at the ending: -ung.","Every noun ending in -ung is feminine: die Wohnung, die Rechnung, die Zeitung.","Nomen auf -ung sind immer feminin: die Wohnung."),
mc("___ Brötchen",["der","die","das"],2,"Look at the ending: -chen.","-chen (and -lein) are always neuter: das Brötchen, das Mädchen.","Nomen auf -chen sind immer neutral: das Brötchen."),
mc("___ Montag",["der","die","das"],0,"Days, months and seasons share one gender.","Days, months and seasons are masculine: der Montag, der Mai, der Winter.","Tage, Monate und Jahreszeiten sind maskulin: der Montag."),
mc("___ Kühlschrank (Kühl + Schrank)",["der","die","das"],0,"In compound nouns, which part decides the gender?","The last part decides: der Schrank → der Kühlschrank.","Bei zusammengesetzten Nomen bestimmt das letzte Wort den Artikel: der Schrank → der Kühlschrank."),
mc("Plural of 'der Tisch'",["die Tischen","die Tische","die Tisch","die Tischer"],1,"Many short masculine nouns add one letter.","der Tisch → die Tische (pattern -e). Plural article is always die.","Plural: die Tische. Der Artikel im Plural ist immer 'die'."),
mc("Das ist ___ Problem. (das Problem)",["ein","eine","einer"],0,"das-nouns take the same indefinite article as der-nouns.","Neuter: das → ein. 'eine' is only for feminine nouns.","Neutral: das Problem → ein Problem.")
]},

{id:"negation",day:1,title:"nicht vs kein",de:"Negation: nicht oder kein",
lead:"**kein** negates a noun that would have 'ein' or no article. **nicht** negates everything else: verbs, adjectives, adverbs, nouns with der/die/das or mein/dein, and names.",
en:"<p>English uses 'not', 'no', 'not a', 'not any' and the helper 'don't':</p><p><i>I <b>don't</b> have <b>a</b> car. I'm <b>not</b> tired.</i></p>",
rule:"<p><b>kein</b> = k + ein, with the same endings as ein: kein Mann, keine Frau, kein Kind, keine Kinder, (Akk) keinen Mann.</p><p><b>nicht</b> goes:</p><ul><li>at the end, to negate the whole statement: Ich arbeite heute <b>nicht</b>.</li><li>before an adjective: <b>nicht</b> müde</li><li>before a place or preposition phrase: <b>nicht</b> in Berlin</li><li>before the second verb part: Ich kann <b>nicht</b> kommen.</li></ul>",
changes:"<p>German has no 'don't'. 'I don't work today' → Ich arbeite heute nicht.</p><p>'don't have a/any' merges into one word: Ich habe <b>kein</b> Auto / <b>keine</b> Zeit.</p>",
formula:"ein / no article  →  kein, keine, keinen …\nverb, adjective, der/die/das, mein  →  nicht",
ex:[["I'm not tired.","Ich bin {v|nicht} müde."],["I don't have a car.","Ich habe {n|kein Auto}."],["I don't have time.","Ich habe {f|keine Zeit}."],["I don't work today.","Ich arbeite heute nicht."],["That's not my phone.","Das ist nicht mein Handy.","possessive → nicht"],["We don't have children.","Wir haben {p|keine Kinder}."],["I can't come tomorrow.","Ich kann morgen nicht kommen."],["No problem.","Kein Problem."]],
mist:[["Ich habe nicht Zeit.","Ich habe keine Zeit.","Zeit has no article here, so use kein."],["Ich nicht arbeite heute.","Ich arbeite heute nicht.","nicht never takes position 2."],["Ich habe kein Bruder.","Ich habe keinen Bruder.","After haben: Akkusativ, der → keinen."],["Das ist kein mein Handy.","Das ist nicht mein Handy.","With mein/dein use nicht."]],
q:[
mc("Ich habe heute ___ Zeit.",["nicht","kein","keine","keinen"],2,"Zeit is a noun without an article. Its gender is die.","No article → kein. die Zeit is feminine → keine Zeit.","Zeit hat keinen Artikel, deshalb 'kein'. Zeit ist feminin: keine Zeit."),
mc("Das Essen ist ___ gut.",["nicht","kein","keine"],0,"What are you negating: a noun or an adjective?","'gut' is an adjective, so use nicht.","'gut' ist ein Adjektiv. Adjektive negiert man mit 'nicht'."),
mc("Ich habe ___ Bruder.",["kein","keinen","keine","nicht"],1,"der Bruder. After 'haben', which case is it? What happens to masculine?","haben takes Akkusativ. Masculine changes: ein → einen, kein → keinen.","Nach 'haben' steht Akkusativ: der Bruder → keinen Bruder."),
mc("<i>I don't work tomorrow.</i>",["Ich nicht arbeite morgen.","Ich arbeite morgen nicht.","Ich kein arbeite morgen.","Ich arbeite morgen kein."],1,"The verb keeps position 2. Where does nicht go to negate the whole sentence?","Verb in position 2, nicht at the end: Ich arbeite morgen nicht.","Das Verb bleibt auf Position 2. 'nicht' steht am Ende: Ich arbeite morgen nicht."),
mc("Das ist ___ Problem.",["kein","keine","nicht","nichts"],0,"Problem would normally take 'ein'.","ein Problem → kein Problem (neuter, no change).","ein Problem → kein Problem."),
mc("Ich spreche ___ gut Deutsch.",["nicht","kein","keine","keinen"],0,"'gut' describes how you speak.","'gut' is an adverb here, so nicht. 'kein Deutsch' would mean no German at all.","'gut' ist ein Adverb. Deshalb: nicht gut. (Ich spreche kein Deutsch = gar kein Deutsch.)")
]},

/* ===== DAY 2 ===== */
{id:"kasus",day:2,title:"Cases: the big picture",de:"Die vier Fälle",
lead:"A case shows the **job** of a noun in the sentence. English mostly shows the job through word order. German shows it on the article, which is why German word order can be more flexible.",
en:"<p>English still has cases, but only in pronouns:</p><p><b>he</b> sees · I see <b>him</b> · <b>his</b> car</p><p><b>who</b> · <b>whom</b> · <b>whose</b></p><p>'The dog bites the man' and 'The man bites the dog' mean different things only because of the order.</p>",
rule:"<ul><li><b>Nominativ</b>: subject. Wer? Was? (who does it)</li><li><b>Akkusativ</b>: direct object. Wen? Was? (who/what is affected)</li><li><b>Dativ</b>: receiver. Wem? (to/for whom)</li><li><b>Genitiv</b>: owner. Wessen? (whose)</li></ul><p>The article changes to show the job. 'Den Mann beißt der Hund' still means the <b>dog</b> bites the man.</p>",
changes:"<p>English 'him' covers two German cases: <b>ihn</b> (Akkusativ: I see him) and <b>ihm</b> (Dativ: I give him the key).</p><p>Shortcut: in Akkusativ <b>only masculine</b> changes (der → den). In Dativ <b>everything</b> changes: dem, der, dem, den.</p>",
formula:"Nom:  der  die  das  die\nAkk:  den  die  das  die      ← only der changes\nDat:  dem  der  dem  den (+n)  ← -m, -r, -m, -n\nGen:  des  der  des  der",
grids:[{title:"Definite article",head:["","masculine","feminine","neuter","plural"],rows:[["Nom","{m|der}","{f|die}","{n|das}","{p|die}"],["Akk","{m|den}","{f|die}","{n|das}","{p|die}"],["Dat","{m|dem}","{f|der}","{n|dem}","{p|den} + n"],["Gen","{m|des} + s","{f|der}","{n|des} + s","{p|der}"]]},{title:"Indefinite article (kein and mein follow this too)",head:["","masculine","feminine","neuter","plural"],rows:[["Nom","{m|ein}","{f|eine}","{n|ein}","{p|keine}"],["Akk","{m|einen}","{f|eine}","{n|ein}","{p|keine}"],["Dat","{m|einem}","{f|einer}","{n|einem}","{p|keinen} + n"],["Gen","{m|eines}","{f|einer}","{n|eines}","{p|keiner}"]]}],
anat:{en:"I give the man the key.",parts:[["Ich","s","Nom · who gives?"],["gebe","v","verb"],["dem Mann","d","Dat · to whom?"],["den Schlüssel","o","Akk · what?"]],note:"Three nouns, three jobs, three different article forms."},
ex:[["The man sees the dog.","{m|Der Mann} sieht {m|den Hund}."],["The dog sees the man.","{m|Der Hund} sieht {m|den Mann}."],["The dog sees the man. (object first, for emphasis)","{m|Den Mann} sieht {m|der Hund}.","same meaning: the article decides"],["I give the man the key.","Ich gebe {m|dem Mann} {m|den Schlüssel}."],["I give the woman the book.","Ich gebe {f|der Frau} {n|das Buch}."],["That is the man's car.","Das ist das Auto {m|des Mannes}.","spoken: vom Mann"]],
mist:[["Ich sehe der Mann.","Ich sehe den Mann.","He is the object (Akk): der → den."],["Ich gebe der Mann das Buch.","Ich gebe dem Mann das Buch.","Receiver = Dativ: der → dem."],["Ich helfe den Mann.","Ich helfe dem Mann.","helfen always takes Dativ."]],
q:[
mc("'Der Hund beißt den Mann.' Who bites?",["the dog","the man"],0,"Which noun has the Nominativ article?","'der Hund' is Nominativ = subject. 'den Mann' is Akkusativ = object.","'der Hund' ist Nominativ, also das Subjekt. Der Hund beißt."),
mc("'Den Mann beißt der Hund.' Who bites?",["the man","the dog"],1,"Ignore the position. Look at the article.","Still the dog. 'der Hund' is Nominativ even in position 3. 'den Mann' is Akkusativ.","Der Artikel zeigt die Rolle, nicht die Position. 'der Hund' = Subjekt."),
mc("Which question finds the Dativ?",["Wer?","Wen?","Wem?","Wessen?"],2,"Think of English 'to whom?'","Wem? = to whom. Wer = Nominativ, Wen = Akkusativ, Wessen = Genitiv.","Dativ: Wem? (Wer = Nom, Wen = Akk, Wessen = Gen)"),
mc("Ich gebe ___ Kollegin ___ Bericht. (die Kollegin, der Bericht)",["die / der","der / den","der / dem","die / den"],1,"Who receives? (Dativ) What is given? (Akkusativ)","Wem? der Kollegin (Dativ feminine: die → der). Was? den Bericht (Akkusativ masculine: der → den).","Wem gebe ich etwas? der Kollegin (Dativ). Was? den Bericht (Akkusativ)."),
mc("In Akkusativ, which gender changes its article?",["masculine only","feminine only","all genders","none"],0,"Compare die/das in Nominativ and Akkusativ.","Only masculine: der → den, ein → einen. die, das and plural stay the same.","Im Akkusativ ändert sich nur maskulin: der → den, ein → einen."),
mc("<i>I see him.</i> Ich sehe ___.",["ihn","ihm","er","sein"],0,"'him' as the direct object. Akkusativ or Dativ?","Direct object = Akkusativ: ihn. 'ihm' is Dativ (to him), 'er' is Nominativ.","Akkusativ: ihn. Ich sehe ihn. (Dativ: ihm)")
]},

{id:"akkusativ",day:2,title:"Akkusativ: the direct object",de:"Der Akkusativ",
lead:"The Akkusativ is the thing or person that directly receives the action. Most verbs take it: haben, brauchen, kaufen, sehen, nehmen, suchen, finden, besuchen, bestellen, and **es gibt**.",
en:"<p><i>I buy <b>a coffee</b>. I need <b>an appointment</b>.</i></p><p>Only pronouns show it in English: me, him, her, us, them.</p>",
rule:"<p><b>Only masculine changes:</b> der → <b>den</b>, ein → <b>einen</b>, kein → <b>keinen</b>, mein → <b>meinen</b>.</p><p>Pronouns: mich, dich, ihn, sie, es, uns, euch, sie, Sie.</p><p><b>es gibt</b> (there is/are) always takes Akkusativ: Es gibt <b>einen</b> Park.</p>",
changes:"<p>English 'there is a park' uses the subject form. German 'es gibt' needs the Akkusativ: einen Park.</p><p><b>n-Deklination (A2, useful at work):</b> some masculine nouns add -n in every case except Nominativ: den Kolleg<b>en</b>, den Kund<b>en</b>, den Nachbar<b>n</b>, den Herr<b>n</b>, den Student<b>en</b>.</p>",
formula:"der → den  ·  ein → einen  ·  kein → keinen  ·  mein → meinen\ndie, das, plural: no change",
grids:[{title:"Pronouns",head:["Nom","ich","du","er","sie","es","wir","ihr","sie/Sie"],rows:[["Akk","mich","dich","ihn","sie","es","uns","euch","sie/Sie"]]}],
ex:[["I need an appointment.","Ich brauche {m|einen Termin}."],["I'm buying a coffee.","Ich kaufe {m|einen Kaffee}."],["Do you have a pen?","Hast du {m|einen Stift}?"],["Is there a supermarket here?","Gibt es hier {m|einen Supermarkt}?"],["I'm visiting my brother.","Ich besuche {m|meinen Bruder}."],["I'm looking for the station.","Ich suche {m|den Bahnhof}."],["Can you pick me up?","Kannst du mich abholen?"],["I'm asking my colleague.","Ich frage {m|meinen Kollegen}.","n-Deklination"]],
mist:[["Ich habe ein Termin.","Ich habe einen Termin.","der Termin, Akkusativ → einen."],["Es gibt ein Park.","Es gibt einen Park.","es gibt + Akkusativ."],["Ich frage den Kollege.","Ich frage den Kollegen.","Kollege is an n-Deklination noun."],["Ich sehe er.","Ich sehe ihn.","Object pronoun: ihn."]],
q:[
mc("Ich brauche ___ Laptop. (der Laptop)",["ein","einen","einem","eine"],1,"brauchen takes Akkusativ. What happens to masculine ein?","Masculine in Akkusativ: ein → einen.","brauchen + Akkusativ. Maskulin: ein → einen."),
mc("Ich nehme ___ Suppe. (die Suppe)",["die","den","der","dem"],0,"Feminine in Akkusativ: does it change?","Feminine does not change in Akkusativ: die Suppe.","Feminin bleibt im Akkusativ gleich: die Suppe."),
mc("Gibt es hier ___ Parkplatz? (der Parkplatz)",["ein","einen","einem","eine"],1,"es gibt always takes one case.","es gibt + Akkusativ. Masculine: einen Parkplatz.","Nach 'es gibt' steht Akkusativ: einen Parkplatz."),
mc("Ich besuche ___ Eltern. (my)",["meine","meinen","meinem","mein"],0,"Eltern is plural. Does plural change in Akkusativ?","Plural in Akkusativ stays like Nominativ: meine Eltern.","Plural im Akkusativ: meine Eltern (keine Änderung)."),
mc("Kannst du ___ abholen? (me)",["mich","mir","ich","mein"],0,"abholen takes a direct object.","abholen + Akkusativ: mich. 'mir' is Dativ.","abholen + Akkusativ: mich."),
mc("Ich frage ___ Kollegen.",["den","dem","der","die"],0,"fragen takes Akkusativ. der Kollege is masculine.","fragen + Akkusativ: den Kollegen. The noun also gets -n (n-Deklination).","fragen + Akkusativ: den Kollegen. 'Kollege' bekommt ein -n.")
]},

{id:"dativ",day:2,title:"Dativ: the receiver",de:"Der Dativ",
lead:"Dativ marks the receiver: to whom, for whom. It also follows certain verbs (helfen, danken, gefallen, gehören, schmecken, passen, antworten, gratulieren) and certain prepositions (Day 2, next topic).",
en:"<p><i>I give <b>my friend</b> a book = I give a book <b>to my friend</b>.</i></p><p>The 'to my friend' part is the Dativ.</p>",
rule:"<p>der → <b>dem</b> · die → <b>der</b> · das → <b>dem</b> · die (plural) → <b>den</b> + noun gets -n</p><p>ein → <b>einem</b> · eine → <b>einer</b> · mein → <b>meinem / meiner</b></p><p>Pronouns: mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen</p>",
changes:"<p>Some verbs that take a normal object in English take Dativ in German: <b>helfen</b> (help), <b>danken</b> (thank), <b>antworten</b> (answer).</p><p><b>'like' flips:</b> 'I like the city' → Die Stadt <b>gefällt mir</b> (the city pleases to me).</p><p><b>Feelings and states use Dativ:</b> Mir ist kalt. Mir geht es gut. Es tut mir leid. Mir tut der Kopf weh.</p>",
formula:"der → dem  ·  die → der  ·  das → dem  ·  die (pl.) → den + n\nMemory: -m, -r, -m, -n",
grids:[{title:"Pronouns",head:["Nom","ich","du","er","sie","es","wir","ihr","sie/Sie"],rows:[["Akk","mich","dich","ihn","sie","es","uns","euch","sie/Sie"],["Dat","mir","dir","ihm","ihr","ihm","uns","euch","ihnen/Ihnen"]]}],
ex:[["I help the man.","Ich helfe {m|dem Mann}."],["I give my colleague the file.","Ich gebe {f|meiner Kollegin} {f|die Datei}."],["How are you? I'm fine.","Wie geht es dir? Mir geht es gut."],["I like the apartment.","{f|Die Wohnung} gefällt mir.","the apartment pleases me"],["That belongs to me.","Das gehört mir."],["I'm sorry.","Es tut mir leid."],["Does Tuesday work for you?","Passt Ihnen Dienstag?"],["with my children","mit {p|meinen Kindern}","plural Dativ: -n"]],
mist:[["Ich helfe dich.","Ich helfe dir.","helfen + Dativ."],["Ich gefalle die Wohnung.","Die Wohnung gefällt mir.","The thing you like is the subject."],["mit meine Freunde","mit meinen Freunden","Dativ plural: -en + noun -n."],["Ich danke Sie.","Ich danke Ihnen.","danken + Dativ."]],
q:[
mc("Kannst du ___ helfen? (me)",["mich","mir","ich","mein"],1,"helfen is one of the verbs that always takes Dativ.","helfen + Dativ: mir. English 'help me' looks like a direct object, German does not see it that way.","helfen + Dativ: Kannst du mir helfen?"),
mc("Ich schreibe ___ Chefin eine E-Mail. (die Chefin)",["die","der","dem","den"],1,"To whom do you write? Feminine in Dativ…","Receiver = Dativ. Feminine die → der: der Chefin.","Wem schreibe ich? der Chefin (Dativ feminin: die → der)."),
mc("<i>I like the city.</i>",["Ich gefalle die Stadt.","Die Stadt gefällt mir.","Ich gefällt die Stadt.","Die Stadt gefällt mich."],1,"With gefallen, the thing you like is the subject. You are the receiver.","Die Stadt (subject) gefällt mir (Dativ). 'Mir gefällt die Stadt' is also correct. 'Ich mag die Stadt' is a simpler alternative.","Mit 'gefallen' ist die Sache das Subjekt: Die Stadt gefällt mir."),
mc("Ich fahre mit ___ Kindern in den Urlaub. (my)",["meine","meinen","meinem","meiner"],1,"mit + Dativ, and Kinder is plural.","mit + Dativ plural: meinen Kindern (article -en, noun -n).","mit + Dativ, Plural: meinen Kindern."),
mc("Wie geht es ___? (formal you)",["Sie","Ihnen","Ihr","dich"],1,"'Wie geht es' + Dativ.","Formal Dativ: Ihnen. Wie geht es Ihnen?","Dativ formell: Ihnen. Wie geht es Ihnen?"),
mc("Das Essen schmeckt ___. (him)",["ihn","ihm","er","sein"],1,"schmecken works like gefallen: the person is in Dativ.","schmecken + Dativ: ihm.","schmecken + Dativ: Das Essen schmeckt ihm.")
]},

{id:"praepositionen",day:2,title:"Prepositions and their case",de:"Präpositionen",
lead:"Prepositions decide the case of the noun after them. Learn them in three groups, and learn them as chunks (mit dem Bus, zu Hause) rather than lists.",
en:"<p>English prepositions never change the noun: <i>with the bus, for the man, in the office</i>.</p><p>English 'to' is used for almost everything: to the doctor, to Berlin, to the cinema, home.</p>",
rule:"<ul><li><b>Always Akkusativ:</b> durch, für, gegen, ohne, um</li><li><b>Always Dativ:</b> aus, bei, mit, nach, seit, von, zu (+ gegenüber)</li><li><b>Two-way:</b> in, an, auf, über, unter, vor, hinter, neben, zwischen. <b>Wo?</b> (location) → Dativ. <b>Wohin?</b> (movement to) → Akkusativ.</li></ul><p>Contractions: zu+dem = <b>zum</b>, zu+der = <b>zur</b>, bei+dem = <b>beim</b>, von+dem = <b>vom</b>, in+dem = <b>im</b>, in+das = <b>ins</b>, an+dem = <b>am</b>.</p>",
changes:"<p>English 'to' splits into four German words:</p><ul><li><b>zu</b>: people, shops, buildings, events: zum Arzt, zur Arbeit</li><li><b>nach</b>: cities, countries, and home: nach Berlin, nach Hause</li><li><b>in</b>: places you enter: ins Kino, in die Stadt</li><li><b>an</b>: water, edges: an den Strand</li></ul><p>'at home' = <b>zu Hause</b>. 'going home' = <b>nach Hause</b>.</p><p>'for' with time still going on = <b>seit</b>, not für: seit sechs Jahren.</p>",
formula:"Wo? (location)      → Dativ:      Ich bin im Büro.\nWohin? (direction)  → Akkusativ:  Ich gehe ins Büro.\nTime: um 8 Uhr · am Montag · im Mai · seit 2020",
ex:[["I'm going to the doctor.","Ich gehe {m|zum Arzt}."],["I'm going to work.","Ich fahre {f|zur Arbeit}."],["I'm flying to India.","Ich fliege nach Indien."],["I'm going home. / I'm at home.","Ich gehe nach Hause. / Ich bin zu Hause."],["I'm at the doctor's.","Ich bin {m|beim Arzt}."],["by bus / by train","{m|mit dem Bus} / {f|mit der Bahn}"],["for my mother / without sugar","{f|für meine Mutter} / ohne Zucker","Akkusativ"],["I'm going to the cinema. / I'm at the cinema.","Ich gehe {n|ins Kino}. / Ich bin {n|im Kino}.","Wohin → Akk · Wo → Dat"],["I put the cup on the table.","Ich stelle die Tasse {m|auf den Tisch}.","movement → Akk"],["The cup is on the table.","Die Tasse steht {m|auf dem Tisch}.","location → Dat"]],
mist:[["Ich gehe zu Hause.","Ich gehe nach Hause.","Going home = nach Hause."],["Ich fahre nach die Arbeit.","Ich fahre zur Arbeit.","Work is a place you go 'zu'."],["mit der Auto","mit dem Auto","das Auto, Dativ → dem."],["für dir","für dich","für + Akkusativ."],["Ich arbeite hier für zwei Jahre.","Ich arbeite hier seit zwei Jahren.","Still true now → seit + Dativ."]],
q:[
mc("Ich fahre jeden Tag ___ Bahn ___ Arbeit.",["mit der / zur","mit die / zu","mit dem / nach","mit der / nach"],0,"mit + Dativ (die Bahn). Work is a place you go 'zu'.","mit + Dativ: die Bahn → der Bahn. zu + der Arbeit = zur Arbeit.","mit + Dativ: mit der Bahn. zu + der = zur: zur Arbeit."),
mc("Nach der Arbeit gehe ich ___. (home)",["zu Hause","nach Hause","im Haus","zum Hause"],1,"Are you at home, or moving towards home?","Movement home = nach Hause. Being at home = zu Hause.","Richtung: nach Hause. Ort: zu Hause."),
mc("Ich bin heute ___ Arzt. (at the doctor's)",["zum","beim","im","am"],1,"Location at a person's place or practice.","bei + dem = beim: at the doctor's. 'zum Arzt' = going to the doctor.","Ort: beim Arzt (bei + dem). Richtung: zum Arzt."),
mc("Das Geschenk ist ___ meinen Vater.",["für","mit","von","zu"],0,"'meinen' is Akkusativ. Which preposition takes Akkusativ?","für + Akkusativ: für meinen Vater. mit, von, zu would need Dativ (meinem).","'meinen' ist Akkusativ. 'für' + Akkusativ: für meinen Vater."),
mc("Ich gehe heute Abend ___ Kino.",["im","ins","in","am"],1,"Wohin or wo? Then: in + das = ?","Movement (wohin) → Akkusativ: in + das = ins Kino.","Wohin? → Akkusativ: in das = ins Kino."),
mc("Der Laptop liegt ___ Tisch.",["auf dem","auf den","auf der","auf das"],0,"liegen = to lie somewhere. Is that location or movement?","Location (wo?) → Dativ: auf dem Tisch.","Wo liegt der Laptop? → Dativ: auf dem Tisch."),
mc("Ich wohne ___ sechs Jahren in Deutschland.",["seit","für","vor","ab"],0,"English says 'for six years'. But it's still true now.","Still ongoing = seit (+ Dativ: Jahren). 'für' is a trap from English.","Die Situation dauert noch an: seit sechs Jahren.")
]},

{id:"possessiv",day:2,title:"my, your, his, her: possessive articles",de:"Possessivartikel",
lead:"mein, dein, sein, ihr, unser, euer, ihr, Ihr. They take exactly the same endings as ein and kein.",
en:"<p><i>my, your, his, her, its, our, your, their, your (formal)</i></p><p>English never changes them: <i>her car, her mother, with her mother</i>.</p>",
rule:"<p>Two decisions:</p><ol><li><b>Who owns it?</b> → mein / dein / sein (his, its) / ihr (her, their) / unser / euer / Ihr (formal)</li><li><b>What noun, which case?</b> → ending like ein: mein Vater, mein<b>e</b> Mutter, mein<b>en</b> Vater (Akk), mit mein<b>em</b> Vater, mit mein<b>er</b> Mutter (Dat)</li></ol>",
changes:"<p>In English, 'her' never changes. In German: <b>ihr</b> Mann (der), <b>ihre</b> Tochter (die), mit <b>ihrem</b> Mann.</p><p>The owner chooses the word; the noun chooses the ending.</p><p>euer drops an e: eu<b>re</b> Wohnung (not euere).</p>",
formula:"Nom: mein  · meine · mein  · meine\nAkk: meinen · meine · mein  · meine\nDat: meinem · meiner · meinem · meinen\n      (m)      (f)     (n)     (pl)",
grids:[{title:"Who owns it?",head:["English","my","your","his/its","her","our","your (pl)","their","your (formal)"],rows:[["German","mein","dein","sein","ihr","unser","euer","ihr","Ihr"]]}],
ex:[["This is my wife.","Das ist {f|meine Frau}."],["His brother lives in Munich.","{m|Sein Bruder} wohnt in München."],["Her husband works at a bank.","{m|Ihr Mann} arbeitet bei einer Bank."],["Is this your bag? (formal)","Ist das {f|Ihre Tasche}?"],["I'm visiting my parents.","Ich besuche {p|meine Eltern}."],["I'm going with my colleague.","Ich gehe {m|mit meinem Kollegen}."],["Our apartment is small.","{f|Unsere Wohnung} ist klein."]],
mist:[["Das ist mein Frau.","Das ist meine Frau.","die Frau → meine."],["mit mein Bruder","mit meinem Bruder","mit + Dativ → meinem."],["Anna und ihre Mann","Anna und ihr Mann","der Mann → ihr (no -e)."],["euere Wohnung","eure Wohnung","euer drops the middle e."]],
q:[
mc("Das ist ___ Tochter. (my)",["mein","meine","meinen","meiner"],1,"die Tochter, Nominativ.","Feminine Nominativ: meine Tochter.","die Tochter → meine Tochter."),
mc("Anna und ___ Mann wohnen in Köln. (her)",["ihr","ihre","sein","seine"],0,"Owner = Anna (her). Noun = der Mann.","Her → ihr. der Mann (Nominativ masculine) → no ending: ihr Mann.","Anna → ihr. der Mann → ihr Mann (ohne -e)."),
mc("Thomas und ___ Frau. (his)",["sein","seine","ihr","ihre"],1,"Owner = Thomas (his). Noun = die Frau.","His → sein. die Frau → seine Frau.","Thomas → sein. die Frau → seine Frau."),
mc("Ich telefoniere mit ___ Mutter. (my)",["meine","meiner","meinem","meinen"],1,"mit + Dativ, die Mutter.","mit + Dativ feminine: meiner Mutter.","mit + Dativ, feminin: meiner Mutter."),
mc("Ist das ___ Schlüssel, Herr Weber? (your, formal)",["dein","Ihr","Ihren","sein"],1,"Formal 'your', and der Schlüssel in Nominativ.","Formal = Ihr (capital). Nominativ masculine, no ending: Ihr Schlüssel.","Formell: Ihr. der Schlüssel im Nominativ: Ihr Schlüssel."),
mc("Ich sehe ___. (them)",["sie","ihnen","ihr","ihre"],0,"sehen + Akkusativ. 'them' as direct object.","Akkusativ 'them' = sie. 'ihnen' is Dativ.","Akkusativ: sie. (Dativ: ihnen)")
]},

{id:"genitiv",day:2,title:"Genitiv: recognise it",de:"Der Genitiv",
lead:"Genitiv shows possession (whose?). In everyday speech it's often replaced by **von + Dativ**. You mainly need to recognise it in writing, letters and official German.",
en:"<p>English uses <b>'s</b> or <b>of</b>: <i>the man's car, the end of the week</i>.</p>",
rule:"<p>Masculine/neuter: <b>des</b> + noun gets -s or -es: des Mann<b>es</b>, des Auto<b>s</b>.</p><p>Feminine/plural: <b>der</b>: der Frau, der Kinder.</p><p>Names: just add -s, <b>no apostrophe</b>: Annas Wohnung.</p><p>Genitiv prepositions: wegen, während, trotz, statt.</p>",
changes:"<p>German usually puts the owner <b>after</b> the thing: das Auto des Mannes (the car of the man).</p><p>Spoken German: das Auto <b>vom</b> Mann, wegen <b>dem</b> Wetter. Both are understood everywhere; use Genitiv in emails and formal writing.</p>",
formula:"m/n:  des Mannes · des Kindes\nf/pl: der Frau · der Kinder\nspoken: von + Dativ",
ex:[["the man's car","das Auto {m|des Mannes}","spoken: vom Mann"],["Anna's apartment","Annas Wohnung","no apostrophe"],["at the end of the week","am Ende {f|der Woche}"],["because of the weather","wegen {n|des Wetters}","spoken: wegen dem Wetter"],["during the meeting","während {n|des Meetings}"],["my colleague's name","der Name {m|meines Kollegen}"]],
mist:[["Anna's Auto","Annas Auto","No apostrophe in German."],["das Auto von der Mann","das Auto vom Mann","von + Dativ: dem → vom."]],
q:[
mc("am Ende ___ Monats (der Monat)",["der","des","dem","den"],1,"Masculine noun with an -s ending.","Genitiv masculine: des Monats.","Genitiv maskulin: des Monats."),
mc("<i>Peter's bike</i>",["Peter's Fahrrad","Peters Fahrrad","Fahrrad von Peters","Peter Fahrrad"],1,"German names add -s, but without something English uses.","Names add -s with no apostrophe: Peters Fahrrad.","Namen + s, ohne Apostroph: Peters Fahrrad."),
mc("Spoken version of 'das Haus meines Vaters':",["das Haus von meinem Vater","das Haus von mein Vater","das Haus meinem Vater","das Haus mit meinem Vater"],0,"von + which case?","von + Dativ: von meinem Vater.","Mündlich: von + Dativ: das Haus von meinem Vater."),
mc("Wegen ___ Streiks fährt kein Zug. (der Streik)",["des","der","dem","den"],0,"wegen + Genitiv, masculine.","Written: wegen des Streiks. Spoken you will also hear 'wegen dem Streik'.","wegen + Genitiv: wegen des Streiks."),
mc("die Farbe ___ Autos (das Auto)",["der","des","dem"],1,"Neuter in Genitiv uses the same article as masculine.","Genitiv neuter: des Autos.","Genitiv neutral: des Autos.")
]},

/* ===== DAY 3 ===== */
{id:"modal",day:3,title:"Modal verbs and the verb bracket",de:"Modalverben",
lead:"können, müssen, wollen, sollen, dürfen, möchten. The modal takes position 2 and the main verb goes to the **very end** as an infinitive. This creates the German 'verb bracket'.",
en:"<p>can, must / have to, want, should / be supposed to, may / be allowed to, would like.</p><p>English keeps both verbs together: <i>I can speak German.</i></p>",
rule:"<p>Modal (conjugated) in position 2, infinitive at the end:</p><p><b>Ich {v|kann} Deutsch {v|sprechen}.</b></p><p>ich and er forms are identical and have no ending: ich kann, er kann · ich muss, er muss.</p>",
changes:"<ul><li><b>must not</b> = nicht <b>dürfen</b>. 'Du musst nicht kommen' means you <b>don't have to</b> come.</li><li><b>Ich will</b> = I <b>want</b>, not future. Future uses werden.</li><li>'Ich will einen Kaffee' sounds rude when ordering. Say <b>Ich möchte</b> or <b>Ich hätte gern</b>.</li><li>Extra politeness: <b>Könnten</b> Sie …? instead of Können Sie …?</li><li>The main verb can be dropped if obvious: Ich muss nach Hause. Ich möchte einen Kaffee.</li></ul>",
formula:"subject + MODAL (pos. 2) + … + infinitive (end)\nIch    muss   morgen im Büro   arbeiten.",
grids:[{title:"Conjugation",head:["","können","müssen","wollen","dürfen","sollen","möchten"],rows:[["ich","kann","muss","will","darf","soll","möchte"],["du","kannst","musst","willst","darfst","sollst","möchtest"],["er/sie/es","kann","muss","will","darf","soll","möchte"],["wir","können","müssen","wollen","dürfen","sollen","möchten"],["ihr","könnt","müsst","wollt","dürft","sollt","möchtet"],["sie/Sie","können","müssen","wollen","dürfen","sollen","möchten"]]}],
anat:{en:"I have to work in the office tomorrow.",parts:[["Ich","s","subject"],["muss","v","pos. 2 · modal"],["morgen","t","time"],["im Büro","p","place"],["arbeiten","v2","end · infinitive"]],note:"muss … arbeiten forms the bracket. Everything else goes inside."},
ex:[["I can speak German.","Ich {v|kann} Deutsch {v|sprechen}."],["I have to work tomorrow.","Ich {v|muss} morgen {v|arbeiten}."],["I'd like a coffee.","Ich {v|möchte} einen Kaffee.","main verb dropped"],["You don't have to come.","Du {v|musst} nicht {v|kommen}."],["You're not allowed to park here.","Hier {v|darf} man nicht {v|parken}."],["Could you please repeat that?","{v|Könnten} Sie das bitte {v|wiederholen}?"],["I'm supposed to call back.","Ich {v|soll} {v|zurückrufen}."],["I want to learn German.","Ich {v|will} Deutsch {v|lernen}."]],
mist:[["Ich kann sprechen Deutsch.","Ich kann Deutsch sprechen.","Infinitive goes to the end."],["Er kannt Englisch.","Er kann Englisch.","er form of a modal has no ending."],["Hier musst du nicht rauchen. (forbidden)","Hier darfst du nicht rauchen.","must not = nicht dürfen."],["Ich will einen Kaffee. (café)","Ich möchte einen Kaffee, bitte.","möchte is the polite standard."]],
q:[
ord("<i>I have to work tomorrow.</i>",["Ich","muss","morgen","arbeiten"],"Modal in position 2, main verb at the very end.","muss is conjugated (position 2), arbeiten is the infinitive at the end. Time 'morgen' sits inside the bracket.","Das Modalverb 'muss' steht auf Position 2. Das Verb 'arbeiten' steht am Ende."),
mc("Er ___ heute nicht kommen. (can)",["kann","kannt","können","kannst"],0,"Modal verbs: are ich and er forms different?","Modals have no ending in ich and er/sie/es: er kann.","Bei Modalverben haben ich und er keine Endung: er kann."),
mc("<i>You must not smoke here.</i>",["Hier musst du nicht rauchen.","Hier darfst du nicht rauchen.","Hier willst du nicht rauchen.","Hier sollst du rauchen nicht."],1,"'must not' = it is forbidden. Which modal means 'be allowed to'?","Forbidden = nicht dürfen. 'musst nicht' means you don't have to.","Verboten: nicht dürfen. 'nicht müssen' bedeutet: es ist nicht nötig."),
mc("<i>You don't have to pay.</i>",["Du darfst nicht bezahlen.","Du musst nicht bezahlen.","Du kannst nicht bezahlen.","Du sollst bezahlen nicht."],1,"Not necessary, but allowed.","Not necessary = nicht müssen: Du musst nicht bezahlen.","Nicht nötig: nicht müssen. Du musst nicht bezahlen."),
mc("At a café, the most natural order:",["Ich will einen Cappuccino.","Ich möchte einen Cappuccino, bitte.","Ich muss einen Cappuccino.","Ich darf einen Cappuccino."],1,"One of these sounds like a demand.","'Ich möchte' (or 'Ich hätte gern') is polite. 'Ich will' sounds like a child demanding.","Im Café sagt man: Ich möchte … / Ich hätte gern …"),
mc("'Ich will morgen arbeiten.' means:",["I will work tomorrow.","I want to work tomorrow.","I must work tomorrow.","I would work tomorrow."],1,"False friend alert.","German 'will' comes from wollen = want. English 'will' is German 'werden'.","'Ich will' = I want. Zukunft: Ich werde arbeiten."),
ord("<i>Could you please speak more slowly?</i>",["Könnten","Sie","bitte","langsamer","sprechen"],"Yes/no question: modal first. Infinitive at the end.","Question: modal 'Könnten' first, then Sie, bitte langsamer, and 'sprechen' at the end.","Frage: Modalverb vorne, Infinitiv am Ende: Könnten Sie bitte langsamer sprechen?")
]},

{id:"trennbar",day:3,title:"Separable verbs",de:"Trennbare Verben",
lead:"Many verbs have a prefix that splits off and goes to the end in main clauses: aufstehen → Ich {v|stehe} um 7 Uhr {v|auf}.",
en:"<p>English phrasal verbs are close: <i>get up, call back, pick up</i>.</p><p>English can already split them: <i>I'll <b>call</b> you <b>back</b>. <b>Pick</b> me <b>up</b>.</i></p>",
rule:"<p><b>Present, main clause:</b> verb in position 2, prefix at the end: Ich rufe dich später <b>an</b>.</p><p><b>With a modal:</b> together at the end: Ich muss früh <b>aufstehen</b>.</p><p><b>Perfekt:</b> ge goes in the middle: auf<b>ge</b>standen, ein<b>ge</b>kauft, an<b>ge</b>rufen.</p><p><b>Subordinate clause:</b> together at the end: …, weil ich früh <b>aufstehe</b>.</p><p><b>zu-infinitive:</b> zu in the middle: auf<b>zu</b>stehen.</p>",
changes:"<p>German always sends the prefix to the very end, however long the sentence.</p><p>Separable (stressed) prefixes: ab, an, auf, aus, ein, mit, nach, vor, zu, zurück, weg, fern, los.</p><p><b>Never separable:</b> be-, ver-, er-, ent-, emp-, ge-, zer-, miss-. They also take no ge- in Perfekt: besucht, verstanden, bezahlt.</p>",
formula:"Ich stehe um 7 Uhr auf.\nIch muss um 7 Uhr aufstehen.\nIch bin um 7 Uhr aufgestanden.\n…, weil ich um 7 Uhr aufstehe.",
anat:{en:"I'll call you later.",parts:[["Ich","s","subject"],["rufe","v","pos. 2"],["dich","o","Akk"],["später","t","time"],["an","v2","end · prefix"]],note:"rufe … an brackets the sentence, just like a modal + infinitive."},
ex:[["I get up at 7.","Ich {v|stehe} um 7 Uhr {v|auf}."],["I'm going shopping today.","Ich {v|kaufe} heute {v|ein}."],["I'll call you later.","Ich {v|rufe} dich später {v|an}."],["Are you coming along?","{v|Kommst} du {v|mit}?"],["The train leaves at 9:15.","Der Zug {v|fährt} um 9:15 Uhr {v|ab}."],["I have to get up early.","Ich {v|muss} früh {v|aufstehen}."],["I called my mother yesterday.","Ich {v|habe} gestern meine Mutter {v|angerufen}."],["I'm tired because I always get up early.","Ich bin müde, weil ich immer früh {v|aufstehe}."],["I'm visiting my parents. (not separable)","Ich {v|besuche} meine Eltern."]],
mist:[["Ich aufstehe um 7.","Ich stehe um 7 auf.","Prefix goes to the end."],["Ich habe angeruft.","Ich habe angerufen.","rufen → gerufen, so anrufen → angerufen."],["Ich habe gebesucht.","Ich habe besucht.","be- verbs take no ge-."],["…, weil ich stehe früh auf.","…, weil ich früh aufstehe.","In weil-clauses the verb joins up at the end."]],
q:[
ord("Start with 'Am Samstag': <i>On Saturday I go shopping.</i>",["Am Samstag","kaufe","ich","ein"],"einkaufen splits. Verb in position 2, prefix at the end.","'Am Samstag' position 1, 'kaufe' position 2, 'ich', and the prefix 'ein' at the end.","einkaufen ist trennbar: Am Samstag kaufe ich ein."),
mc("Ich ___ dich morgen ___. (anrufen)",["rufe … an","anrufe … (nothing)","rufe an … (nothing)","ruft … an"],0,"anrufen is separable. Conjugate for 'ich'.","Main clause: rufe in position 2, 'an' at the end: Ich rufe dich morgen an.","Hauptsatz: Ich rufe dich morgen an."),
mc("Perfekt of einkaufen:",["eingekauft","geeinkauft","einkaufte","eingekaufen"],0,"Where does 'ge' go in a separable verb?","ge goes between prefix and stem: ein + ge + kauft.","'ge' steht in der Mitte: eingekauft."),
mc("<i>Can you pick me up?</i> (abholen)",["Kannst du mich abholen?","Kannst du mich holen ab?","Kannst du abholen mich?","Holst du mich ab kannst?"],0,"With a modal, what happens to the separable verb?","With a modal, the separable verb stays together at the end: abholen.","Mit Modalverb steht das Verb zusammen am Ende: abholen."),
mc("Which verb is NOT separable?",["anrufen","mitkommen","verstehen","aussteigen"],2,"Look for an unstressed prefix.","ver- never separates: Ich verstehe. Perfekt: verstanden (no ge).","'ver-' ist nicht trennbar: Ich verstehe. Perfekt: verstanden."),
mc("…, weil der Zug um 8 Uhr ___.",["fährt ab","abfährt","ab fährt","abgefahren"],1,"In a weil-clause, the conjugated verb goes to the end. What happens to the prefix?","In subordinate clauses the separable verb joins up again at the end: abfährt.","Im Nebensatz steht das Verb zusammen am Ende: …, weil der Zug um 8 Uhr abfährt.")
]},

{id:"perfekt",day:3,title:"Perfekt: talking about the past",de:"Das Perfekt",
lead:"Spoken German uses the Perfekt for almost everything in the past. Formula: **haben or sein** in position 2 + **Partizip II** at the end.",
en:"<p>English 'I have eaten' looks the same, but is used differently.</p><p>English says <i>I <b>ate</b> yesterday</i>. You would never say <i>I have eaten yesterday</i>.</p>",
rule:"<p>German Perfekt = English simple past in conversation: <b>Ich {v|habe} gestern {v|gegessen}.</b></p><p><b>sein</b> instead of haben for:</p><ul><li>movement from A to B: gehen, fahren, fliegen, kommen, laufen</li><li>change of state: aufstehen, einschlafen, aufwachen, werden, sterben</li><li>sein, bleiben, passieren</li></ul><p>Everything else uses <b>haben</b>.</p>",
changes:"<p>Partizip II patterns:</p><ul><li>regular: ge + stem + t: machen → <b>gemacht</b>, arbeiten → <b>gearbeitet</b></li><li>irregular: ge + stem + en (vowel may change): gehen → <b>gegangen</b>, trinken → <b>getrunken</b></li><li>separable: ge in the middle: <b>eingekauft</b>, <b>aufgestanden</b></li><li>no ge for be-/ver-/er-/ent- and -ieren: <b>besucht</b>, <b>verstanden</b>, <b>studiert</b>, <b>passiert</b></li></ul>",
formula:"subject + haben/sein (pos. 2) + … + Partizip II (end)\nIch    habe   gestern mit meinem Freund im Restaurant   gegessen.",
grids:[{title:"Most common participles",head:["Infinitive","Partizip II","with"],rows:[["machen","gemacht","haben"],["arbeiten","gearbeitet","haben"],["kaufen","gekauft","haben"],["essen","gegessen","haben"],["trinken","getrunken","haben"],["sprechen","gesprochen","haben"],["sehen","gesehen","haben"],["schlafen","geschlafen","haben"],["nehmen","genommen","haben"],["schreiben","geschrieben","haben"],["finden","gefunden","haben"],["treffen","getroffen","haben"],["gehen","gegangen","sein"],["kommen","gekommen","sein"],["fahren","gefahren","sein"],["fliegen","geflogen","sein"],["bleiben","geblieben","sein"],["aufstehen","aufgestanden","sein"],["besuchen","besucht","haben"],["studieren","studiert","haben"]]}],
anat:{en:"I ate with my friend in the restaurant yesterday.",parts:[["Ich","s","subject"],["habe","v","pos. 2 · auxiliary"],["gestern","t","time"],["mit meinem Freund","d","with whom · Dativ"],["im Restaurant","p","place"],["gegessen","v2","end · Partizip II"]],note:"habe … gegessen is the bracket. Time, then manner, then place inside."},
ex:[["I worked yesterday.","Ich {v|habe} gestern {v|gearbeitet}."],["I went to Berlin.","Ich {v|bin} nach Berlin {v|gefahren}.","movement → sein"],["What did you do at the weekend?","Was {v|hast} du am Wochenende {v|gemacht}?"],["I got up late.","Ich {v|bin} spät {v|aufgestanden}."],["I visited my parents.","Ich {v|habe} meine Eltern {v|besucht}.","be- → no ge"],["I studied in Dresden.","Ich {v|habe} in Dresden {v|studiert}.","-ieren → no ge"],["What happened?","Was {v|ist} {v|passiert}?"],["We stayed at home.","Wir {v|sind} zu Hause {v|geblieben}."]],

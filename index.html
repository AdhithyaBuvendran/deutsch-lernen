mist:[["Ich habe gegangen.","Ich bin gegangen.","gehen = movement → sein."],["Ich habe gearbeiten.","Ich habe gearbeitet.","Regular verbs end in -t."],["Ich habe geessen.","Ich habe gegessen.","Irregular: gegessen."],["Ich habe gestudiert.","Ich habe studiert.","-ieren verbs take no ge."],["Ich bin gestern gearbeitet.","Ich habe gestern gearbeitet.","arbeiten is not movement → haben."]],
q:[
mc("Ich ___ gestern nach Hamburg ___. (fahren)",["habe … gefahren","bin … gefahren","bin … gefahrt","habe … fahren"],1,"Movement from A to B. Which auxiliary?","Movement → sein. fahren is irregular → gefahren.","Bewegung von A nach B → sein: Ich bin nach Hamburg gefahren."),
mc("Partizip II of essen:",["geessen","gegessen","gegesst","essen"],1,"It's irregular and has a double ge sound.","essen → gegessen (irregular, -en).","essen → gegessen."),
mc("Wir ___ Pizza gegessen.",["haben","sind","hat","seid"],0,"Is eating a movement or change of state?","Not movement → haben. wir → haben.","Essen ist keine Bewegung → haben."),
mc("Partizip II of besuchen:",["gebesucht","besucht","besuchen","begesucht"],1,"Verbs starting with be- have a special rule.","be- verbs take no ge-: besucht.","Verben mit be- haben kein ge-: besucht."),
ord("<i>What did you do yesterday?</i>",["Was","hast","du","gestern","gemacht"],"W-word, then auxiliary in position 2, participle at the end.","Was (pos. 1), hast (pos. 2), du, gestern, gemacht (end).","Was hast du gestern gemacht? (hast = Position 2, gemacht = Ende)"),
mc("Ich ___ um 6 Uhr aufgestanden.",["habe","bin","hat","war"],1,"Getting up is a change of state.","aufstehen = change of state → sein: Ich bin aufgestanden.","aufstehen = Zustandswechsel → sein."),
mc("Er telefoniert. → Er hat ___.",["getelefoniert","telefoniert","telefonieren","telefoniererte"],1,"Verbs ending in -ieren have a special rule.","-ieren verbs take no ge-: telefoniert.","Verben auf -ieren: kein ge-. Er hat telefoniert.")
]},

{id:"praeteritum",day:3,title:"Präteritum: war, hatte, konnte",de:"Präteritum (sein, haben, Modalverben)",
lead:"For most verbs, spoken German uses Perfekt. But for **sein, haben and modal verbs**, Germans use the simple past (Präteritum): 'Ich war', not 'Ich bin gewesen'.",
en:"<p>Just like English simple past: <i>was, had, could, had to, wanted</i>.</p>",
rule:"<p>ich and er forms are the same (no ending): ich war, er war · ich musste, er musste.</p><p>Modals drop the umlaut: können → <b>konnte</b>, müssen → <b>musste</b>, dürfen → <b>durfte</b>.</p><p>es gibt → <b>es gab</b> (there was).</p>",
changes:"<p>'Ich habe gewesen' is wrong. Use 'Ich war' (or 'Ich bin gewesen').</p><p>Careful: <b>müsste</b> (with ü) means 'would have to'. Past = <b>musste</b>.</p>",
formula:"sein: war · warst · war · waren · wart · waren\nhaben: hatte · hattest · hatte · hatten · hattet · hatten\nmodals: konnte · musste · wollte · durfte · sollte",
grids:[{title:"Präteritum",head:["","sein","haben","können","müssen","wollen"],rows:[["ich","war","hatte","konnte","musste","wollte"],["du","warst","hattest","konntest","musstest","wolltest"],["er/sie/es","war","hatte","konnte","musste","wollte"],["wir","waren","hatten","konnten","mussten","wollten"],["ihr","wart","hattet","konntet","musstet","wolltet"],["sie/Sie","waren","hatten","konnten","mussten","wollten"]]}],
ex:[["I was in Berlin yesterday.","Ich {v|war} gestern in Berlin."],["I had no time.","Ich {v|hatte} keine Zeit."],["I couldn't come.","Ich {v|konnte} nicht kommen."],["I had to work.","Ich {v|musste} arbeiten."],["We wanted to go to the cinema.","Wir {v|wollten} ins Kino gehen."],["How was your weekend?","Wie {v|war} dein Wochenende?"],["There was a problem.","Es {v|gab} ein Problem."]],
mist:[["Ich habe gewesen.","Ich war.","sein uses sein in Perfekt, and Präteritum is more common."],["Ich müsste arbeiten. (past)","Ich musste arbeiten.","ü = would have to."],["Ich habe nicht kommen gekonnt.","Ich konnte nicht kommen.","Use Präteritum for modals."]],
q:[
mc("Wie ___ dein Urlaub?",["war","hatte","wurde","warst"],0,"Past of 'ist'.","sein → war (er/es form).","sein im Präteritum: war. Wie war dein Urlaub?"),
mc("Ich ___ gestern Kopfschmerzen.",["war","hatte","hattest","habe"],1,"You 'have' a headache in German.","haben → hatte (ich form).","Kopfschmerzen hat man: Ich hatte Kopfschmerzen."),
mc("<i>I had to work yesterday.</i>",["Ich müsste gestern arbeiten.","Ich musste gestern arbeiten.","Ich habe gestern arbeiten gemusst.","Ich muss gestern arbeiten."],1,"Modals drop the umlaut in the past.","musste (no umlaut) = had to. müsste = would have to.","Präteritum: musste (ohne ü)."),
mc("___ du gestern zu Hause?",["Warst","War","Hattest","Bist"],0,"Past of 'bist'.","du → warst.","du warst (Präteritum von sein)."),
mc("Leider ___ wir nicht kommen. (couldn't)",["konnten","könnten","können","konnte"],0,"wir form, past, no umlaut.","wir konnten = we couldn't. könnten (with ö) = we could (hypothetical).","wir konnten (Präteritum, ohne Umlaut).")
]},

/* ===== DAY 4 ===== */
{id:"wortstellung",day:4,title:"Word order: bracket and TeKaMoLo",de:"Satzklammer und TeKaMoLo",
lead:"German main clauses have a frame: verb part 1 in position 2, verb part 2 at the end. Everything else sits in the middle. Inside the middle, the usual order is **Te**mporal (time) · **Ka**usal (reason) · **Mo**dal (how) · **Lo**kal (place).",
en:"<p>English puts place before time: <i>I'm going <b>to Berlin</b> by train <b>tomorrow</b>.</i></p><p>English keeps verbs together: <i>I have eaten, I must go</i>.</p>",
rule:"<p><b>Verb bracket:</b> [Pos. 1] [Verb 1] [middle] [Verb 2]. Verb 2 is an infinitive (modal), a participle (Perfekt) or a separable prefix.</p><p><b>Middle:</b> time → reason → manner → place.</p><p><b>Ich fahre morgen mit dem Zug nach Berlin.</b></p><p>Pronouns come early in the middle. Dativ noun before Akkusativ noun: Ich gebe dem Mann den Schlüssel.</p>",
changes:"<p>English 'place, then time' flips to 'time, then place'.</p><p>TeKaMoLo is a strong tendency, not an absolute law. Moving something to the end puts emphasis on it.</p><p><b>nicht</b> usually sits late, just before verb 2 or the place: Ich kann heute <b>nicht</b> kommen.</p>",
formula:"Pos.1 | VERB 1 | subject | time | reason | manner | place | VERB 2\nIch   | fahre  |         | morgen |      | mit dem Zug | nach Berlin |\nIch   | bin    |         | gestern |     | mit dem Zug | nach Berlin | gefahren.",
anat:{en:"I'm going to Berlin by train tomorrow.",parts:[["Ich","s","subject"],["fahre","v","pos. 2"],["morgen","t","Te · time"],["mit dem Zug","m","Mo · how"],["nach Berlin","p","Lo · place"]],note:"English order is place, how, time. German is time, how, place."},
ex:[["I'm going to Berlin by train tomorrow.","Ich {v|fahre} morgen mit dem Zug nach Berlin."],["Tomorrow I'm going to Berlin by train.","Morgen {v|fahre} ich mit dem Zug nach Berlin."],["I have to go to Berlin by train tomorrow.","Ich {v|muss} morgen mit dem Zug nach Berlin {v|fahren}."],["I went to Berlin by train yesterday.","Ich {v|bin} gestern mit dem Zug nach Berlin {v|gefahren}."],["Today I'm working from home because of the strike.","Heute {v|arbeite} ich wegen des Streiks im Homeoffice.","Te, Ka, Lo"],["I'm giving my colleague the report.","Ich {v|gebe} meiner Kollegin den Bericht.","Dat noun before Akk noun"]],
mist:[["Ich fahre nach Berlin morgen.","Ich fahre morgen nach Berlin.","Time before place."],["Ich habe gegessen gestern.","Ich habe gestern gegessen.","Participle goes to the very end."],["Ich muss arbeiten heute.","Ich muss heute arbeiten.","Infinitive goes to the very end."]],
q:[
ord("<i>I go to the gym after work.</i>",["Ich","gehe","nach der Arbeit","ins Fitnessstudio"],"Time before place.","TeKaMoLo: time 'nach der Arbeit' comes before place 'ins Fitnessstudio'.","Zeit vor Ort: Ich gehe nach der Arbeit ins Fitnessstudio."),
ord("Start with 'Heute': <i>Today I'm cycling to the office.</i>",["Heute","fahre","ich","mit dem Fahrrad","ins Büro"],"Verb straight after 'Heute', then subject. Then how, then where.","Heute (pos. 1), fahre (pos. 2), ich, mit dem Fahrrad (manner), ins Büro (place).","Heute fahre ich mit dem Fahrrad ins Büro. (Mo vor Lo)"),
mc("Most natural:",["Ich fahre nach München morgen mit dem Auto.","Ich fahre morgen mit dem Auto nach München.","Ich fahre mit dem Auto nach München morgen.","Morgen ich fahre mit dem Auto nach München."],1,"Te, Ka, Mo, Lo.","Time (morgen) → manner (mit dem Auto) → place (nach München).","TeKaMoLo: morgen (Zeit), mit dem Auto (Art), nach München (Ort)."),
ord("<i>I have to buy bread today.</i>",["Ich","muss","heute","Brot","kaufen"],"Modal at position 2, infinitive at the end.","muss … kaufen is the bracket; heute and Brot go inside.","Satzklammer: muss … kaufen."),
ord("<i>I met my friend in the café yesterday.</i>",["Ich","habe","gestern","meinen Freund","im Café","getroffen"],"habe … getroffen. Time early, place late.","Bracket habe … getroffen. Inside: time, object, place.","Ich habe gestern meinen Freund im Café getroffen."),
mc("<i>I can't come today.</i>",["Ich kann nicht heute kommen.","Ich kann heute nicht kommen.","Ich kann heute kommen nicht.","Ich nicht kann heute kommen."],1,"nicht usually sits right before verb 2.","nicht goes just before the infinitive at the end. 'nicht heute' would mean 'not today (but another day)'.","'nicht' steht vor dem Infinitiv: Ich kann heute nicht kommen.")
]},

{id:"nebensatz",day:4,title:"Subordinate clauses: verb to the end",de:"Nebensätze",
lead:"weil, dass, wenn, obwohl, als, ob send the conjugated verb to the **end** of their clause. There is always a comma.",
en:"<p>English keeps normal order after 'because' or 'that':</p><p><i>I'm learning German because <b>I live</b> in Germany.</i></p>",
rule:"<p>Conjunction + subject + … + conjugated verb (last):</p><p><b>…, weil ich in Deutschland {v|lebe}.</b></p><p>With modal: …, weil ich arbeiten <b>muss</b>.</p><p>With Perfekt: …, weil ich krank gewesen <b>bin</b>.</p><p>If the subordinate clause comes <b>first</b>, it fills position 1, so the main verb comes straight after the comma: <b>Wenn ich Zeit habe, {v|komme} ich.</b> (verb, comma, verb)</p>",
changes:"<ul><li>English 'if' splits: <b>wenn</b> (condition) and <b>ob</b> (whether).</li><li>English 'when' splits: <b>wenn</b> (present/future, repeated), <b>als</b> (one event in the past), <b>wann</b> (question).</li><li>Indirect questions also send the verb to the end: Wissen Sie, wo der Bahnhof <b>ist</b>?</li><li>In casual speech you'll hear 'weil ich habe keine Zeit'. It's common but not standard; write the verb at the end.</li></ul>",
formula:"Main clause,  conjunction + subject + … + VERB.\nSub clause,   VERB + subject + …",
anat:{en:"I'm learning German because I live in Germany.",parts:[["Ich lerne Deutsch,","x","main clause"],["weil","c","conjunction"],["ich","s","subject"],["in Deutschland","p","place"],["lebe","v2","verb at end"]],note:"After weil the verb waits until the very end."},
ex:[["I'm learning German because I live in Germany.","Ich lerne Deutsch, weil ich in Deutschland {v|lebe}."],["I think that the train is late.","Ich glaube, dass der Zug Verspätung {v|hat}."],["If I have time, I'll come.","Wenn ich Zeit {v|habe}, {v|komme} ich."],["When I came to Germany, I could speak little German.","Als ich nach Deutschland {v|kam}, {v|konnte} ich wenig Deutsch.","one past event → als"],["Although it's raining, I'm going jogging.","Obwohl es {v|regnet}, {v|gehe} ich joggen."],["I don't know whether he's coming.","Ich weiß nicht, ob er {v|kommt}."],["Can you tell me where the station is?","Können Sie mir sagen, wo der Bahnhof {v|ist}?"],["I can't come because I have to work.","Ich kann nicht kommen, weil ich arbeiten {v|muss}."]],
mist:[["…, weil ich habe keine Zeit.","…, weil ich keine Zeit habe.","weil → verb at the end."],["Wenn ich Zeit habe, ich komme.","Wenn ich Zeit habe, komme ich.","The wenn-clause is position 1."],["Als ich Zeit habe, …","Wenn ich Zeit habe, …","als is only for one past event."],["Ich weiß nicht, wenn er kommt.","Ich weiß nicht, ob er kommt.","whether = ob."]],
q:[
ord("Complete: <i>Ich bleibe zu Hause, …</i> (because I'm sick)",["weil","ich","krank","bin"],"weil sends the verb to the end.","weil + subject + krank + verb last: weil ich krank bin.","Nach 'weil' steht das Verb am Ende: weil ich krank bin."),
mc("Ich glaube, …",["dass der Termin ist morgen.","dass der Termin morgen ist.","dass ist der Termin morgen.","dass morgen ist der Termin."],1,"dass behaves like weil.","dass sends the verb to the end: dass der Termin morgen ist.","Nach 'dass' steht das Verb am Ende."),
mc("___ ich ein Kind war, habe ich in Indien gewohnt.",["Als","Wenn","Wann","Ob"],0,"A single period in the past.","One past event or period = als.","Einmalig in der Vergangenheit: als."),
mc("Ich weiß nicht, ___ ich morgen Zeit habe.",["wenn","ob","dass","als"],1,"English: 'I don't know whether …'","whether = ob.","'whether' = ob: Ich weiß nicht, ob …"),
mc("<i>If it rains, we'll stay at home.</i>",["Wenn es regnet, wir bleiben zu Hause.","Wenn es regnet, bleiben wir zu Hause.","Wenn regnet es, bleiben wir zu Hause.","Ob es regnet, bleiben wir zu Hause."],1,"The wenn-clause is position 1. What comes next?","The whole wenn-clause is position 1, so the main verb 'bleiben' comes right after the comma.","Der Nebensatz ist Position 1. Danach kommt sofort das Verb: bleiben wir."),
ord("<i>…, because I have to work.</i>",["weil","ich","arbeiten","muss"],"In a subordinate clause the modal itself goes last.","With a modal: infinitive, then the conjugated modal at the very end.","Im Nebensatz: …, weil ich arbeiten muss. (Modalverb ganz am Ende)"),
mc("___ es kalt ist, gehe ich spazieren. (although)",["Obwohl","Weil","Wenn","Dass"],0,"although = ?","obwohl = although.","'although' = obwohl."),
mc("Können Sie mir sagen, wo ___?",["ist die Toilette","die Toilette ist","die Toilette sein","Toilette ist"],1,"An indirect question works like a subordinate clause.","Indirect questions send the verb to the end: wo die Toilette ist.","Indirekte Frage: Verb am Ende: wo die Toilette ist.")
]},

{id:"konnektoren",day:4,title:"Connectors: three groups",de:"Konnektoren",
lead:"Not all connectors behave the same. Sort them by what they do to the verb, and you will never mix them up.",
en:"<p>In English, 'but', 'because', 'so', 'therefore' never change word order.</p>",
rule:"<p><b>Group 0 (no effect):</b> und, aber, oder, denn, sondern. Normal order follows.</p><p><b>Group 1 (they take position 1):</b> deshalb, deswegen, trotzdem, dann, danach, außerdem. Verb follows immediately.</p><p><b>Group END:</b> weil, dass, wenn, obwohl, als, ob. Verb goes to the end.</p>",
changes:"<p><b>denn</b> and <b>weil</b> both mean 'because', but: denn ich <b>bin</b> krank / weil ich krank <b>bin</b>.</p><p><b>aber</b> vs <b>sondern</b>: after a negative, when you correct it, use sondern: nicht Kaffee, <b>sondern</b> Tee.</p>",
formula:"…, aber / denn / und  + subject + VERB …\n…, deshalb / trotzdem + VERB + subject …\n…, weil / dass / obwohl + subject … VERB.",
ex:[["I'm tired, but I'm working.","Ich bin müde, aber ich {v|arbeite}."],["I'm staying home because I'm sick. (denn)","Ich bleibe zu Hause, denn ich {v|bin} krank."],["I'm staying home because I'm sick. (weil)","Ich bleibe zu Hause, weil ich krank {v|bin}."],["I'm sick, so I'm staying home.","Ich bin krank, deshalb {v|bleibe} ich zu Hause."],["It's raining. I'm going jogging anyway.","Es regnet. Trotzdem {v|gehe} ich joggen."],["First I eat, then I study.","Zuerst {v|esse} ich, dann {v|lerne} ich."],["not coffee but tea","nicht Kaffee, sondern Tee"]],
mist:[["…, deshalb ich bleibe zu Hause.","…, deshalb bleibe ich zu Hause.","deshalb takes position 1."],["…, denn ich krank bin.","…, denn ich bin krank.","denn does not move the verb."],["Nicht heute, aber morgen.","Nicht heute, sondern morgen.","Correction after a negative → sondern."]],
q:[
mc("Ich bin krank, deshalb ___.",["ich bleibe zu Hause","bleibe ich zu Hause","ich zu Hause bleibe"],1,"deshalb takes position 1.","deshalb is position 1, so the verb comes next: bleibe ich.","'deshalb' steht auf Position 1, danach kommt das Verb."),
mc("Ich lerne Deutsch, denn ___.",["ich lebe in Deutschland","ich in Deutschland lebe","lebe ich in Deutschland"],0,"denn is in the 'no effect' group.","denn doesn't change word order: denn ich lebe in Deutschland.","'denn' ändert die Wortstellung nicht."),
mc("Das ist nicht mein Handy, ___ das von Anna.",["aber","sondern","denn","oder"],1,"Negative first, then a correction.","After a negative + correction: sondern.","Nach einer Negation mit Korrektur: sondern."),
mc("Es ist spät. ___ arbeite ich noch. (anyway)",["Trotzdem","Obwohl","Weil","Aber"],0,"The verb comes straight after the gap.","trotzdem (anyway) takes position 1, verb follows. obwohl would need the verb at the end.","'Trotzdem' steht auf Position 1, dann das Verb."),
mc("Ich habe Hunger, ___ ich habe heute noch nichts gegessen.",["weil","denn","deshalb","dass"],1,"'because', and the word order after the gap is normal (verb in position 2).","Normal order after 'because' → denn. weil would need '… nichts gegessen habe'.","Normale Wortstellung nach 'because' → denn.")
]},

/* ===== DAY 5 ===== */
{id:"reflexiv",day:5,title:"Reflexive verbs",de:"Reflexive Verben",
lead:"The action goes back to the subject, marked with **sich**. German has many more reflexive verbs than English, and many are not reflexive in English at all.",
en:"<p>English has a few: <i>I wash myself, enjoy yourself</i>.</p><p>But 'I'm interested', 'I'm looking forward', 'we meet', 'hurry up' have no 'myself'.</p>",
rule:"<p><b>Akkusativ reflexive:</b> mich, dich, sich, uns, euch, sich, sich.</p><p><b>Dativ reflexive</b> when there's another object: Ich wasche <b>mir</b> die Hände. Ich kaufe <b>mir</b> ein Handy.</p><p>Common: sich freuen auf/über, sich interessieren für, sich treffen, sich beeilen, sich erinnern an, sich fühlen, sich ausruhen, sich anmelden, sich bewerben um/bei, sich vorstellen.</p>",
changes:"<p>Many of these are 'I am + adjective' in English: I'm interested = Ich interessiere <b>mich</b>.</p><p>freuen <b>auf</b> = looking forward to (future). freuen <b>über</b> = happy about (now/past).</p><p>Position: sich comes right after the verb, or right after the subject if that came after the verb: Morgen treffe ich <b>mich</b> mit Anna.</p>",
formula:"ich mich · du dich · er/sie/es sich · wir uns · ihr euch · sie/Sie sich\n+ second object → mir / dir: Ich wasche mir die Hände.",
ex:[["I'm interested in music.","Ich interessiere {v|mich} für Musik."],["I don't feel well.","Ich fühle {v|mich} nicht gut."],["I'm looking forward to the weekend.","Ich freue {v|mich} auf das Wochenende."],["We're meeting at 6.","Wir treffen {v|uns} um 18 Uhr."],["Hurry up!","Beeil {v|dich}!"],["I'm applying for a job.","Ich bewerbe {v|mich} um eine Stelle."],["I wash my hands.","Ich wasche {v|mir} die Hände.","second object → Dativ"],["Sit down, please. (formal)","Setzen Sie {v|sich} bitte."]],
mist:[["Ich freue auf das Wochenende.","Ich freue mich auf das Wochenende.","freuen needs the reflexive."],["Ich fühle gut.","Ich fühle mich gut.","fühlen (about yourself) is reflexive."],["Wir treffen sich.","Wir treffen uns.","wir → uns."],["Ich wasche mich die Hände.","Ich wasche mir die Hände.","With a second object → Dativ."]],
q:[
mc("Ich interessiere ___ für Fußball.",["mich","mir","sich","dich"],0,"ich → ? (Akkusativ reflexive)","ich → mich.","ich → mich: Ich interessiere mich für Fußball."),
mc("Wir treffen ___ morgen.",["sich","uns","euch","wir"],1,"wir → ?","wir → uns. 'sich' is only for er/sie/es/sie/Sie.","wir → uns."),
mc("<i>I'm looking forward to the holiday.</i>",["Ich freue mich auf den Urlaub.","Ich freue mich über den Urlaub.","Ich freue auf den Urlaub.","Ich bin freue auf den Urlaub."],0,"Is the holiday in the future? Which preposition is for the future?","freuen auf = something coming. freuen über = something that's already here.","sich freuen auf = Zukunft. sich freuen über = jetzt / Vergangenheit."),
mc("Ich putze ___ die Zähne.",["mich","mir"],1,"There's already an object: die Zähne.","With a second object (die Zähne), the reflexive becomes Dativ: mir.","Mit einem zweiten Objekt: Dativ → mir."),
mc("Fühlst du ___ besser?",["dich","dir","sich"],0,"du → ? (Akkusativ)","du → dich.","du → dich."),
ord("<i>I'm applying for the job.</i>",["Ich","bewerbe","mich","um die Stelle"],"Reflexive pronoun right after the verb.","bewerbe in position 2, mich right after, then the preposition phrase.","Ich bewerbe mich um die Stelle.")
]},

{id:"vergleich",day:5,title:"Comparing: bigger, the biggest",de:"Komparativ und Superlativ",
lead:"German compares like short English adjectives: add **-er** and **-(e)sten**. It does this even for long adjectives.",
en:"<p>big, bigger, biggest</p><p>But long ones use more/most: <i>more interesting, most interesting</i>.</p>",
rule:"<p>adjective + <b>er</b> · <b>am</b> + adjective + <b>(e)sten</b></p><p>Short words with a/o/u often add an umlaut: alt → älter, groß → größer, jung → jünger, kalt → kälter, warm → wärmer, lang → länger.</p><p><b>Irregular:</b> gut → besser → am besten · viel → mehr → am meisten · gern → lieber → am liebsten · hoch → höher</p><p><b>than</b> = als · <b>as … as</b> = so … wie</p>",
changes:"<p>No 'more' + adjective: interessant<b>er</b>, not mehr interessant.</p><p>'than' is <b>als</b>. 'größer wie' is heard regionally but avoid it.</p><p>'I prefer / I like X more' = Ich trinke <b>lieber</b> Tee.</p>",
formula:"adj + er + als        →  größer als\nso + adj + wie        →  so groß wie\nam + adj + sten       →  am größten",
grids:[{title:"Key forms",head:["","comparative","superlative"],rows:[["schnell","schneller","am schnellsten"],["groß","größer","am größten"],["alt","älter","am ältesten"],["gut","besser","am besten"],["viel","mehr","am meisten"],["gern","lieber","am liebsten"],["teuer","teurer","am teuersten"],["interessant","interessanter","am interessantesten"]]}],
ex:[["Berlin is bigger than Hannover.","Berlin ist größer als Hannover."],["The train is faster than the bus.","Der Zug ist schneller als der Bus."],["This book is more interesting.","Dieses Buch ist interessanter."],["Today it's as cold as yesterday.","Heute ist es so kalt wie gestern."],["I prefer drinking tea.","Ich trinke lieber Tee."],["I like pizza best.","Am liebsten esse ich Pizza."],["That's the best idea.","Das ist die beste Idee."]],
mist:[["mehr interessant","interessanter","No 'mehr' with adjectives."],["besser wie","besser als","than = als."],["am gutesten","am besten","gut is irregular."]],
q:[
mc("Mein Bruder ist ___ als ich. (alt)",["alter","älter","mehr alt","am ältesten"],1,"Short adjective with 'a'. Something extra happens.","alt → älter (umlaut).","alt → älter (mit Umlaut)."),
mc("Das Wetter heute ist ___ als gestern. (gut)",["guter","besser","mehr gut","am besten"],1,"gut is irregular, just like English 'good'.","gut → besser → am besten.","gut → besser → am besten."),
mc("Berlin ist größer ___ München.",["als","wie","dann","so"],0,"English 'than'.","than = als. wie is for 'as … as'.","'than' = als."),
mc("<i>I prefer to drink coffee.</i>",["Ich trinke mehr gern Kaffee.","Ich trinke lieber Kaffee.","Ich trinke besser Kaffee.","Ich trinke gerner Kaffee."],1,"Comparative of gern is irregular.","gern → lieber. 'Ich trinke lieber Kaffee' = I prefer coffee.","gern → lieber: Ich trinke lieber Kaffee."),
mc("Der Film ist ___. (more interesting)",["mehr interessant","interessanter","am interessant","interessantest"],1,"German never uses 'mehr' here.","Even long adjectives just add -er: interessanter.","Auch lange Adjektive: + er → interessanter."),
mc("Mein Laptop ist so schnell ___ dein Laptop.",["als","wie","so"],1,"as … as","so … wie = as … as.","so … wie = gleich.")
]},

{id:"adjektiv",day:5,title:"Adjective endings (A2 essentials)",de:"Adjektivendungen",
lead:"An adjective **before** a noun gets an ending. After the noun with sein it gets **none**: der große Tisch, but: Der Tisch ist groß.",
en:"<p>English adjectives never change: <i>a big table, the big table, with big tables</i>.</p>",
rule:"<p><b>1. After der/die/das:</b> only -e or -en. -e in the five 'easy' spots (Nom m/f/n, Akk f/n). Everywhere else -en.</p><p><b>2. After ein/kein/mein:</b> where ein has no ending, the adjective shows the gender: ein gut<b>er</b> Mann, ein gut<b>es</b> Kind. Otherwise -e or -en like rule 1.</p><p><b>3. No article:</b> the adjective takes the der-word ending: gut<b>er</b> Kaffee, frisch<b>e</b> Milch, kalt<b>es</b> Wasser.</p><p><b>Shortcut:</b> Dativ and plural with an article → almost always <b>-en</b>.</p>",
changes:"<p>The ending's job is to show gender and case if the article can't. 'ein' doesn't tell you if it's masculine or neuter, so the adjective does: ein neu<b>er</b> Laptop (der), ein neu<b>es</b> Handy (das).</p>",
formula:"der gute Mann   · ein guter Mann  · den guten Mann · mit dem guten Mann\ndie gute Frau   · eine gute Frau · mit einer guten Frau\ndas gute Kind   · ein gutes Kind · mit einem guten Kind",
grids:[{title:"After der / die / das",head:["","m","f","n","pl"],rows:[["Nom","der gut<b>e</b>","die gut<b>e</b>","das gut<b>e</b>","die gut<b>en</b>"],["Akk","den gut<b>en</b>","die gut<b>e</b>","das gut<b>e</b>","die gut<b>en</b>"],["Dat","dem gut<b>en</b>","der gut<b>en</b>","dem gut<b>en</b>","den gut<b>en</b>"]]},{title:"After ein / kein / mein",head:["","m","f","n","pl (kein)"],rows:[["Nom","ein gut<b>er</b>","eine gut<b>e</b>","ein gut<b>es</b>","keine gut<b>en</b>"],["Akk","einen gut<b>en</b>","eine gut<b>e</b>","ein gut<b>es</b>","keine gut<b>en</b>"],["Dat","einem gut<b>en</b>","einer gut<b>en</b>","einem gut<b>en</b>","keinen gut<b>en</b>"]]}],
ex:[["The table is big.","Der Tisch ist groß.","no ending after sein"],["the big table","{m|der große Tisch}"],["a big table","{m|ein großer Tisch}"],["I need a new laptop.","Ich brauche {m|einen neuen Laptop}."],["I have a small apartment.","Ich habe {f|eine kleine Wohnung}."],["with my old friend","mit {m|meinem alten Freund}"],["fresh bread","{n|frisches Brot}","no article"],["Have a nice weekend!","{n|Schönes Wochenende}!"]],
mist:[["ein gut Mann","ein guter Mann","ein gives no gender, the adjective must."],["Ich brauche ein neuen Laptop.","Ich brauche einen neuen Laptop.","Akk masculine: einen."],["mit einem gutem Freund","mit einem guten Freund","Dativ with article → -en."],["Der Tisch ist großer.","Der Tisch ist groß.","No ending after sein."]],
q:[
mc("Das ist ein ___ Auto. (neu)",["neue","neuer","neues","neuen"],2,"das Auto. 'ein' doesn't show it's neuter, so the adjective must.","Neuter after ein: -es. ein neues Auto.","Neutral nach 'ein': -es → ein neues Auto."),
mc("Ich habe einen ___ Chef. (nett)",["nette","netter","netten","nettes"],2,"'einen' already shows masculine Akkusativ.","Akkusativ masculine after einen: -en. einen netten Chef.","Akkusativ maskulin: einen netten Chef."),
mc("Der ___ Kaffee schmeckt gut. (frisch)",["frische","frischer","frischen"],0,"After 'der' in Nominativ: one of the easy spots.","After der/die/das in Nominativ: -e. der frische Kaffee.","Nach 'der' im Nominativ: -e."),
mc("Ich wohne in einer ___ Wohnung. (klein)",["kleine","kleinen","kleiner","kleines"],1,"Location (wo?) → Dativ. Shortcut for Dativ?","Dativ with article → -en: in einer kleinen Wohnung.","Dativ → -en: in einer kleinen Wohnung."),
mc("Die Wohnung ist ___. (klein)",["klein","kleine","kleiner","kleinen"],0,"Is the adjective before a noun?","After sein, no ending: klein.","Nach 'sein' hat das Adjektiv keine Endung."),
mc("Ich trinke gern ___ Wasser. (kalt, no article)",["kalt","kalte","kaltes","kalten"],2,"No article, so the adjective takes the ending of 'das'.","No article → adjective shows the gender like das: kaltes Wasser.","Kein Artikel → das Adjektiv zeigt das Genus: kaltes Wasser.")
]},

{id:"zukunft",day:5,title:"Future and zu + infinitive",de:"Futur und zu + Infinitiv",
lead:"Two A2 tools for plans. **Future:** everyday German mostly uses present tense + a time word. **zu + infinitive:** after verbs like versuchen, vergessen, anfangen, vorhaben, Lust haben, Zeit haben.",
en:"<p>English: <i>I'm going to visit / I will visit my parents tomorrow.</i></p><p>English 'to + verb': <i>I'm trying <b>to</b> learn</i>. After 'can/must' there's no 'to'.</p>",
rule:"<p><b>Present for future:</b> Morgen <b>besuche</b> ich meine Eltern.</p><p><b>werden + infinitive</b> for predictions, promises, or when no time word is clear: Es <b>wird</b> morgen <b>regnen</b>.</p><p><b>zu + infinitive</b> at the end, after a comma: Ich versuche, Deutsch <b>zu lernen</b>. Separable: an<b>zu</b>rufen.</p><p><b>um … zu</b> = in order to: Ich spare, <b>um</b> ein Auto <b>zu</b> kaufen.</p>",
changes:"<p>English 'will' ≠ German 'will' (wollen = want).</p><p>'werden' alone means 'become': Er wird 40 = He's turning 40.</p><p>No zu after modals: Ich möchte Deutsch lernen (like English 'I can swim').</p>",
formula:"werden (pos. 2) + … + infinitive\nverb, … zu + infinitive\num … zu + infinitive",
grids:[{title:"werden",head:["ich","du","er/sie/es","wir","ihr","sie/Sie"],rows:[["werde","wirst","wird","werden","werdet","werden"]]}],
ex:[["I'm working tomorrow.","Morgen {v|arbeite} ich."],["It will rain tomorrow.","Morgen {v|wird} es {v|regnen}."],["I will call you, promised.","Ich {v|werde} dich {v|anrufen}, versprochen."],["I'm trying to learn German.","Ich versuche, Deutsch zu lernen."],["I plan to go to Berlin.","Ich habe vor, nach Berlin zu fahren."],["I forgot to call you.","Ich habe vergessen, dich anzurufen."],["Do you feel like going to the cinema?","Hast du Lust, ins Kino zu gehen?"],["I'm learning German in order to work here.","Ich lerne Deutsch, um hier zu arbeiten."],["I'd like to learn German. (no zu)","Ich möchte Deutsch lernen."]],
mist:[["Ich will morgen arbeiten. (meaning future)","Morgen arbeite ich. / Ich werde morgen arbeiten.","will = want."],["Ich möchte Deutsch zu lernen.","Ich möchte Deutsch lernen.","No zu after modals."],["Ich versuche zu Deutsch lernen.","Ich versuche, Deutsch zu lernen.","zu sits directly before the verb."],["zu anrufen","anzurufen","Separable: zu in the middle."]],
q:[
mc("Most natural: <i>I'm meeting Anna tomorrow.</i>",["Ich will morgen Anna treffen.","Morgen treffe ich Anna.","Morgen ich treffe Anna.","Ich treffen Anna morgen."],1,"Everyday German uses present tense with a time word.","Present + time word is the normal future. 'Ich werde Anna morgen treffen' is also correct, just heavier.","Im Alltag: Präsens + Zeitangabe. Morgen treffe ich Anna."),
mc("Ich habe keine Zeit, ___.",["heute zu kochen","zu heute kochen","heute kochen zu","heute kochen"],0,"zu sits directly before the infinitive at the end.","'Zeit haben' + zu-infinitive: heute zu kochen.","'zu' steht direkt vor dem Infinitiv: heute zu kochen."),
mc("Ich kann heute ___.",["kommen","zu kommen","komme"],0,"After a modal: zu or no zu?","Modals never take zu: Ich kann kommen.","Nach Modalverben: kein 'zu'."),
mc("Hast du Lust, ___? (mitkommen)",["zu mitkommen","mitzukommen","mitkommen zu","mitzukommen zu"],1,"Separable verb + zu.","zu goes between the prefix and the verb: mitzukommen.","Trennbar: 'zu' in der Mitte → mitzukommen."),
mc("Er ___ nächstes Jahr 40.",["wird","werdet","will","wirst"],0,"werden = become. er form?","er wird = he becomes / turns.","er wird 40 = he turns 40."),
mc("Ich spare Geld, ___ ein Auto zu kaufen.",["um","für","damit","zu"],0,"'in order to' + zu-infinitive.","um … zu = in order to.","um … zu = in order to.")
]},

/* ===== DAY 6 ===== */
{id:"imperativ",day:6,title:"Commands and polite requests",de:"Imperativ",
lead:"You hear commands everywhere: 'Bitte einsteigen', 'Halten Sie Abstand'. There are three forms: du, ihr, Sie. Add bitte, mal or doch to soften them.",
en:"<p>English has one form for everyone: <i>Come! Wait! Call me!</i></p>",
rule:"<p><b>du:</b> take the du-form, drop -st and du: du kommst → <b>Komm!</b> · du nimmst → <b>Nimm!</b> · du isst → <b>Iss!</b></p><p>a → ä verbs lose the umlaut: du fährst → <b>Fahr!</b></p><p><b>ihr:</b> ihr-form without ihr: <b>Kommt!</b></p><p><b>Sie:</b> verb + Sie: <b>Kommen Sie!</b></p><p>sein: Sei! Seid! Seien Sie!</p><p>Separable: <b>Ruf</b> mich <b>an</b>!</p>",
changes:"<p>The verb comes first and there is no 'please do'. Politeness comes from <b>bitte</b>, <b>mal</b>, <b>doch</b>, or from a question: <b>Könnten Sie …? Würden Sie …?</b> and <b>Ich hätte gern …</b> when ordering.</p>",
formula:"du:   Komm(st)!  →  Komm!\nihr:  Kommt!\nSie:  Kommen Sie!",
ex:[["Come here!","Komm her!"],["Call me later!","Ruf mich später an!"],["Please wait a moment. (formal)","Warten Sie bitte einen Moment."],["Take a seat. (formal)","Nehmen Sie Platz."],["Be quiet! (to kids)","Seid leise!"],["Have a look!","Schau mal!"],["Could you send me the invoice?","Könnten Sie mir die Rechnung schicken?"],["I'd like a pretzel, please.","Ich hätte gern eine Brezel, bitte."]],
mist:[["Kommst!","Komm!","Drop -st."],["Fährst langsam!","Fahr langsam!","No umlaut in the du-imperative."],["Sie warten bitte.","Warten Sie bitte.","Verb first in commands."],["Esse!","Iss!","e → i stays: du isst → Iss!"]],
q:[
mc("To a friend: <i>Take the bus!</i>",["Nimmst den Bus!","Nimm den Bus!","Nehm den Bus!","Nehmen den Bus!"],1,"du nimmst → drop -st.","du nimmst → Nimm! The e → i change stays. ('Nehm' is heard, but standard is Nimm.)","du nimmst → Nimm den Bus!"),
mc("Formal: <i>Please sign here.</i>",["Unterschreib hier, bitte.","Unterschreiben Sie bitte hier.","Sie unterschreiben hier bitte.","Unterschreibt hier."],1,"Formal command: verb + Sie.","Sie-imperative: Unterschreiben Sie bitte hier.","Formell: Verb + Sie: Unterschreiben Sie bitte hier."),
mc("To two friends: <i>Wait!</i>",["Wartet!","Warte!","Warten!","Wartest!"],0,"ihr form without ihr.","ihr wartet → Wartet!","ihr-Form ohne 'ihr': Wartet!"),
mc("To a friend: <i>Call me!</i>",["Anrufe mich!","Ruf mich an!","Rufst mich an!","Ruf an mich!"],1,"Separable verb. Prefix goes to the end.","Ruf (du-imperative) … an (prefix at the end).","Trennbar: Ruf mich an!"),
mc("Most polite at the Bürgeramt:",["Geben Sie mir einen Termin.","Ich will einen Termin.","Könnten Sie mir bitte einen Termin geben?","Gib mir einen Termin."],2,"A question with könnten is softer than a command.","'Könnten Sie … bitte …?' is the polite standard with officials.","Höflich: Könnten Sie mir bitte …?")
]},

{id:"alltag",day:6,title:"Real-life German: du/Sie, Dativ feelings, key phrases",de:"Deutsch im Alltag",
lead:"The grammar you actually meet in Germany: at the doctor, the Bürgeramt, the train, the landlord, at work. Learn these as chunks.",
en:"<p>English uses 'I am …' for many states: <i>I'm cold, I'm bored, my head hurts</i>.</p><p>English 'you' is the same for everyone.</p>",
rule:"<p><b>Sie</b> with strangers, officials, doctors, landlords, customers, older people, and at work unless your team uses du (many startups do).</p><p>Switching: 'Wollen wir uns duzen?' / 'Sag ruhig du.'</p><p><b>Dativ for states:</b> Mir ist kalt. Mir ist langweilig. Mir geht es gut. Mir tut der Kopf weh. Es tut mir leid.</p><p><b>es gibt</b> + Akkusativ = there is / are.</p>",
changes:"<p>'Ich bin langweilig' means 'I am boring'. Bored = Mir ist langweilig.</p><p>Some English-style phrases are understood but sound translated. See the naturalness check below.</p>",
formula:"Mir ist + kalt / warm / schlecht / langweilig\nMir tut + der Kopf / der Hals / der Rücken + weh\nEs gibt + Akkusativ",
ex:[["Excuse me, where can I find the milk?","Entschuldigung, wo finde ich die Milch?"],["I'd like two rolls, please.","Ich hätte gern zwei Brötchen, bitte."],["We'd like to pay. Together or separately?","Wir möchten bitte zahlen. Zusammen oder getrennt?"],["I have a headache and a fever.","Ich habe Kopfschmerzen und Fieber."],["My throat hurts.","Mir tut der Hals weh.","Dativ"],["I'd like to register my address.","Ich möchte meinen Wohnsitz anmelden.","Bürgeramt"],["Does this train stop in Hannover?","Hält dieser Zug in Hannover?"],["The train is 20 minutes late.","Der Zug hat 20 Minuten Verspätung."],["The heating isn't working.","Die Heizung funktioniert nicht.","to the landlord"],["Does Thursday work for you?","Passt es Ihnen am Donnerstag?"],["Could you repeat that, please?","Könnten Sie das bitte wiederholen?"],["I didn't quite understand that.","Das habe ich nicht ganz verstanden."],["In my opinion … / I think that …","Meiner Meinung nach … / Ich finde, dass …"],["That's right. / I see it differently.","Das stimmt. / Das sehe ich anders."],["It depends.","Das kommt darauf an."]],
natural:[["Ich bin hungrig.","Ich habe Hunger.","Correct, but bookish."],["Das passt für mich.","Das passt mir. / Das passt gut.","Understood, sounds translated."],["Ich habe keine Idee.","Ich habe keine Ahnung.","'Idee' is a plan or concept, not knowledge."],["Wie geht es Ihnen? (with a friend)","Wie geht's?","Correct but too formal for friends."],["Das macht Sinn.","Das ergibt Sinn. / Das macht Sinn.","Very common now; 'ergibt' is the traditional form."],["Ich bin fertig mit Arbeit.","Ich bin mit der Arbeit fertig.","Needs the article."]],
mist:[["Ich bin langweilig.","Mir ist langweilig.","'Ich bin langweilig' = I am boring."],["Ich habe Kopf weh.","Ich habe Kopfschmerzen. / Mir tut der Kopf weh.","Two correct patterns."],["Der Zug ist 10 Minuten spät.","Der Zug hat 10 Minuten Verspätung.","Trains 'have' delay."]],
q:[
mc("At the doctor: <i>My stomach hurts.</i>",["Ich bin Bauch weh.","Mir tut der Bauch weh.","Ich tue Bauch weh.","Mein Bauch ist weh."],1,"weh tun takes the person in Dativ.","Mir (Dativ) tut der Bauch weh. Also correct: Ich habe Bauchschmerzen.","Mir tut der Bauch weh. Oder: Ich habe Bauchschmerzen."),
mc("Greeting your older new neighbour:",["Hallo, wie geht's dir?","Guten Tag, wie geht es Ihnen?","Hey, was geht?","Tag, wie geht es dich?"],1,"Neighbour you don't know, older: du or Sie?","Older stranger → Sie: Wie geht es Ihnen?","Mit älteren, unbekannten Personen: Sie. Wie geht es Ihnen?"),
mc("<i>I'm bored.</i>",["Ich bin langweilig.","Mir ist langweilig.","Ich habe langweilig.","Mich ist langweilig."],1,"Feelings like this use Dativ.","Mir ist langweilig. 'Ich bin langweilig' = I am a boring person.","Mir ist langweilig. ('Ich bin langweilig' = Ich bin eine langweilige Person.)"),
mc("<i>There is a problem with my invoice.</i>",["Es ist ein Problem mit meiner Rechnung.","Es gibt ein Problem mit meiner Rechnung.","Da hat ein Problem mit meine Rechnung."],1,"'There is' in German.","there is = es gibt. mit + Dativ: meiner Rechnung.","'there is' = es gibt. mit + Dativ: meiner Rechnung."),
mc("Most natural: <i>I have no idea.</i>",["Ich habe keine Idee.","Ich habe keine Ahnung.","Ich weiß keine Idee."],1,"'Idee' in German is a plan or suggestion.","Ich habe keine Ahnung = I have no idea. 'keine Idee' means you have no plan or suggestion.","Man sagt: Ich habe keine Ahnung. ('keine Idee' = kein Vorschlag.)"),

  ["🤒 🏠","Ich bleibe zu Hause, weil ich krank bin.","Ich bleibe zu Hause, weil ich bin krank.","Ich bleibe nach Hause, weil ich krank bin.","I'm staying home because I'm sick.","weil sends the verb to the end. Being at home = zu Hause.","Nach 'weil' steht das Verb am Ende. Ort: zu Hause."],
  ["💐 👩","Ich schenke meiner Mutter Blumen.","Ich schenke meine Mutter Blumen.","Ich schenke meinem Mutter Blumen.","I'm giving my mother flowers.","The receiver is Dativ. die Mutter → meiner Mutter.","Wem? meiner Mutter (Dativ feminin)."],
  ["📚 🛋️","Das Buch liegt auf dem Sofa.","Das Buch liegt auf das Sofa.","Das Buch liegt auf den Sofa.","The book is on the sofa.","liegen = location (wo?) → Dativ: auf dem Sofa.","Wo? → Dativ: auf dem Sofa."],
  ["🪥 😁","Er putzt sich die Zähne.","Er putzt ihm die Zähne.","Er putzt sich die Zahn.","He's brushing his teeth.","Reflexive: his own teeth → sich. 'ihm' would be someone else's teeth. Plural: Zähne.","Reflexiv: sich. Plural: die Zähne."],
  ["🌧️ 🏃","Es regnet. Trotzdem gehe ich joggen.","Es regnet. Trotzdem ich gehe joggen.","Es regnet. Obwohl gehe ich joggen.","It's raining. I'm going jogging anyway.","trotzdem takes position 1, so the verb comes right after it.","'Trotzdem' steht auf Position 1, dann das Verb."]
 ],
 reading:[
  {title:"Krankmeldung",de:"Eine E-Mail an die Chefin",s:[["Liebe Frau Weber,","Dear Ms Weber,"],["leider kann ich heute nicht ins Büro kommen.","unfortunately I can't come to the office today."],["Ich bin krank und habe Fieber.","I'm sick and have a fever."],["Gestern Abend hatte ich auch starke Kopfschmerzen.","Last night I also had a bad headache."],["Heute Morgen war ich beim Arzt.","This morning I was at the doctor's."],["Er hat mich für drei Tage krankgeschrieben.","He has signed me off sick for three days."],["Die Krankmeldung schicke ich Ihnen per E-Mail.","I'll send you the sick note by email."],["Mein Kollege Herr Schulz übernimmt meine Termine.","My colleague Mr Schulz is taking over my appointments."],["Ich hoffe, dass ich am Donnerstag wieder arbeiten kann.","I hope that I can work again on Thursday."],["Viele Grüße, Ravi Kumar","Best regards, Ravi Kumar"]],
   gloss:[["leider","unfortunately"],["krankschreiben","to sign someone off sick"],["die Krankmeldung","sick note"],["übernehmen","to take over"],["Viele Grüße","Best regards"]],
   q:[mc("Warum schreibt Ravi die E-Mail?",["Er ist krank.","Er hat Urlaub.","Er kommt zu spät."],0,"Sentence 2 and 3.","He's sick and can't come to the office.","Er ist krank."),
      mc("Wie lange ist er krankgeschrieben?",["einen Tag","drei Tage","eine Woche"],1,"'für drei Tage'","Three days.","Für drei Tage."),
      mc("Wer übernimmt seine Termine?",["Frau Weber","der Arzt","Herr Schulz"],2,"'übernimmt'","Herr Schulz, his colleague.","Sein Kollege Herr Schulz."),
      mc("Why 'hatte' and 'war' instead of Perfekt?",["sein/haben usually use Präteritum","it's a formal email","both are wrong"],0,"Think of the Präteritum topic.","sein and haben normally use the simple past: war, hatte. Also in speech.","sein und haben benutzt man meistens im Präteritum: war, hatte.")]},
  {title:"Die neue Wohnung",de:"Umzug nach Hannover",s:[["Seit zwei Wochen wohnen wir in einer neuen Wohnung in Hannover.","For two weeks we've been living in a new apartment in Hannover."],["Die Wohnung ist größer als die alte und hat einen Balkon.","The apartment is bigger than the old one and has a balcony."],["Leider funktioniert die Heizung nicht richtig.","Unfortunately the heating isn't working properly."],["Deshalb habe ich gestern den Vermieter angerufen.","So I called the landlord yesterday."],["Er hat gesagt, dass morgen ein Techniker kommt.","He said that a technician is coming tomorrow."],["Unsere Nachbarn sind sehr nett.","Our neighbours are very nice."],["Frau Becker von unten hat uns gestern einen Kuchen gebracht.","Mrs Becker from downstairs brought us a cake yesterday."],["Am Wochenende wollen wir eine kleine Party machen.","At the weekend we want to have a small party."],["Wir laden auch die Nachbarn ein.","We're inviting the neighbours too."]],
   gloss:[["seit","since / for (still ongoing)"],["der Vermieter","landlord"],["funktionieren","to work (machines)"],["einladen","to invite"]],
   q:[mc("Seit wann wohnen sie in der Wohnung?",["seit zwei Jahren","seit zwei Wochen","seit gestern"],1,"First sentence.","seit zwei Wochen = for two weeks.","Seit zwei Wochen."),
      mc("Was ist das Problem?",["die Heizung","der Balkon","die Nachbarn"],0,"'Leider …'","Die Heizung funktioniert nicht richtig.","Die Heizung funktioniert nicht."),
      mc("Why 'Deshalb habe ich' and not 'Deshalb ich habe'?",["deshalb takes position 1","deshalb sends the verb to the end","both are correct"],0,"Connectors topic.","deshalb is position 1, so the verb follows immediately.","'Deshalb' ist Position 1, dann kommt das Verb."),
      mc("Was hat Frau Becker gebracht?",["Blumen","einen Kuchen","Wein"],1,"Sentence 7.","einen Kuchen.","Einen Kuchen.")]}
 ],
 listening:[
  {title:"Im Büro",de:"Unter Kollegen",who:{A:"Sara",B:"Jonas"},l:[["A","Hey Jonas, hast du kurz Zeit?","Hey Jonas, do you have a moment?"],["B","Klar, worum geht's?","Sure, what's it about?"],["A","Ich habe die Zahlen für den Bericht noch nicht bekommen.","I haven't received the numbers for the report yet."],["B","Oh, sorry. Ich musste gestern früher gehen, weil mein Sohn krank war.","Oh, sorry. I had to leave early yesterday because my son was sick."],["A","Kein Problem. Kannst du sie mir bis heute Nachmittag schicken?","No problem. Can you send them to me by this afternoon?"],["B","Ja, ich schicke sie dir bis drei Uhr.","Yes, I'll send them to you by three."],["A","Super. Das Meeting mit dem Chef ist nämlich morgen um neun.","Great. Because the meeting with the boss is tomorrow at nine."],["B","Alles klar. Soll ich auch die Präsentation vorbereiten?","Alright. Should I prepare the presentation too?"],["A","Das wäre toll, danke!","That would be great, thanks!"]],
   q:[mc("Warum musste Jonas früher gehen?",["Er war krank.","Sein Sohn war krank.","Er hatte einen Termin."],1,"Listen for 'weil'.","weil mein Sohn krank war.","Sein Sohn war krank."),
      mc("Bis wann schickt Jonas die Zahlen?",["bis 9 Uhr","bis 15 Uhr","bis morgen"],1,"'bis drei Uhr'","By three o'clock (15:00).","Bis drei Uhr."),
      mc("Wann ist das Meeting?",["heute um 3","morgen um 9","morgen um 3"],1,"'morgen um neun'","Tomorrow at nine.","Morgen um neun.")]},
  {title:"Die Heizung ist kaputt",de:"Anruf bei der Hausverwaltung",who:{A:"Hausverwaltung",B:"Mieter"},l:[["A","Hausverwaltung Schmidt, guten Tag.","Schmidt property management, hello."],["B","Guten Tag, hier ist Kumar aus der Lindenstraße 12. Ich habe ein Problem.","Hello, this is Kumar from Lindenstraße 12. I have a problem."],["A","Was ist denn passiert?","What happened?"],["B","Seit gestern funktioniert die Heizung nicht mehr. In der Wohnung ist es sehr kalt.","Since yesterday the heating hasn't been working. It's very cold in the apartment."],["A","Oh, das tut mir leid. Haben Sie schon die Nachbarn gefragt?","Oh, I'm sorry. Have you asked the neighbours already?"],["B","Ja, bei den Nachbarn funktioniert sie auch nicht.","Yes, it's not working at the neighbours' either."],["A","Dann schicke ich Ihnen morgen früh einen Techniker.","Then I'll send you a technician tomorrow morning."],["B","Um wie viel Uhr kommt er ungefähr?","Roughly what time will he come?"],["A","Zwischen acht und zwölf Uhr. Sind Sie zu Hause?","Between eight and twelve. Will you be at home?"],["B","Ja, ich arbeite morgen im Homeoffice. Vielen Dank!","Yes, I'm working from home tomorrow. Thanks a lot!"]],
   q:[mc("Seit wann ist die Heizung kaputt?",["seit heute","seit gestern","seit einer Woche"],1,"'Seit …'","Seit gestern.","Seit gestern."),
      mc("Wann kommt der Techniker?",["heute Abend","morgen zwischen 8 und 12","morgen Nachmittag"],1,"'Zwischen …'","Tomorrow morning, between 8 and 12.","Morgen zwischen acht und zwölf Uhr."),
      mc("Warum ist Herr Kumar morgen zu Hause?",["Er ist krank.","Er arbeitet im Homeoffice.","Er hat Urlaub."],1,"Last line.","He's working from home.","Er arbeitet im Homeoffice.")]}
 ],
 speaking:[
  {title:"Call in sick",ai:"your manager Frau Weber, answering the phone at 8:30 in the morning",reg:"Sie",goal:["Say that you're sick and what you have","Say you were / will go to the doctor","Explain who can take over your work"],opener:["Weber, guten Morgen.","Weber speaking, good morning."],phrases:[["Leider kann ich heute nicht kommen.","Unfortunately I can't come today."],["Ich habe Fieber / Kopfschmerzen.","I have a fever / headache."],["Ich gehe heute zum Arzt.","I'm going to the doctor today."],["Ich schicke Ihnen die Krankmeldung.","I'll send you the sick note."],["… kann meine Termine übernehmen.","… can take over my appointments."]]},

{id:"a2-2",name:"A2.2",title:"Opinions and plans",de:"Meinungen und Pläne",
 blurb:"Subordinate clauses, comparing, adjective endings, future and zu-infinitive, Genitiv, real-life German.",
 topics:["nebensatz","vergleich","adjektiv","zukunft","genitiv","alltag"],
 vocab:[["☀️","die","Sonne","–","sun"],["🌧️","der","Regen","–","rain"],["❄️","der","Schnee","–","snow"],["💨","der","Wind","die Winde","wind"],["⛈️","das","Gewitter","die Gewitter","thunderstorm"],["🌳","der","Baum","die Bäume","tree"],["🌸","die","Blume","die Blumen","flower"],["🏔️","der","Berg","die Berge","mountain"],["🌊","das","Meer","die Meere","sea"],["🏖️","der","Strand","die Strände","beach"],["🏰","das","Schloss","die Schlösser","castle"],["🎁","das","Geschenk","die Geschenke","present"],["🎂","die","Torte","die Torten","(cream) cake"],["🍷","der","Wein","die Weine","wine"],["🎸","die","Gitarre","die Gitarren","guitar"],["⚽","der","Fußball","die Fußbälle","football"],["🎬","der","Film","die Filme","film"],["📸","das","Foto","die Fotos","photo"],["🌍","die","Welt","–","world"],["🗺️","die","Landkarte","die Landkarten","map"]],
 scenes:[
  ["🐘 🐭","Der Elefant ist größer als die Maus.","Der Elefant ist größer wie die Maus.","Der Elefant ist mehr groß als die Maus.","The elephant is bigger than the mouse.","than = als. groß → größer, never 'mehr groß'.","'als' nach dem Komparativ. groß → größer."],
  ["🚗 ✨","Ich habe ein neues Auto.","Ich habe ein neuer Auto.","Ich habe ein neue Auto.","I have a new car.","das Auto after 'ein': the adjective shows the gender with -es.","Neutral nach 'ein': ein neues Auto."],
  ["☀️ ➡️ 🏖️","Wenn die Sonne scheint, gehen wir an den Strand.","Wenn die Sonne scheint, wir gehen an den Strand.","Wenn scheint die Sonne, gehen wir an den Strand.","If the sun shines, we'll go to the beach.","wenn-clause: verb at its end. Then the main verb comes right after the comma.","Nebensatz zuerst: Verb, Komma, Verb."],
  ["🌧️ morgen","Morgen wird es regnen.","Morgen es wird regnen.","Morgen wird es regnet.","It will rain tomorrow.","werden in position 2, infinitive at the end.","werden auf Position 2, Infinitiv am Ende."],
  ["🧳 ✈️ 🇮🇳","Ich habe vor, nach Indien zu fliegen.","Ich habe vor, nach Indien fliegen zu.","Ich habe vor, zu nach Indien fliegen.","I'm planning to fly to India.","zu sits directly before the infinitive at the end.","'zu' steht direkt vor dem Infinitiv."]
 ],
 reading:[
  {title:"Streik bei der Bahn",de:"Eine Nachricht",s:[["Wegen eines Streiks fahren am Montag viele Züge nicht.","Because of a strike, many trains won't run on Monday."],["Die Deutsche Bahn empfiehlt, die Reise zu verschieben.","Deutsche Bahn recommends postponing the trip."],["Wer schon ein Ticket gekauft hat, kann es später benutzen.","Anyone who has already bought a ticket can use it later."],["Fahrgäste, die unbedingt fahren müssen, sollten früh am Bahnhof sein.","Passengers who absolutely have to travel should be at the station early."],["Die S-Bahn in Berlin fährt nur alle zwanzig Minuten.","The S-Bahn in Berlin is only running every twenty minutes."],["Weitere Informationen gibt es in der App und auf der Website.","More information is available in the app and on the website."]],
   gloss:[["der Streik","strike"],["empfehlen","to recommend"],["verschieben","to postpone"],["unbedingt","absolutely"],["alle 20 Minuten","every 20 minutes"]],
   q:[mc("Warum fahren viele Züge nicht?",["wegen des Wetters","wegen eines Streiks","wegen Bauarbeiten"],1,"First words.","Wegen eines Streiks = because of a strike (Genitiv).","Wegen eines Streiks."),
      mc("Was empfiehlt die Bahn?",["früher zu fahren","die Reise zu verschieben","ein neues Ticket zu kaufen"],1,"'empfiehlt, … zu …'","To postpone the trip.","Die Reise zu verschieben."),
      mc("Kann man das Ticket später benutzen?",["Ja","Nein"],0,"Sentence 3.","Yes, you can use it later.","Ja, man kann es später benutzen."),
      mc("Wie oft fährt die S-Bahn?",["alle 10 Minuten","alle 20 Minuten","gar nicht"],1,"'alle zwanzig Minuten'","Every 20 minutes.","Alle zwanzig Minuten.")]},
  {title:"Homeoffice: ja oder nein?",de:"Ein Meinungstext",s:[["Seit der Pandemie arbeiten viele Menschen in Deutschland im Homeoffice.","Since the pandemic, many people in Germany work from home."],["Meiner Meinung nach hat das Vor- und Nachteile.","In my opinion that has advantages and disadvantages."],["Ein großer Vorteil ist, dass man keine Zeit im Verkehr verliert.","A big advantage is that you don't lose time in traffic."],["Außerdem kann man sich die Zeit besser einteilen.","Also, you can organise your time better."],["Aber man sieht seine Kollegen seltener.","But you see your colleagues less often."],["Manche Menschen fühlen sich zu Hause allein.","Some people feel lonely at home."],["Ich finde, dass zwei oder drei Tage im Büro die beste Lösung sind.","I think that two or three days in the office is the best solution."],["Was denken Sie?","What do you think?"]],
   gloss:[["der Vorteil / der Nachteil","advantage / disadvantage"],["der Verkehr","traffic"],["einteilen","to divide up, organise"],["seltener","less often (comparative of selten)"],["die Lösung","solution"]],
   q:[mc("Was ist ein Vorteil vom Homeoffice?",["Man sieht die Kollegen öfter.","Man verliert keine Zeit im Verkehr.","Man fühlt sich allein."],1,"'Ein großer Vorteil ist, dass …'","No time lost in traffic.","Man verliert keine Zeit im Verkehr."),
      mc("Was ist ein Nachteil?",["Man sieht die Kollegen seltener.","Man hat mehr Zeit.","Das Büro ist teuer."],0,"'Aber …'","You see colleagues less often.","Man sieht die Kollegen seltener."),
      mc("Was ist die Meinung des Autors?",["nur Homeoffice","nur Büro","2 bis 3 Tage im Büro"],2,"'Ich finde, dass …'","Two or three days in the office.","Zwei oder drei Tage im Büro sind die beste Lösung."),
      mc("Why is 'sind' at the end of sentence 7?",["after 'dass' the verb goes to the end","because it's plural","it's a question"],0,"Subordinate clauses.","dass sends the conjugated verb to the end.","Nach 'dass' steht das Verb am Ende.")]}
 ],
 listening:[
  {title:"Durchsage am Bahnhof",de:"Verspätung",who:{A:"Durchsage",B:"Mira",C:"Tom"},l:[["A","Sehr geehrte Fahrgäste, wegen einer Störung hat der ICE nach München etwa fünfundzwanzig Minuten Verspätung.","Dear passengers, due to a fault the ICE to Munich is about twenty-five minutes late."],["A","Der Zug fährt heute von Gleis zwölf statt von Gleis neun.","Today the train leaves from platform 12 instead of platform 9."],["A","Wir bitten um Entschuldigung.","We apologise."],["B","Na super. Dann verpasse ich in Nürnberg meinen Anschluss.","Oh great. Then I'll miss my connection in Nuremberg."],["C","Frag doch mal am Infoschalter. Vielleicht kannst du einen späteren Zug nehmen.","Why don't you ask at the information desk. Maybe you can take a later train."],["B","Gute Idee. Wenn ich zu spät komme, rufe ich meine Chefin an.","Good idea. If I arrive late, I'll call my boss."]],
   q:[mc("Wie viel Verspätung hat der ICE?",["15 Minuten","25 Minuten","35 Minuten"],1,"'fünfundzwanzig'","25 minutes (German says five-and-twenty).","Fünfundzwanzig Minuten."),
      mc("Von welchem Gleis fährt der Zug heute?",["Gleis 9","Gleis 12","Gleis 21"],1,"'statt von Gleis neun'","From platform 12 instead of 9.","Von Gleis zwölf."),
      mc("Was ist Miras Problem?",["Sie hat kein Ticket.","Sie verpasst ihren Anschluss.","Sie hat ihre Tasche vergessen."],1,"'verpasse … Anschluss'","She'll miss her connection in Nuremberg.","Sie verpasst ihren Anschluss in Nürnberg.")]},
  {title:"Pläne fürs Wochenende",de:"Unter Freunden",who:{A:"Lea",B:"Sam"},l:[["A","Was machen wir am Samstag? Hast du Lust, wandern zu gehen?","What shall we do on Saturday? Do you feel like going hiking?"],["B","Eigentlich schon, aber laut Wetterbericht soll es regnen.","Actually yes, but according to the forecast it's supposed to rain."],["A","Schade. Dann könnten wir ins Museum gehen.","Shame. Then we could go to the museum."],["B","Museum finde ich ein bisschen langweilig. Wie wäre es mit Kino?","I find museums a bit boring. How about the cinema?"],["A","Kino ist okay, aber das ist teurer als das Museum.","Cinema is OK, but it's more expensive than the museum."],["B","Stimmt. Dann lass uns zuerst ins Museum und danach etwas essen gehen.","True. Then let's go to the museum first and get something to eat afterwards."],["A","Das klingt gut! Ich reserviere einen Tisch beim Italiener.","Sounds good! I'll book a table at the Italian place."],["B","Perfekt. Treffen wir uns um zwei vor dem Museum?","Perfect. Shall we meet at two in front of the museum?"],["A","Abgemacht!","Deal!"]],
   q:[mc("Warum gehen sie nicht wandern?",["Es soll regnen.","Sam ist müde.","Es ist zu teuer."],0,"'laut Wetterbericht'","The forecast says rain.","Es soll regnen."),
      mc("Was findet Sam langweilig?",["Kino","Museum","Wandern"],1,"'… finde ich langweilig'","He finds museums boring, but agrees in the end.","Sam findet das Museum langweilig."),
      mc("Wann und wo treffen sie sich?",["um 2 vor dem Museum","um 2 beim Italiener","um 12 vor dem Kino"],0,"Last question.","At two in front of the museum.","Um zwei vor dem Museum.")]}
 ],
 speaking:[
  {title:"Make weekend plans",ai:"Lea, a friend who wants to plan Saturday with you; she has her own opinions",reg:"du",goal:["Suggest two activities","Give an opinion with 'Ich finde, dass …' or 'Meiner Meinung nach …'","Agree on a time and place"],opener:["Hey! Hast du am Samstag schon was vor? Wir könnten was zusammen machen.","Hey! Do you have plans on Saturday? We could do something together."],phrases:[["Hast du Lust, … zu …?","Do you feel like …?"],["Wie wäre es mit …?","How about …?"],["Ich finde, dass …","I think that …"],["Das ist mir zu teuer / zu weit.","That's too expensive / too far for me."],["Treffen wir uns um … vor …?","Shall we meet at … in front of …?"]]},

  {title:"Discuss: home office or office?",ai:"Jonas, a colleague who prefers working in the office and likes a friendly debate",reg:"du",goal:["Give your opinion with a reason","Name an advantage and a disadvantage","React to his argument (Das stimmt, aber … / Das sehe ich anders.)"],opener:["Ich finde ja, dass alle wieder jeden Tag ins Büro kommen sollten. Was meinst du?","I actually think everyone should come back to the office every day. What do you think?"],phrases:[["Meiner Meinung nach …","In my opinion …"],["Ein Vorteil / Nachteil ist, dass …","An advantage / disadvantage is that …"],["Das stimmt, aber …","That's true, but …"],["Das sehe ich anders.","I see it differently."],["Das kommt darauf an.","It depends."]]}
 ]}

 {title:"Meine Wohnung",de:"Wohnen",s:[["Meine Wohnung ist klein, aber schön.","My apartment is small, but nice."],["Sie hat zwei Zimmer, eine Küche und ein Bad.","It has two rooms, a kitchen and a bathroom."],["Das Wohnzimmer ist hell.","The living room is bright."],["Die Küche ist neu.","The kitchen is new."],["Ich habe keinen Balkon. Das finde ich schade.","I don't have a balcony. I think that's a shame."],["Die Miete ist 650 Euro im Monat.","The rent is €650 a month."],["Die Wohnung ist im vierten Stock, und es gibt keinen Aufzug.","The apartment is on the fourth floor, and there's no lift."],["Das ist manchmal anstrengend.","That's sometimes tiring."]],

 {title:"Wo ist die Post?",de:"Nach dem Weg fragen",who:{A:"Tourist",B:"Passantin"},l:[["A","Entschuldigung, wo ist hier die Post?","Excuse me, where is the post office here?"],["B","Die Post? Gehen Sie hier geradeaus und dann die zweite Straße links.","The post office? Go straight ahead here and then take the second street on the left."],["A","Ist das weit?","Is it far?"],["B","Nein, nur fünf Minuten zu Fuß.","No, only five minutes on foot."],["A","Und gibt es dort auch eine Apotheke?","And is there also a pharmacy there?"],["B","Ja, die Apotheke ist direkt neben der Post.","Yes, the pharmacy is right next to the post office."],["A","Vielen Dank!","Thanks a lot!"],["B","Bitte schön!","You're welcome!"]],

 {title:"Hobbys",de:"Freizeit",who:{A:"Mia",B:"Ben"},l:[["A","Was machst du gern in deiner Freizeit?","What do you like doing in your free time?"],["B","Ich spiele gern Fußball. Und am Wochenende koche ich gern.","I like playing football. And at the weekend I like cooking."],["A","Echt? Was kochst du?","Really? What do you cook?"],["B","Meistens Pasta oder Curry. Und du?","Mostly pasta or curry. And you?"],["A","Ich lese viel und ich gehe gern ins Kino.","I read a lot and I like going to the cinema."],["B","Ich gehe auch gern ins Kino! Kommst du am Freitag mit?","I like going to the cinema too! Will you come along on Friday?"],["A","Gern! Um wie viel Uhr?","Sure! What time?"],["B","Um acht. Ich schreibe dir.","At eight. I'll text you."]],

 {title:"Die Hausordnung",de:"Regeln im Haus",s:[["Liebe Mieterinnen und Mieter,","Dear tenants,"],["bitte beachten Sie unsere Hausordnung.","please note our house rules."],["Von 22 bis 6 Uhr ist Ruhezeit.","From 10 pm to 6 am is quiet time."],["In dieser Zeit dürfen Sie keine laute Musik hören.","During this time you may not play loud music."],["Fahrräder dürfen nicht im Treppenhaus stehen.","Bicycles may not be left in the stairwell."],["Bitte bringen Sie den Müll in die richtigen Tonnen.","Please put the rubbish in the correct bins."],["Papier kommt in die blaue Tonne, Plastik in die gelbe.","Paper goes in the blue bin, plastic in the yellow one."],["Vielen Dank! Ihre Hausverwaltung","Many thanks! Your property management"]],

 {title:"Eine Einladung",de:"Geburtstag",s:[["Liebe Freunde,","Dear friends,"],["am Samstag habe ich Geburtstag.","on Saturday it's my birthday."],["Ich mache eine Party und lade euch herzlich ein.","I'm having a party and warmly invite you."],["Die Party fängt um 19 Uhr an.","The party starts at 7 pm."],["Essen und Getränke habe ich schon.","I already have food and drinks."],["Bringt bitte nur gute Laune mit!","Just bring a good mood, please!"],["Bitte sagt mir bis Mittwoch Bescheid.","Please let me know by Wednesday."],["Meine Adresse: Gartenstraße 8, dritter Stock.","My address: Gartenstraße 8, third floor."],["Ich freue mich auf euch! Eure Nina","I'm looking forward to seeing you! Nina"]],

 {title:"Mein erster Arbeitstag",de:"Im Perfekt",s:[["Gestern war mein erster Tag bei einer neuen Firma.","Yesterday was my first day at a new company."],["Ich bin sehr früh aufgestanden.","I got up very early."],["Um halb neun bin ich im Büro angekommen.","At half past eight I arrived at the office."],["Meine Chefin hat mich allen Kollegen vorgestellt.","My boss introduced me to all the colleagues."],["Dann habe ich einen Laptop und ein Handy bekommen.","Then I got a laptop and a phone."],["Am Mittag haben wir zusammen in der Kantine gegessen.","At lunchtime we ate together in the canteen."],["Am Nachmittag habe ich viele E-Mails gelesen.","In the afternoon I read lots of emails."],["Um fünf Uhr bin ich müde, aber zufrieden nach Hause gefahren.","At five I went home tired but happy."]],
  gloss:[["ankommen → angekommen","arrive → arrived (sein)"],["vorstellen → vorgestellt","introduce → introduced"],["bekommen","to get, receive (not 'become'!)"],["zufrieden","satisfied"]],
  q:[mc("Wann ist die Person im Büro angekommen?",["um 8:30","um 9:30","um 7:30"],0,"'halb neun'","halb neun = 8:30.","Um halb neun."),
     mc("Was hat die Person bekommen?",["ein Auto","einen Laptop und ein Handy","Geld"],1,"Sentence 5.","A laptop and a phone. False friend: bekommen = get.","Einen Laptop und ein Handy."),
     mc("Why 'bin … angekommen' but 'habe … gelesen'?",["ankommen = arriving (movement) → sein","ankommen is separable","no reason"],0,"Perfekt with sein.","Movement/arrival takes sein. Reading does not.","Ankommen ist Bewegung → sein.")]}],
listening:[
 {title:"Im Hotel",de:"An der Rezeption",who:{A:"Rezeption",B:"Gast"},l:[["A","Hotel am Park, guten Abend.","Hotel am Park, good evening."],["B","Guten Abend. Ich habe ein Zimmer reserviert. Mein Name ist Patel.","Good evening. I've reserved a room. My name is Patel."],["A","Einen Moment, bitte. Ja, ein Einzelzimmer für zwei Nächte.","One moment, please. Yes, a single room for two nights."],["B","Genau. Ist das Frühstück inklusive?","Exactly. Is breakfast included?"],["A","Ja, das Frühstück gibt es von sieben bis zehn Uhr im Erdgeschoss.","Yes, breakfast is from seven to ten on the ground floor."],["B","Super. Und gibt es WLAN?","Great. And is there Wi-Fi?"],["A","Ja, das Passwort steht auf Ihrer Karte. Sie haben Zimmer 214 im zweiten Stock.","Yes, the password is on your key card. You have room 214 on the second floor."],["B","Danke! Wann muss ich am Sonntag auschecken?","Thanks! When do I have to check out on Sunday?"],["A","Bis elf Uhr, bitte.","By eleven, please."]],

 {title:"Eine Jacke kaufen",de:"Kleidung",who:{A:"Verkäufer",B:"Kundin"},l:[["A","Kann ich Ihnen helfen?","Can I help you?"],["B","Ja, ich suche eine Jacke für den Winter.","Yes, I'm looking for a winter jacket."],["A","Welche Größe haben Sie?","What size are you?"],["B","Größe M, glaube ich.","Size M, I think."],["A","Hier ist eine schwarze Jacke in M. Möchten Sie sie anprobieren?","Here's a black jacket in M. Would you like to try it on?"],["B","Ja, gern. Hm, sie ist ein bisschen zu klein.","Yes, please. Hmm, it's a bit too small."],["A","Dann probieren Sie doch L.","Then try L."],["B","Ja, die passt gut. Was kostet sie?","Yes, that fits well. How much is it?"],["A","Sie kostet 89 Euro, aber heute gibt es 20 Prozent Rabatt.","It's €89, but today there's 20 percent off."],["B","Super, dann nehme ich sie.","Great, then I'll take it."]],

 {title:"Was musst du heute machen?",de:"Modalverben",who:{A:"Paul",B:"Sara"},l:[["A","Sara, was musst du heute noch machen?","Sara, what do you still have to do today?"],["B","Ich muss einkaufen und dann meine Mutter anrufen.","I have to go shopping and then call my mother."],["A","Willst du heute Abend mit ins Kino kommen?","Do you want to come to the cinema tonight?"],["B","Ich möchte gern, aber ich kann nicht. Ich muss morgen früh aufstehen.","I'd like to, but I can't. I have to get up early tomorrow."],["A","Schade! Wann musst du denn aufstehen?","Shame! When do you have to get up?"],["B","Um fünf. Ich fliege morgen nach Wien.","At five. I'm flying to Vienna tomorrow."],["A","Oh, toll! Dann gute Reise!","Oh, great! Have a good trip then!"],["B","Danke! Wir können ja nächste Woche ins Kino gehen.","Thanks! We can go to the cinema next week."]],

 {title:"Beim Hausarzt",de:"Gesundheit",s:[["Letzte Woche hatte ich starke Rückenschmerzen.","Last week I had bad back pain."],["Ich konnte kaum sitzen und nicht gut schlafen.","I could hardly sit and couldn't sleep well."],["Deshalb bin ich am Montag zum Hausarzt gegangen.","So on Monday I went to my GP."],["Im Wartezimmer musste ich fast eine Stunde warten.","I had to wait almost an hour in the waiting room."],["Die Ärztin hat mich untersucht und mir Tabletten verschrieben.","The doctor examined me and prescribed tablets."],["Außerdem hat sie mir Physiotherapie empfohlen.","She also recommended physiotherapy."],["Ich soll mich mehr bewegen und nicht so lange am Schreibtisch sitzen.","I'm supposed to move more and not sit at my desk for so long."],["Jetzt geht es mir schon viel besser.","Now I'm already feeling much better."]],

 {title:"Mülltrennung",de:"Leben in Deutschland",s:[["In Deutschland trennt man den Müll.","In Germany people separate their rubbish."],["Für Papier gibt es die blaue Tonne.","There's the blue bin for paper."],["Plastik und Verpackungen kommen in die gelbe Tonne oder den gelben Sack.","Plastic and packaging go in the yellow bin or the yellow bag."],["Essensreste gehören in die Biotonne, die meistens braun ist.","Food waste belongs in the organic bin, which is usually brown."],["Alles andere kommt in die schwarze oder graue Restmülltonne.","Everything else goes in the black or grey general waste bin."],["Glasflaschen bringt man zum Glascontainer und trennt sie nach Farben.","Glass bottles go to the bottle bank, sorted by colour."],["Für viele Flaschen bekommt man im Supermarkt Pfand zurück.","For many bottles you get a deposit back at the supermarket."],["Am Sonntag sollte man kein Glas einwerfen, weil es zu laut ist.","You shouldn't throw glass in on Sundays because it's too loud."]],
  gloss:[["trennen","to separate"],["die Verpackung","packaging"],["die Essensreste","food leftovers"],["das Pfand","bottle deposit"],["einwerfen","to throw in"]],
  q:[mc("Wohin kommen Essensreste?",["in die gelbe Tonne","in die Biotonne","in die blaue Tonne"],1,"Sentence 4.","The (usually brown) organic bin.","In die Biotonne."),
     mc("Was bekommt man für viele Flaschen zurück?",["Pfand","einen Gutschein","nichts"],0,"Sentence 7.","Pfand = deposit.","Man bekommt Pfand zurück."),

 {title:"Ein Paket abholen",de:"In der Postfiliale",who:{A:"Kunde",B:"Mitarbeiterin"},l:[["A","Guten Tag, ich möchte ein Paket abholen. Hier ist die Benachrichtigungskarte.","Hello, I'd like to pick up a parcel. Here's the delivery notice."],["B","Danke. Haben Sie auch Ihren Ausweis dabei?","Thanks. Do you have your ID with you too?"],["A","Ja, hier bitte.","Yes, here you go."],["B","Einen Moment. Das Paket ist leider nicht für Sie, sondern für Ihre Nachbarin.","One moment. Unfortunately the parcel isn't for you, it's for your neighbour."],["A","Ach so, ja. Frau Lange war nicht zu Hause und hat mich gebeten, es abzuholen.","Oh, right. Mrs Lange wasn't at home and asked me to pick it up."],["B","Dann brauche ich eine Vollmacht von Frau Lange.","Then I need a letter of authorisation from Mrs Lange."],["A","Oh, die habe ich nicht dabei.","Oh, I don't have that with me."],["B","Dann kommen Sie bitte mit der Vollmacht wieder. Wir haben bis 18 Uhr geöffnet.","Then please come back with the authorisation. We're open until 6 pm."]],

 {title:"Im Restaurant reklamieren",de:"Beschwerde",who:{A:"Gast",B:"Kellner"},l:[["A","Entschuldigung, die Suppe ist leider kalt.","Excuse me, the soup is unfortunately cold."],["B","Oh, das tut mir leid. Ich bringe Ihnen sofort eine neue.","Oh, I'm sorry. I'll bring you a new one right away."],["A","Danke. Und ich habe ein Wasser ohne Kohlensäure bestellt, aber das hier hat Kohlensäure.","Thanks. And I ordered still water, but this one is sparkling."],["B","Stimmt, das war mein Fehler. Ich tausche es sofort um.","True, that was my mistake. I'll swap it right away."],["A","Kein Problem.","No problem."],["B","Als Entschuldigung bekommen Sie einen Nachtisch gratis.","As an apology you get a free dessert."],["A","Oh, das ist aber nett. Vielen Dank!","Oh, that's very kind. Thank you!"]],

 {title:"Mein Umzug nach Deutschland",de:"Ein Blogbeitrag",s:[["Als ich vor sechs Jahren nach Deutschland kam, war alles neu für mich.","When I came to Germany six years ago, everything was new to me."],["Das Wetter war viel kälter als in Indien, und im Winter waren die Tage sehr kurz.","The weather was much colder than in India, and in winter the days were very short."],["Am Anfang habe ich kaum etwas verstanden, weil die Leute so schnell gesprochen haben.","At first I understood hardly anything because people spoke so fast."],["Besonders schwierig waren die Briefe vom Amt.","Letters from the authorities were especially difficult."],["Heute finde ich das Leben hier viel einfacher.","Today I find life here much easier."],["Ich habe nette Freunde gefunden und spreche jeden Tag Deutsch.","I've found nice friends and speak German every day."],["Wenn neue Kollegen aus dem Ausland kommen, helfe ich ihnen gern.","When new colleagues come from abroad, I'm happy to help them."],["Mein Tipp: Habt keine Angst vor Fehlern!","My tip: don't be afraid of mistakes!"]],

function cheatHTML(){
 const g=(t,h,r)=>gridHTML({title:t,head:h,rows:r});
 return `<div class="page-h"><p class="eyebrow">Alle Stufen · Grammatik-Landkarte</p><h1>A1 → A2 grammar map</h1><p>Everything on one page. Come back to this whenever a sentence feels wrong.</p></div>
 <div class="cheat">
 <div class="cs"><h3>1 · Sentence structure</h3><p>The conjugated verb is <b>always element 2</b>. One element in position 1. Second verb part goes to the end.</p><p class="mono">Heute | <span class="g-v">habe</span> | ich mit Anna im Café | <span class="g-v">gegessen</span>.</p><p>Middle order: <b>time → reason → manner → place</b> (TeKaMoLo).</p></div>
 <div class="cs"><h3>2 · Present tense endings</h3><p class="mono">ich -e · du -st · er -t · wir -en · ihr -t · sie/Sie -en</p><p>-t/-d stem: du arbeit<b>e</b>st. Vowel change only du/er: fährst, isst, nimmst, siehst.</p></div>
 <div class="cs"><h3>3 · sein / haben</h3>${g("",["","sein","haben"],[["ich","bin","habe"],["du","bist","hast"],["er","ist","hat"],["wir","sind","haben"],["ihr","seid","habt"],["sie","sind","haben"]])}<p>Ich habe Hunger / recht / Angst. <b>Mir ist</b> kalt.</p></div>
 <div class="cs"><h3>4 · Articles by case</h3>${g("",["","m","f","n","pl"],[["Nom","{m|der / ein}","{f|die / eine}","{n|das / ein}","{p|die / –}"],["Akk","{m|den / einen}","{f|die / eine}","{n|das / ein}","{p|die / –}"],["Dat","{m|dem / einem}","{f|der / einer}","{n|dem / einem}","{p|den + n}"],["Gen","{m|des / eines}","{f|der / einer}","{n|des / eines}","{p|der}"]])}<p>Akk: only masculine changes. Dat: -m, -r, -m, -n.</p></div>
 <div class="cs"><h3>5 · Pronouns</h3>${g("",["Nom","Akk","Dat"],[["ich","mich","mir"],["du","dich","dir"],["er","ihn","ihm"],["sie","sie","ihr"],["es","es","ihm"],["wir","uns","uns"],["ihr","euch","euch"],["sie/Sie","sie/Sie","ihnen/Ihnen"]])}</div>
 <div class="cs"><h3>6 · Prepositions</h3><ul><li><b>Akk:</b> durch, für, gegen, ohne, um</li><li><b>Dat:</b> aus, bei, mit, nach, seit, von, zu</li><li><b>Two-way:</b> in, an, auf, über, unter, vor, hinter, neben, zwischen. Wo? → Dat · Wohin? → Akk</li><li>to: zum Arzt · nach Berlin · nach Hause · ins Kino. At home: zu Hause.</li></ul></div>
 <div class="cs"><h3>7 · Modal verbs</h3><p class="mono">kann · muss · will · darf · soll · möchte</p><p>Modal pos. 2, infinitive at the end. ich = er (no ending). <b>must not = nicht dürfen.</b> will = want.</p></div>
 <div class="cs"><h3>8 · Separable verbs</h3><p>Ich <b>rufe</b> dich <b>an</b>. · Ich muss dich <b>anrufen</b>. · Ich habe dich <b>angerufen</b>. · …, weil ich dich <b>anrufe</b>.</p><p>Never separable: be-, ver-, er-, ent-, emp-, ge-, zer-.</p></div>
 <div class="cs"><h3>9 · Perfekt</h3><p class="mono">haben/sein (pos. 2) … Partizip II (end)</p><p><b>sein</b>: movement A→B, change of state, sein, bleiben, passieren.</p><p>ge…t (gemacht) · ge…en (gegessen) · ein<b>ge</b>kauft · no ge: besucht, verstanden, studiert.</p><p>Präteritum in speech: war, hatte, konnte, musste, es gab.</p></div>
 <div class="cs"><h3>10 · Word order in clauses</h3><ul><li>und, aber, oder, denn, sondern → no change</li><li>deshalb, trotzdem, dann → verb right after</li><li>weil, dass, wenn, obwohl, als, ob → verb at end</li></ul><p class="mono">Wenn ich Zeit habe, komme ich.</p><p>wenn (if/whenever) · als (once, past) · ob (whether) · wann (question)</p></div>
 <div class="cs"><h3>11 · Negation</h3><p><b>kein</b> replaces ein / no article: kein Auto, keine Zeit, keinen Bruder.</p><p><b>nicht</b> for the rest, late in the sentence: Ich arbeite heute nicht. Nicht müde. Nicht mein Handy.</p></div>
 <div class="cs"><h3>12 · Adjectives</h3><p>After sein: no ending. Before a noun:</p><p class="mono">der gute Mann · ein guter Mann · ein gutes Kind · eine gute Frau · den/einen guten Mann · mit dem/einem guten Mann</p><p>Dativ or plural with article → -en.</p><p>Compare: -er als · so … wie · am -sten · gut besser am besten · gern lieber am liebsten.</p></div>
 <div class="cs"><h3>13 · Reflexive verbs</h3><p class="mono">mich · dich · sich · uns · euch · sich</p><p>sich freuen auf/über, sich interessieren für, sich treffen, sich fühlen, sich bewerben um. Second object → mir/dir: Ich wasche mir die Hände.</p></div>
 <div class="cs"><h3>14 · Future and zu</h3><p>Morgen arbeite ich. (normal) · Es wird regnen. (prediction)</p><p>Ich versuche, Deutsch <b>zu</b> lernen. · an<b>zu</b>rufen · <b>um</b> … <b>zu</b> = in order to. No zu after modals.</p></div>
 <div class="cs"><h3>15 · Imperative</h3><p>Komm! · Kommt! · Kommen Sie! · Nimm! · Fahr! · Ruf mich an! · Sei/Seid/Seien Sie …</p><p>Polite: Könnten Sie …? · Ich hätte gern …</p></div>
 <div class="cs"><h3>16 · Phrases to survive anything</h3><ul><li>Könnten Sie das bitte wiederholen?</li><li>Können Sie bitte langsamer sprechen?</li><li>Was bedeutet das? · Wie sagt man das auf Deutsch?</li><li>Das habe ich nicht ganz verstanden.</li><li>Meiner Meinung nach … · Ich finde, dass …</li><li>Das kommt darauf an. · Das passt mir gut.</li><li>Ich habe keine Ahnung. · Mir ist kalt. · Es tut mir leid.</li></ul></div>
 <div class="cs"><h3>17 · Next steps toward B1</h3><ul><li>Konjunktiv II: hätte, wäre, würde, könnte</li><li>Relative clauses: der Mann, <b>der</b> … / den … / dem …</li><li>Passive: Das Paket <b>wird</b> geliefert.</li><li>Präteritum of all verbs (for reading)</li><li>Verbs with fixed prepositions: warten auf, denken an, sprechen über</li></ul></div>
 </div>`;
}

function lvl(id){return LEVELS.find(l=>l.id===(id||st.level))}
function topic(id){return T.find(t=>t.id===id)}
function topicLevel(tid){return LEVELS.find(l=>l.topics.includes(tid))}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function strip(s){return String(s).replace(/<[^>]+>/g,"")}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function pick(a,n){return shuffle(a).slice(0,n)}

/* ================= saving ================= */
let saveTimer=null,saving=false,saveAgain=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(ME.db&&ME.id&&!ME.gated){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1500)}}
async function pushRemote(){if(saving){saveAgain=true;return}saving=true;
 try{await ME.db.doc("progress/"+ME.id).set({scores:S.scores,log:S.log.slice(0,60),speak:S.speak,updated:Date.now()})}catch(e){}
 saving=false;if(saveAgain){saveAgain=false;pushRemote()}}

/* ================= progress maths ================= */
function mastery(id){const sc=S.scores[id];const t=topic(id);if(!sc||!t)return null;const v=Object.values(sc);if(!v.length)return null;return{pct:Math.round(v.reduce((a,b)=>a+b,0)/t.q.length*100),done:v.length,total:t.q.length}}
function bucketPct(scores,b,n){const sc=scores[b];if(!sc)return 0;const v=Object.values(sc);return n?Math.round(v.reduce((a,x)=>a+x,0)/n*100):0}
function levelStats(L,scores){scores=scores||S.scores;
 const g=L.topics.map(t=>bucketPct(scores,t,topic(t).q.length));
 const r=L.reading.map((x,i)=>bucketPct(scores,"read:"+L.id+":"+i,x.q.length));
 const li=L.listening.map((x,i)=>bucketPct(scores,"listen:"+L.id+":"+i,x.q.length));
 const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
 const sp=(S.speak&&scores===S.scores)?L.speaking.filter((x,i)=>S.speak[L.id+":"+i]).length:0;
 const pr=scores["practice:"+L.id]?Object.keys(scores["practice:"+L.id]).length:0;
 return{grammar:avg(g),reading:avg(r),listening:avg(li),speaking:sp,practice:pr,overall:avg([avg(g),avg(r),avg(li)])}}

function gridHTML(g){return `<div class="gridbox"><table>${g.title?`<caption>${g.title}</caption>`:""}<thead><tr>${g.head.map(h=>`<th>${fmt(h)}</th>`).join("")}</tr></thead><tbody>${g.rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th>${fmt(c)}</th>`:`<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function lessonLayout(t,L){
 const list=L.topics.map(topic);const i=list.indexOf(t);const prev=list[i-1],next=list[i+1];
